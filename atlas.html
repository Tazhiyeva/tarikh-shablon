<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Қазақстан тарихы атласы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: кең экранда сол жақта карта мен слайдер (жабысқақ), оң жақта «Осы кезде» тақтасы; телефонда бәрі бір бағанда */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#18212B; --muted:#5B6670; --line:#D9DED8;
  --accent:#28508A; --accent-soft:#E3EAF5; --ochre:#9A6A12; --ochre-soft:#F6EEDC;
  --land:#F1EEE4; --water:#CFDDE6; --coast:#9DB3C2; --river:#86A9C0; --kz:#8C8F92; --route:#B23A2E; --nb:#8A9096;
  --c1:#2F6DB5; --c2:#C0582B; --c3:#2E8B57; --c4:#8B4FA8; --c5:#B8860B; --c6:#C23B6C; --c7:#1F8A8A; --c8:#6B7B1F;
  --display:"Literata", Georgia, serif; --body:"Golos Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171D; --surface:#1A2129; --ink:#E7ECEF; --muted:#9AA6B0; --line:#2C3640;
  --accent:#8FB2E8; --accent-soft:#1F2E44; --ochre:#E0B25C; --ochre-soft:#2E2617;
  --land:#232A31; --water:#14202B; --coast:#3A4E5E; --river:#3F6A86; --kz:#7D858C; --route:#EE8E82; --nb:#7D868F;
  --c1:#6FA3E6; --c2:#E8895E; --c3:#5FC08A; --c4:#B98AD4; --c5:#E0B44A; --c6:#E77CA2; --c7:#5CC2C2; --c8:#A9BB55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171D; --surface:#1A2129; --ink:#E7ECEF; --muted:#9AA6B0; --line:#2C3640;
  --accent:#8FB2E8; --accent-soft:#1F2E44; --ochre:#E0B25C; --ochre-soft:#2E2617;
  --land:#232A31; --water:#14202B; --coast:#3A4E5E; --river:#3F6A86; --kz:#7D858C; --route:#EE8E82; --nb:#7D868F;
  --c1:#6FA3E6; --c2:#E8895E; --c3:#5FC08A; --c4:#B98AD4; --c5:#E0B44A; --c6:#E77CA2; --c7:#5CC2C2; --c8:#A9BB55; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
button,a,input{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:18px 10px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
header.top h1{font:700 clamp(24px,5vw,34px)/1.1 var(--display);margin:0}
header.top a{color:var(--accent);font-weight:500;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.grid{display:grid;gap:16px;padding-bottom:40px}
@media (min-width:1000px){.grid{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}.stage{position:sticky;top:12px}}
.stage{display:grid;gap:10px;min-width:0}
.mapbox{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--water)}
.mapbox svg{display:block;width:100%;height:auto}
.yearbadge{position:absolute;left:10px;top:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font:700 clamp(18px,3.4vw,26px)/1.3 var(--display);font-variant-numeric:tabular-nums;pointer-events:none}
.viewbtn{position:absolute;right:8px;top:8px;min-height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--body);cursor:pointer}

.controls{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.slider{width:100%;height:44px;accent-color:var(--accent);margin:0}
.ticks{position:relative;height:16px;font-size:11px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.btns{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px}
.btns .btn{padding:0 6px}
@media (max-width:999px){.stage{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:max(6px,env(safe-area-inset-top,0px));padding-bottom:6px;gap:6px}.controls{padding:4px 10px 8px;gap:2px}.slider{height:36px}.btns .btn{min-height:40px;font-size:14px}.mapbox svg{max-height:38vh;width:auto;margin:0 auto}}
.btn{font:500 15px var(--body);min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.era-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.chip{flex:none;min-height:36px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 13px var(--body);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lbl{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.panel{display:grid;gap:14px;min-width:0;grid-template-columns:minmax(0,1fr)}
.card{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h2{font:700 20px/1.25 var(--display);margin:0 0 4px;text-wrap:balance}
.card h3{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.era-text{margin:0;color:var(--muted)}
.rulers{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rulers li{display:grid;grid-template-columns:12px 1fr;gap:8px}
.rulers i{width:12px;height:12px;border-radius:3px;margin-top:6px}
.rulers b{font-weight:600}
.rulers .st{color:var(--muted);font-size:14px}
.y{color:var(--ochre);font-variant-numeric:tabular-nums;font-weight:600}
.grp{margin-top:10px}
.grp:first-of-type{margin-top:0}
.grp h4{margin:0 0 6px;font:600 14px var(--body);color:var(--accent)}
.evs{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.evs li{display:grid;grid-template-columns:16px 1fr;gap:8px;cursor:pointer;border-radius:6px;padding:2px}
.evs li:hover,.evs li.hl{background:var(--accent-soft)}
.evs li.now b{text-decoration:underline;text-decoration-color:var(--ochre);text-underline-offset:3px}
.evs svg{width:14px;height:14px;margin-top:4px}
.evs p{margin:2px 0 0;font-size:15px;color:var(--muted)}
.empty{color:var(--muted);margin:0}
.khans{display:flex;flex-wrap:wrap;gap:6px}
.khans .chip{min-height:34px}

/* map styles */
.m-land{fill:var(--land);stroke:var(--coast);stroke-width:1.2}
.m-lake{fill:var(--water);stroke:var(--coast);stroke-width:1}
.m-river{fill:none;stroke:var(--river);stroke-width:1.5}
.m-kz{fill:none;stroke:var(--kz);stroke-width:2;stroke-dasharray:9 6}
.m-state{stroke-width:2.4;stroke-linejoin:round;transition:opacity .2s}
.m-state.nb{fill:var(--nb);fill-opacity:.12;stroke:var(--nb);stroke-dasharray:7 5}
.m-sname{font:700 30px var(--body);paint-order:stroke;stroke:var(--land);stroke-width:7;stroke-linejoin:round}
.m-sname.nb{fill:var(--nb);font-weight:600;font-style:italic}
.m-cap{font:700 26px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:6}
.m-ev{font:600 25px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:6;stroke-linejoin:round}
.m-ev tspan{fill:var(--ochre)}
.m-route{fill:none;stroke:var(--route);stroke-width:4;stroke-dasharray:14 8;stroke-linecap:round}
.ev-g.hl .hlring{display:block}
.hlring{display:none;fill:none;stroke:var(--ochre);stroke-width:5}
.sym-capital{fill:var(--ink);stroke:var(--surface);stroke-width:3}
.sym-city{fill:var(--ink);stroke:var(--surface);stroke-width:3}
.sym-fort{fill:#2F7A55;stroke:var(--surface);stroke-width:3}
.sym-battle{fill:none;stroke:#B23A2E;stroke-width:5;stroke-linecap:round}
.sym-site{fill:#A0621A;stroke:var(--surface);stroke-width:3}
.sym-uprising{fill:#C23B6C;stroke:var(--surface);stroke-width:3}
.sym-law{fill:#28508A;stroke:var(--surface);stroke-width:3}
.sym-event{fill:#8A3557;stroke:var(--surface);stroke-width:3}
.sym-migration{fill:var(--route);stroke:var(--surface);stroke-width:3}
footer{color:var(--muted);font-size:14px;padding-block:8px 40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header class="top">
  <h1>Қазақстан тарихы атласы</h1>
  <a href="./" id="back">← 120 сұрақ</a>
</header>
<div class="grid">
  <div class="stage">
    <div class="mapbox" id="mapbox">
      <div id="map"></div>
      <div class="yearbadge" id="ybadge"></div>
      <button class="viewbtn" id="view">Кең көрініс</button>
    </div>
    <div class="controls">
      <input class="slider" id="slider" type="range" min="0" max="1000" step="1" value="700" aria-label="Жыл">
      <div class="ticks" id="ticks"></div>
      <div class="btns">
        <button class="btn" id="prev" aria-label="Алдыңғы оқиға">◀ Алдыңғы</button>
        <button class="btn primary" id="play">▶ Ойнату</button>
        <button class="btn" id="next" aria-label="Келесі оқиға">Келесі ▶</button>
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="card"><h2 id="eraname"></h2><p class="era-text" id="eratext"></p></div>
    <div class="card"><h3>Кім билеп тұр</h3><ul class="rulers" id="rulers"></ul></div>
    <div class="card"><h3>Осы кезде</h3><div id="events"></div></div>
    <div class="card"><h3>Дәуірлер</h3><div class="era-chips" id="eras"></div></div>
    <div class="card"><h3>Хандар мен билеушілер</h3><div class="khans" id="khans"></div></div>
  </div>
</div>
<footer>Аумақтар шамамен сызылған. Шайқас пен ескерткіштің орны дауда болса, «шамамен орны» деп белгіленген. Сұр үзік сызық — бүгінгі Қазақстан шекарасы.</footer>
</div>

const ATLAS={"eras": [{"from": -1000000, "to": -12000, "name": "Палеолит (көне тас дәуірі)", "text": "Қазақстан жерінде алғашқы адамдар шамамен 1 млн жыл бұрын пайда болды. Олар Қаратау, Балқаш маңы, Шығыс Қазақстанда шақпақ тастан шапқы, қырғыш, үшкір жасап, аң аулап, жеміс-жидек терді. Кейінгі палеолитте саналы адам қалыптасып, ру қауымы пайда болды."}, {"from": -12000, "to": -5000, "name": "Мезолит (орта тас дәуірі)", "text": "Мұз басу аяқталып, климат жылыды, ірі аңдардың орнын ұсақ әрі жүйрік аңдар басты. Адамдар ұсақ тас кесінділерінен (микролиттерден) құрама құралдар жасап, садақ пен жебені ойлап тапты. Аңшылық пен балық аулау кеңейіп, тайпалар кең далаға тарады."}, {"from": -5000, "to": -4000, "name": "Неолит (жаңа тас дәуірі)", "text": "Тасты тегістеу, бұрғылау, аралау үйренілді, қыш ыдыс пайда болды. Келтеминар, Атбасар, Маханджар мәдениеттерінде тұтынушы шаруашылықтан өндіруші шаруашылыққа — мал өсіру мен егіншілікке — көшу басталды («неолиттік төңкеріс»)."}, {"from": -4000, "to": -2000, "name": "Энеолит (мыс-тас дәуірі)", "text": "Тас құралдармен қатар алғашқы мыс бұйымдар қолданыла бастады. Солтүстік Қазақстандағы Ботай мәдениетінің тұрғындары жылқыны алғашқылардың бірі болып қолға үйретіп, бие сауды. Жылқы кейін көшпелі өмір мен атты әскердің негізіне айналды."}, {"from": -2000, "to": -800, "name": "Қола дәуірі", "text": "Мыс пен қалайыны қорытып, қола алуды үйренді; Жезқазған мен Шығыс Қазақстан кендері игерілді. Андронов мәдениеті тайпалары мал өсіріп, егін екті, жер үй қоныстарда тұрды. Беғазы-Дәндібай кезеңінде ақсүйектерге арналған зәулім кесенелер салынып, қоғам жіктелді."}, {"from": -800, "to": -210, "name": "Ерте темір дәуірі: сақтар мен савроматтар", "text": "Темір кең тарап, көшпелі мал шаруашылығы негізгі кәсіпке айналды. Сақ тайпалық одақтары (тиграхауда, хаомаварга, парадарая, массагеттер) Ахемен Иранына, кейін Александр Македонскийге қарсы соғысты; батыста савроматтар, кейін сарматтар күшейді. Есік, Бесшатыр, Шілікті, Берел обалары сақ ақсүйектерінің байлығы мен «аң стилі» өнерін көрсетеді."}, {"from": -209, "to": 48, "name": "Ғұн державасы, үйсін мен қаңлы", "text": "Мөде шаньюй ғұн тайпаларын біріктіріп, Моңғолия даласынан Жетісуға дейінгі алып держава құрды. Жетісуда үйсіндер, Сыр бойы мен Қаратауда қаңлылар, батыста сарматтар өз мемлекеттерін құрды. Хань елшісі Чжан Цяньның сапарларынан кейін Ұлы Жібек жолы жұмыс істей бастады."}, {"from": 48, "to": 552, "name": "Ғұндардың бөлінуі және Халықтардың ұлы қоныс аударуы", "text": "Ғұн мемлекеті оңтүстік және солтүстік болып бөлініп, солтүстік ғұндар Хань соққысынан кейін батысқа кетті. IV ғасырда олар Еділден өтіп, аландар мен готтарды жеңді де, Еуропада халықтардың ұлы қоныс аударуын бастады. Аттила тұсында ғұн державасы Рейннен Еділге дейін созылды, ал Қазақстанда үйсін мен қаңлы әлсіреп, жужандардың қысымына түсті."}, {"from": 552, "to": 704, "name": "Түрік қағанаты және Батыс Түрік қағанаты", "text": "Бумын жужандарды жеңіп, Түрік қағанатын құрды; Мұқан мен Истеми тұсында ол Маньчжуриядан Қара теңізге дейін жайылды. 603 жылы қағанат екіге бөлініп, Жетісу мен Сыр бойы Батыс Түрік қағанатының өзегіне айналды. Ел «он оқ» жүйесімен басқарылды, ал ішкі тартыс пен Таң империясының соғыстары оны әлсіретті."}, {"from": 704, "to": 942, "name": "Түргеш, Қарлұқ, Оғыз және Қимақ", "text": "Түргештер Жетісуда қағанат құрып, Сұлу қаған тұсында араб жаулауын тоқтатты. 751 жылғы Атлах шайқасынан кейін Орталық Азияда Таң ықпалы тоқтап, Жетісуда Қарлұқ мемлекеті, Сыр бойында Оғыз мемлекеті, Ертіс бойында Қимақ қағанаты күшейді."}, {"from": 942, "to": 1128, "name": "Қарахан мемлекеті және исламның таралуы", "text": "Қарахандар Баласағұн мен Қашғарды астана етіп, ислам дінін мемлекеттік дін деп жариялады. Қалалар өсіп, түркі тіліндегі алғашқы ірі еңбектер — «Құтадғу біліг» пен «Диуани лұғат-ит-түрк» жазылды. Солтүстікте қимақтардан билік қыпшақтарға өтіп, Ертістен Дунайға дейінгі дала Дешті Қыпшақ атанды."}, {"from": 1128, "to": 1218, "name": "Қарақытай, Найман, Керей және Дешті Қыпшақ", "text": "Шығыстан келген қидандар Баласағұнды алып, Қарақытай мемлекетін құрды, Қарахандар оның вассалына айналды. Шығыста наймандар мен керейлер күшті хандық құрды, бірақ XIII ғасыр басында Шыңғыс ханнан жеңілді. Қожа Ахмет Ясауи Түркістанда сопылық ілімді таратты, ал Сыр бойындағы қалалар Хорезм мен қыпшақтардың таласына түсті."}, {"from": 1218, "to": 1227, "name": "Моңғол шапқыншылығы", "text": "Отырар оқиғасынан кейін Шыңғыс хан Сыр бойы мен Мәуереннахр қалаларын қиратты. Қазақ жері Моңғол империясына кіріп, Жошы, Шағатай, Үгедей ұлыстарына бөлінді."}, {"from": 1227, "to": 1266, "name": "Алтын Орданың құрылуы", "text": "Батый Батыс жорығынан кейін 1243 жылы Еділ бойында Алтын Орданы құрды. Берке исламды қабылдап, Мысыр мәмлүктерімен одақ жасады, Жошы ұлысы Қарақорымнан алшақтады."}, {"from": 1266, "to": 1359, "name": "Алтын Орданың гүлденуі", "text": "Алтын Орда өз атынан теңге соғып, дербес мемлекетке айналды. Өзбек хан исламды мемлекеттік дін етті; Сыр бойында Ақ Орда хандары қала мәдениетін көтерді, Жетісуда Моғолстан құрылды."}, {"from": 1359, "to": 1405, "name": "Ұлы дүрбелең және Ақсақ Темір", "text": "Алтын Ордада тақ таласы басталып, Орыс хан Ақ Орданы дербес етті. Тоқтамыс екі Орданы біріктірді, бірақ Ақсақ Темірден 1391 және 1395 жылдары жеңілді."}, {"from": 1405, "to": 1465, "name": "Алтын Орданың ыдырауы", "text": "Алтын Орданың орнында Ноғай Ордасы, Әбілқайыр хандығы, Қазан мен Қырым хандықтары пайда болды. Әбілқайырдан бөлінген Керей мен Жәнібек Моғолстанға көшіп, Қазақ хандығының іргесін қалады."}, {"from": 1465, "to": 1523, "name": "Қазақ хандығының құрылуы мен күшеюі", "text": "Керей мен Жәнібек Жетісуда хандық құрып, Әбілқайыр өлген соң Дешті Қыпшақ тайпаларын өздеріне тартты. Бұрындық пен Қасым тұсында Сыр бойы қалалары үшін Шайбанилермен күрес жүрді, Қасым хан елді ең кең шегіне жеткізіп, «қасқа жолын» енгізді."}, {"from": 1523, "to": 1598, "name": "Ішкі талас және қайта бірігу", "text": "Қасымнан кейін хандар жиі ауысып, ноғайлар мен моғолдардан жеңіліп, хандық әлсіреді. Хақназар елді қайта біріктірді, Тәуекел Мәскеумен елшілік алмасып, 1598 жылы Ташкент пен Сыр бойы қалаларын қосты."}, {"from": 1598, "to": 1718, "name": "Түркістан кезеңі және жоңғар қаупі", "text": "Есім хан ордасын Түркістанға көшіріп, «ескі жолды» енгізді. 1635 жылы құрылған Жоңғар хандығы шығыстан қыса бастады: Жәңгір Орбұлақта жеңді, Тәуке «Жеті жарғымен» елдің ішкі тәртібін бекітті."}, {"from": 1718, "to": 1731, "name": "Ақтабан шұбырынды және азаттық соғыс", "text": "Тәукеден кейін хандық жүздерге бөлініп, 1723 жылы жоңғарлар Жетісу мен Сыр бойын басып алды. Үш жүз Ордабасыда бірігіп, Бұланты мен Аңырақайда жауды жеңді, бірақ жеңістен кейін хандар арасындағы алауыздық қайта өршіді."}, {"from": 1731, "to": 1758, "name": "Ресей бодандығының басталуы", "text": "Кіші жүз 1731 жылы, кейін Орта жүздің бір бөлігі Ресейге ант берді. Ресей Орынбор, Есіл, Ертіс шептерін салып, далаға жақындады; жоңғар соғысы жалғасып, 1756–1758 жылдары Жоңғар хандығын Цин империясы жойды."}, {"from": 1758, "to": 1781, "name": "Абылай заманы", "text": "Жоңғар құлаған соң қазақтар шығыс жерлеріне қайта оралды. Абылай Ресей мен Цин арасында икемді саясат жүргізіп, 1771 жылы үш жүздің ханы болып сайланды; Кіші жүзде Нұралы ханның билігі әлсіреп, Пугачев көтерілісіне қазақтар да қатысты."}, {"from": 1781, "to": 1822, "name": "Хан билігінің әлсіреуі", "text": "Абылайдан кейін Орта жүзде, Нұралыдан кейін Кіші жүзде хан билігі әлсіреп, Сырым Датұлы көтерілісі болды. 1801 ж. Бөкей ордасы құрылды, Ұлы жүздің оңтүстігі Қоқанның қол астына түсті."}, {"from": 1822, "to": 1847, "name": "Хандықтың жойылуы және ұлт-азаттық күрес", "text": "1822 және 1824 жылғы жарғылар Орта және Кіші жүзде хан билігін жойып, округтер мен бекіністер ашты. Исатай–Махамбет мен Кенесары көтерілістері болып, Кенесары Қазақ хандығын қалпына келтіруге тырысты."}, {"from": 1847, "to": 1868, "name": "Жетісу мен Оңтүстіктің жаулап алынуы", "text": "Ресей Қапал (1847), Ақмешіт (1853), Верный (1854) арқылы Сыр бойы мен Жетісуға енді; 1864–1865 жж. Түркістан, Шымкент, Ташкент алынды. Сыр бойында Есет пен Жанқожа көтерілді, Шоқан Уәлиханов зерттеулерін жүргізді."}, {"from": 1868, "to": 1905, "name": "Отарлық басқару және қоныс аудару", "text": "1867–1868 жж. ережелер бүкіл қазақ жерін облыс, уез, болысқа бөліп, жерді мемлекет меншігі деп жариялады. Қоныс аудару басталды, Алтынсарин мен Абай ағартушылық ойды дамытты."}, {"from": 1905, "to": 1917, "name": "Революция, Дума және 1916 жылғы көтеріліс", "text": "1905 ж. Қарқаралы петициясы, Думадағы қазақ депутаттары, «Айқап» пен «Қазақ» ұлттық қозғалысты өрістетті. Столыпин реформасы жерді тартып алуды күшейтіп, 1916 ж. жарлық Жетісу мен Торғайда ұлт-азаттық көтеріліске ұласты."}, {"from": 1917, "to": 1919, "name": "Революциялар және Алаш автономиясы", "text": "Ақпан мен Қазан төңкерістерінен кейін Алаш зиялылары ұлттық автономия құрып, Алашорда үкіметін жасақтады. Оңтүстікте Түркістан (Қоқан) автономиясы жарияланып, көп ұзамай қарумен таратылды. Қазақ даласы ақтар мен қызылдардың азамат соғысына айналды."}, {"from": 1920, "to": 1927, "name": "Қазақ АКСР-інің құрылуы және ЖЭС", "text": "1920 жылы Орынбор астана болып Қырғыз (Қазақ) АКСР-і құрылды, 1924 жылғы межелеуден кейін Сырдария мен Жетісу қазақтары бір республикаға бірікті. Жаңа экономикалық саясат шаруашылықты біраз қалпына келтірді, 1925 жылы астана Қызылордаға көшті."}, {"from": 1928, "to": 1940, "name": "Ұжымдастыру, ашаршылық, индустрия, қуғын-сүргін", "text": "Голощекиннің «Кіші Қазан» саясаты, байларды тәркілеу мен күштеп ұжымдастыру 1931–1933 жылдардағы ашаршылыққа апарып, қазақтардың жартысына жуығы қырылды не көшіп кетті. Түрксіб, Қарағанды, Балқаш салынды, 1937–1938 жылдары ұлт зиялылары атылып, Қазақстан лагерьлер мен жер аударылғандар өлкесіне айналды."}, {"from": 1941, "to": 1945, "name": "Ұлы Отан соғысы", "text": "Қазақстан майданға адам, астық, көмір, металл берді; Алматыда Панфилов дивизиясы жасақталды, Момышұлы, Мәметова, Молдағұлова ерлігімен танылды. Батыстан көшірілген зауыттар республикада қалып, жер аударылған халықтар қоныстандырылды."}, {"from": 1946, "to": 1964, "name": "Соғыстан кейінгі жылдар, полигон, тың", "text": "Ғылым академиясы ашылды, бірақ идеологиялық қысым күшейді (Бекмаханов ісі). 1949 жылдан Семей полигонында ядролық сынақтар басталды, 1954 жылдан тың игеріліп, Байқоңыр салынды, ХХ съезден кейін «жылымық» кезінде қуғын-сүргін құрбандары ақтала бастады."}, {"from": 1965, "to": 1985, "name": "Қонаев дәуірі және тоқырау", "text": "Д. Қонаев басқарған жылдары Маңғыстау мұнайы, Екібастұз көмірі, жаңа қалалар мен Алматыдағы ірі құрылыстар пайда болды. Сонымен бірге экономика шикізатқа байланып, Арал тартылды, 1979 жылы Целиноградта неміс автономиясына қарсы шеру болды."}, {"from": 1986, "to": 1991, "name": "Қайта құру, Желтоқсан, егемендік", "text": "1986 жылғы Желтоқсан көтерілісі ұлттық сананы оятты, «Невада–Семей» қозғалысы мен Тілдер туралы заң қоғамды жандандырды. 1990 жылы Егемендік декларациясы қабылданып, 1991 жылғы тамыздан кейін Семей полигоны жабылды, 16 желтоқсанда тәуелсіздік жарияланды."}, {"from": 1991, "to": 1997, "name": "Тәуелсіз мемлекеттің негізін қалау", "text": "Қазақстан тәуелсіздігін жариялап, ТМД-ны құруға қатысты, рәміздерді, теңгені, екі Конституцияны қабылдады. Ядролық қарудан бас тартып, шекараны келісе бастады. Бағаның шарықтауы, өндірістің құлдырауы мен жекешелендіру ауыр дағдарыс туғызды."}, {"from": 1997, "to": 2010, "name": "Жаңа елорда және мұнай өрлеуі", "text": "Елорда Ақмолаға көшіп, Астана атанды. Теңіз, Қашаған, КТК мен Қытайға құбырлар арқылы мұнай экспорты өсіп, Ұлттық қор құрылды. Барлық көршімен шекара шартпен бекітілді, ШЫҰ құрылды."}, {"from": 2010, "to": 2019, "name": "Халықаралық бедел мен ішкі шиеленіс", "text": "Қазақстан ЕҚЫҰ-ға төрағалық етіп, ЕАЭО-ға кірді, ЭКСПО-2017-ні өткізді. Сонымен бірге Жаңаөзен оқиғасы, 2015 жылғы девальвация, 2016 жылғы жер митингілері қоғамдағы наразылықты көрсетті."}, {"from": 2019, "to": 2022, "name": "Билік транзиті және Қаңтар оқиғасы", "text": "2019 жылы Н. Назарбаев билікті Қ. Тоқаевқа берді, елорда Нұр-Сұлтан деп аталды. Пандемия мен 2022 жылғы Қаңтар оқиғасы саяси жүйені қайта құруды тездетті."}, {"from": 2022, "to": 2026, "name": "«Әділетті Қазақстан» және жаңа Конституция", "text": "2022 жылғы референдум Конституциялық сотты қайтарып, Президентке бір рет 7 жылдық мерзім енгізді; Ұлттық құрылтай бес рет жиналды. 2026 жылғы жаңа Конституция бір палаталы Құрылтай мен вице-президент лауазымын енгізді."}], "states": [{"id": "kelteminar", "name": "Келтеминар мәдениеті", "kind": "kz", "from": -5000, "to": -3000, "shapes": [{"from": -5000, "to": -3000, "coords": [[57, 41], [57.5, 44], [59, 46], [61.5, 46.5], [63, 45], [64, 42.5], [62, 40.5], [59, 40]]}], "capitals": [], "rulers": []}, {"id": "makhandzhar", "name": "Маханджар мәдениеті", "kind": "kz", "from": -5000, "to": -3500, "shapes": [{"from": -5000, "to": -3500, "coords": [[61, 48.5], [61, 51], [62.5, 52.5], [64.5, 52.5], [65.5, 51], [65.3, 50], [65, 49], [63.5, 48]]}], "capitals": [], "rulers": []}, {"id": "atbasar", "name": "Атбасар мәдениеті", "kind": "kz", "from": -5000, "to": -3500, "shapes": [{"from": -5000, "to": -3500, "coords": [[66, 50.5], [66.5, 52.5], [68, 53.5], [70.5, 53.5], [72, 52.5], [71.5, 50.8], [69.5, 50], [67.5, 50]]}], "capitals": [], "rulers": []}, {"id": "botai", "name": "Ботай мәдениеті", "kind": "kz", "from": -3700, "to": -3100, "shapes": [{"from": -3700, "to": -3100, "coords": [[64, 52], [64.5, 54], [66, 55], [68.5, 55.3], [70.5, 54.5], [71, 53], [70, 52], [67.5, 51.6], [65.5, 51.6]]}], "capitals": [], "rulers": []}, {"id": "tersek", "name": "Терсек мәдениеті", "kind": "kz", "from": -3700, "to": -3000, "shapes": [{"from": -3700, "to": -3000, "coords": [[61.5, 48.5], [61.8, 50.6], [62.8, 51.6], [64.2, 51.7], [65.3, 50.8], [65.3, 49.3], [64.2, 48.4], [62.6, 48.1]]}], "capitals": [], "rulers": []}, {"id": "andronovo", "name": "Андронов мәдениеті", "kind": "kz", "from  Сарай-Беркені салдырды."}, {"from": 1266, "to": 1280, "name": "Меңгу-Темір", "did": "Өз атынан теңге соқтырып, Қарақорымнан іс жүзінде бөлінді. 1269 жылғы Талас құрылтайына қатысты."}, {"from": 1291, "to": 1312, "name": "Тоқта", "did": "Батыс шетте билікті өз қолына алған Ноғай әмірді 1299–1300 жылдары жеңіп, хан билігін күшейтті."}, {"from": 1312, "to": 1342, "name": "Өзбек хан", "did": "Исламды мемлекеттік дін етті, билікті орталыққа жинады. Византиямен, Мысырмен, Генуя мен Венециямен байланысты кеңейтті; Алтын Орда ең қуатты кезеңіне жетті."}, {"from": 1342, "to": 1357, "name": "Жәнібек", "did": "Кафаны қоршады, тұсында оба індеті халықты қырды. Өлтірілген соң ел ұзақ тартысқа түсті."}, {"from": 1357, "to": 1359, "name": "Бердібек", "did": "Әкесі Жәнібекті өлтіріп таққа отырды, бауырларын қырды. Онымен Батый әулетінің билігі үзілді."}, {"from": 1359, "to": 1380, "name": "Ұлы дүрбелең: Мамай және тақ таласындағы хандар", "did": "20 жылда жиырмадан астам хан ауысты. Батыс бөлікте бекләрбек Мамай өз хандарын отырғызып билеп, 1380 жылы Куликово шайқасында жеңілді."}, {"from": 1380, "to": 1395, "name": "Тоқтамыс", "did": "Ақ Орда мен Алтын Орданы қайта біріктірді, 1382 жылы Мәскеуді өртеді. Ақсақ Темірмен соғысып, 1391 және 1395 жылдары ауыр жеңілді."}, {"from": 1396, "to": 1399, "name": "Темір-Құтлық", "did": "Едігенің қолдауымен хан болды. 1399 жылы Ворскла шайқасында Тоқтамыс пен Литва князі Витовтты жеңді."}, {"from": 1399, "to": 1407, "name": "Шәдібек", "did": "Билікті іс жүзінде Едіге жүргізді; Тоқтамысты Сібірге дейін қуды."}, {"from": 1407, "to": 1419, "name": "Едіге отырғызған хандар", "did": "Пұлат, Темір және басқа хандар қысқа уақыт билеп, бір-бірін тақтан тайдырды. Мемлекетті іс жүзінде Едіге басқарды."}, {"from": 1419, "to": 1437, "name": "Ұлы Мұхаммед", "did": "Тақ үшін Барақ ханмен, Кіші Мұхаммедпен соғысты. Жеңілген соң Еділ бойының солтүстігіне кетіп, 1438 жылы Қазан хандығының негізін қалады."}, {"from": 1437, "to": 1459, "name": "Кіші Мұхаммед", "did": "Қазан мен Қырым бөлінген соң Еділдің төменгі бойындағы Ұлы Орданы биледі."}, {"from": 1459, "to": 1465, "name": "Махмұд", "did": "Ұлы Орданы биледі. Кейін Астраханға кетіп, Астрахан хандығын құрды (кей деректе хандықтың негізін ұлы Қасым қалаған)."}, {"from": 1465, "to": 1481, "name": "Ахмед хан", "did": "Мәскеуден алым жинауды қайта бастамақ болды, бірақ 1480 жылы Угра өзенінде шайқассыз кері қайтты. Мұнымен орыс жерінің тәуелділігі аяқталды."}, {"from": 1481, "to": 1502, "name": "Шейх-Ахмед", "did": "Ұлы Орданың соңғы ханы. 1502 жылы Қырым ханы Меңлі-Гирей Сарайды талқандап, Ұлы Орда біржола жойылды."}], "names": [{"from": 1224, "name": "Жошы ұлысы (Алтын Орда)"}, {"from": 1242, "name": "Ұлы Орда (Алтын Орданың қалдығы)"}]}, {"id": "chagatai-ulus", "name": "Шағатай ұлысы", "kind": "kz", "from": 1224, "to": 1348, "shapes": [{"from": 1224, "to": 1348, "coords": [[62, 39], [61, 42], [66, 44.5], [70, 46], [76, 47], [80, 46.5], [84, 45], [89, 43], [89, 39], [80, 37.5], [70, 37], [65, 37.5]]}], "capitals": [{"from": 1224, "to": 1348, "name": "Алмалық", "lon": 80.53, "lat": 44.24, "note": "Іле бойындағы орталық"}], "rulers": [{"from": 1224, "to": 1242, "name": "Шағатай", "did": "Шыңғыс ханның екінші ұлы. Жетісу, Шығыс Түркістан және Мәуереннахр оның ұлысы болды; «Ұлы Ясаның» сақталуын қадағалады."}, {"from": 1266, "to": 1271, "name": "Барақ", "did": "1269 жылғы Талас құрылтайында Мәуереннахрдың үштен екісін алды. Хорасанға жорықта Ілхандардан жеңілді."}, {"from": 1282, "to": 1306, "name": "Дува", "did": "Ұзақ уақыт Үгедей әулетінен шыққан Қайдуға бағынып, онымен бірге ұлы ханға қарсы соғысты. Қайду өлген соң Үгедей ұлысын өзіне қаратты."}, {"from": 1318, "to": 1326, "name": "Кебек", "did": "Ордасын Мәуереннахрға көшіріп, Қаршы қаласын салдырды. Ақша мен әкімшілік реформасын жүргізді."}, {"from": 1331, "to": 1334, "name": "Тармаширин", "did": "Исламды қабылдады. Оған наразы көшпелі ақсүйектер көтеріліп, 1334 жылы өлтірілді; ұлыс шығыс (Моғолстан) және батыс (Мәуереннахр) бөлікке ыдырай бастады. Кей деректе билігі 1326 жылдан басталады."}]}, {"id": "ogedei-ulus", "name": "Үгедей ұлысы", "kind": "kz", "from": 1224, "to": 1309, "shapes": [{"from": 1224, "to": 1309, "coords": [[80, 46.5], [81, 49], [84, 51], [89, 52], [94, 51], [95.5, 48], [94, 45], [89, 43], [84, 45]]}], "capitals": [{"from": 1224, "to": 1309, "name": "Емел", "lon": 83.6, "lat": 46.5, "note": "шамамен орны; Тарбағатайдағы орда"}], "rulers": [{"from": 1224, "to": 1241, "name": "Үгедей", "did": "Шыңғыс ханның үшінші ұлы. Ұлысы Батыс Моңғолия, Жоғарғы Ертіс пен Тарбағатай болды; 1229 жылы ұлы хан болып сайланды."}, {"from": 1269, "to": 1301, "name": "Қайду", "did": "Үгедей ұлысын қайта көтеріп, Шағатай ұлысын өзіне бағындырды. Отыз жыл бойы Құбылай мен оның ұрпақтарына қарсы соғысты."}, {"from": 1301, "to": 1309, "name": "Шапар", "did": "Әкесі Қайдудан кейін таққа отырды, бірақ Дувадан жеңіліп, ұлыс Шағатай ұлысына қосылды."}]}, {"id": "ak-orda", "name": "Ақ Орда", "kind": "kz", "from": 1243, "to": 1428, "shapes": [{"from": 1243, "to": 1396, "coords": [[56, 44], [54, 48], [58, 51], [63, 52], [68, 53], [73, 52], [75, 49], [73, 46], [71, 44], [69, 42.5], [66, 43], [62, 44]]}, {"from": 1396, "to": 1428, "coords": [[58, 44.5], [59.5, 47.5], [60.5, 51], [63, 52], [68, 53], [73, 52], [75, 49], [73, 46], [71, 44], [69, 42.5], [66, 43], [62, 44]]}], "capitals": [{"from": 1243, "to": 1428, "name": "Сығанақ", "lon": 66.96, "lat": 44.16, "note": "Ақ Орда астанасы; деректерде сол қанат «Ақ Орда» немесе «Көк Орда» деп әртүрлі аталады"}], "rulers": [{"from": 1243, "to": 1280, "name": "Орда-Ежен және ұрпақтары", "did": "Жошының үлкен ұлы Орда-Ежен Алтын Орданың сол қанатын биледі. Ұлысы Ертістен Сырдарияға дейін созылды."}, {"from": 1309, "to": 1315, "name": "Сасы-Бұқа", "did": "Алтын Орда ханы Өзбекке бағынышты болды. Сығанақ маңына жерленген."}, {"from": 1315, "to": 1320, "name": "Ерзен", "did": "Сығанақ, Отырар, Сауран, Жент, Баршынкентте мешіт, медресе салдырып, қала мәдениетін көтерді. Деректерде билік жылдары әртүрлі беріледі (кейбірінде 1320–1344)."}, {"from": 1320, "to": 1344, "name": "Мүбарак-қожа", "did": "Сығанақта өз атынан теңге соқтырып, Сарайдан бөлінуге талпынды. Ақырында тақтан тайдырылды."}, {"from": 1344, "to": 1361, "name": "Шымтай", "did": "Ақ Орданы ұлы дүрбелең жылдарында биледі. Тұсында сол қанат Сарай істерінен алшақтай түсті."}, {"from": 1361, "to": 1377, "name": "Орыс хан", "did": "Сығанақтан билікті бір қолға жинап, сұлтандарды бағындырды. 1374–1375 жылдары Сарайға жорық жасап, Ақсақ Темір қолдаған Тоқтамыспен соғысты. Кейбір деректе 1368 жылдан билеген."}, {"from": 1377, "to": 1379, "name": "Тоқтақия мен Темір-Мәлік", "did": "Орыс ханның ұлдары қысқа уақыт биледі. Темір-Мәлік Тоқтамыстан жеңіліп, Ақ Орда соның қолына өтті."}, {"from": 1379, "to": 1395, "name": "Тоқтамыс", "did": "Ақ Орданы алып, 1380 жылы Алтын Орда тағына да отырды. Ақ Орда Алтын Орданың құрамына қайта енді."}, {"from": 1395, "to": 1423, "name": "Құйыршақ және тақ таласы", "did": "Ақсақ Темір қолдаған Орыс ханның ұлы Құйыршақ биледі. Кейін сол қанатта хандар жиі ауысты."}, {"from": 1423, "to": 1428, "name": "Барақ хан", "did": "Ұлықбектің қолдауымен таққа отырып, Ұлы Мұхаммедті Сарайдан қуды; кейін Темір ұрпақтарымен соғысты. 1428 жылы өлтірілгеннен кейін Ақ Орда ыдырады."}]}, {"id": "nogai-horde", "name": "Ноғай Ордасы", "kind": "kz", "from": 1396, "to": 1634, "shapes": [{"from": 1396, "to": 1465, "coords": [[47.5, 46], [48.2, 50], [50.5, 53], [54, 54], [57, 53], [59, 50], [57, 47], [54, 45], [50, 44.5]]}, {"from": 1465, "to": 1511, "coords": [[46, 46], [47, 50], [50, 53], [54, 54], [57, 53], [59, 50], [57, 47], [54, 45], [50, 44.5]]}, {"from": 1511, "to": 1557, "coords": [[47.5, 46], [48, 50], [50, 53], [53, 54.5], [56, 54], [55, 51.5], [52, 50], [51.5, 47], [50, 45.5]]}, {"from": 1557, "to": 1634, "coords": [[46.5, 46], [47, 49], [49, 51.5], [52.5, 52.5], [55, 52], [54, 49.5], [53.5, 47], [51.5, 46.5], [49.5, 45.5]]}], "capitals": [{"from": ң ордасы, хан осында жерленген"}, {"from": 1523, "to": 1538, "name": "Жетісу мен Талас ордасы", "lon": 73.5, "lat": 43.5, "note": "шамамен орны: Тахир мен Бұйдаш тұсында орда көшпелі болды"}, {"from": 1538, "to": 1598, "name": "Сыр бойы мен Түркістан өңірі", "lon": 67.77, "lat": 43.52, "note": "шамамен орны: Хақназар, Шығай, Тәуекел ордасы бір қалада тұрақтамай, Сыр бойы мен Ұлытау арасында көшіп жүрді; Хақназар 1580 жылы Түркістан маңында қаза тапты"}, {"from": 1598, "to": 1723, "name": "Түркістан", "lon": 68.27, "lat": 43.3, "note": "Есім хан ордасын көшірді; Тәуке тұсында Күлтөбе жиындары"}, {"from": 1740, "to": 1781, "name": "Түркістан", "lon": 68.27, "lat": 43.3, "note": "жоңғардан қайтарылған соң Әбілмәмбет ордасы; 1771 ж. Абылай осында хан көтерілді"}, {"from": 1841, "to": 1845, "name": "Кенесары ордасы (Торғай–Ұлытау)", "lon": 65.0, "lat": 49.0, "note": "көшпелі орда, шамамен орны"}, {"from": 1845, "to": 1846, "name": "Кенесары ордасы (Ұлытау–Сарысу)", "lon": 67.5, "lat": 47.5, "note": "көшпелі орда, шамамен орны"}, {"from": 1846, "to": 1847, "name": "Кенесары ордасы (Іле бойы)", "lon": 76.5, "lat": 44.5, "note": "көшпелі орда, шамамен орны"}], "rulers": [{"from": 1465, "to": 1474, "name": "Керей хан", "did": "Жәнібекпен бірге Моғолстанның батысында, Шу мен Қозыбасыда хандықты құрды; Әбілқайыр өлген соң Дешті Қыпшақтың тайпаларын өзіне тартты."}, {"from": 1474, "to": 1480, "name": "Жәнібек хан", "did": "Хандықтың негізін қалаушылардың бірі; Сыр бойы қалалары үшін Шайбанилермен күресті, ұлдары Қасым, Әдік, Жәдік кейін ел билеуге араласты."}, {"from": 1480, "to": 1511, "name": "Бұрындық хан", "did": "Керейдің ұлы; Сығанақ, Сауран, Созақ үшін Мұхаммед Шайбанимен ұзақ соғысты. Беделі Қасым сұлтанға ауысқан соң Мауараннахрға кетіп, сонда қайтыс болды."}, {"from": 1511, "to": 1521, "name": "Қасым хан", "did": "Шайбаниді жеңіп, хандықтың аумағын ең кең шегіне жеткізді, ордасын Сарайшыққа қойды. «Қасым ханның қасқа жолы» заңын енгізіп, Мәскеу мемлекетімен (III Василий) байланыс орнатты. Қайтыс болған жылы кейбір деректе 1518."}, {"from": 1521, "to": 1523, "name": "Мамаш хан", "did": "Қасымның ұлы; ноғайлармен соғыста қаза тапты, хандық батыс жерлерінен айырыла бастады."}, {"from": 1523, "to": 1533, "name": "Тахир хан", "did": "Қасымның бауыры Әдік сұлтанның ұлы; ноғайлардан және моғол ханынан жеңіліп, халықтың бір бөлігімен Жетісу мен Тянь-Шаньға шегінді, қырғыздарға сүйенді."}, {"from": 1533, "to": 1534, "name": "Бұйдаш хан", "did": "Тахирдің інісі; моғолдарға қарсы соғыста жеңіліп, хандық одан әрі әлсіреді. Билік жылдары кейбір деректе 1533–1538. Осы кезде батыста Ахмед хан да хан атанып, 1535 жылы ноғайлармен соғыста қаза тапты деген дерек бар."}, {"from": 1535, "to": 1537, "name": "Тоғым хан", "did": "Жәдік сұлтанның ұлы; моғол ханы Әбд ар-Рашидпен шайқаста 37 сұлтанмен бірге қаза тапты."}, {"from": 1538, "to": 1580, "name": "Хақназар хан", "did": "Қасымның ұлы; ыдыраған хандықты қайта біріктіріп, ноғайлардың шығыс бөлігін бағындырды, моғолдармен Жетісу үшін соғысты. Мәскеумен елшілік байланысын жалғастырды; 1580 жылы қастандықтан өлді."}, {"from": 1580, "to": 1582, "name": "Шығай хан", "did": "Жәдік сұлтанның ұлы; Бұхара ханы II Абдолламен одақтасып, Ташкент билеушісі Бабас сұлтанға қарсы соғысты, Ходжентті иеленді."}, {"from": 1582, "to": 1598, "name": "Тәуекел хан", "did": "Шығайдың ұлы; 1594 жылы Құл-Мұхаммед елшілігін Мәскеуге жіберді. 1598 жылы Бұхараға жорық жасап, Ташкент пен Сыр бойы қалаларын қосты, жарақаттан қайтыс болды. Билігінің басы кейбір деректе 1586."}, {"from": 1598, "to": 1628, "name": "Есім хан", "did": "Тәуекелдің інісі; ордасын Түркістанға көшіріп, «Есім ханның ескі жолы» заңын енгізді. Бұхарамен бітімге келіп, Ташкент ханы Тұрсынды 1627 жылы жеңді, қалмақтарға қарсы соғысты."}, {"from": 1629, "to": 1652, "name": "Жәңгір хан", "did": "Есімнің ұлы, «Салқам Жәңгір»; жоңғарларға қарсы сұлтандар мен батырларды біріктірді. 1643 жылы Орбұлақта Батур-хунтайшыны жеңді, 1652 жылы жоңғармен шайқаста қаза тапты."}, {"from": 1652, "to": 1680, "name": "Батыр хан (дауда)", "did": "Жәңгірден кейін билік құрды деген дерек бар; бұл жылдар туралы мәлімет аз сақталған, хандық жоңғар мен Бұхара арасында ауыр күйде болды."}, {"from": 1680, "to": 1715, "name": "Тәуке хан", "did": "Жәңгірдің ұлы; Түркістан маңындағы Күлтөбеде билер кеңесін жинап, Төле, Қазыбек, Әйтеке билермен «Жеті жарғыны» қабылдады. Жоңғар шабуылдарына қарсы тұрып, Ресеймен елшілік алмасты. Қайтыс болған жылы кейбір деректе 1718."}, {"from": 1715, "to": 1718, "name": "Қайып хан", "did": "Тәукеден кейін хан болды; оның тұсында сұлтандар арасындағы бәсеке күшейіп, хандықтың жүздерге бөлінуі тереңдеді."}, {"from": 1718, "to": 1729, "name": "Болат хан", "did": "Тәукенің ұлы, ресми бас хан; Ақтабан шұбырынды кезінде билігі әлсіз болды. 1726 жылғы Ордабасы жиынына қатысты, Аңырақай шайқасы тұсында қайтыс болды."}, {"from": 1730, "to": 1771, "name": "Әбілмәмбет хан", "did": "Болаттың ұлы; Аңырақайдан кейін бас хан болып сайланды, ордасы Түркістанда болды. 1740 жылы Ресейге ант берді, іс жүзінде билік Абылайдың қолына көшті."}, {"from": 1771, "to": 1781, "name": "Абылай хан", "did": "1771 жылы Түркістанда үш жүздің ханы болып ақ киізге көтерілді. Ресей мен Цин арасында дербестікті сақтап, қырғыздар мен Қоқанға қарсы соғысты; қайтыс болған соң Түркістанда жерленді."}, {"from": 1841, "to": 1847, "name": "Кенесары хан", "did": "1841 ж. үш жүздің өкілдері хан сайлады; хан кеңесін құрып, салық (зекет) жинады, әскерді жүздік-мыңдыққа бөлді. Ресейден Орта жүз жерін қайтаруды талап етті, 1847 ж. қырғыздармен соғыста қаза тапты."}], "names": [{"from": 1465, "name": "Қазақ хандығы"}, {"from": 1841, "name": "Қазақ хандығы (Кенесары)"}]}, {"id": "kishi-zhuz", "name": "Кіші жүз", "kind": "kz", "from": 1718, "to": 1824, "shapes": [{"from": 1718, "to": 1781, "coords": [[50, 46], [50.5, 50], [53, 51.3], [57, 51.5], [61, 51.5], [63, 50], [64, 47], [63, 45], [61, 44], [58, 44], [54, 44.5], [52, 45]]}, {"from": 1781, "to": 1824, "coords": ғы ерте палеолит тұрағы: өзен малтатасынан жасалған шапқы құралдар табылды. Қазақстандағы ең көне ескерткіштердің бірі (шамамен 1 млн жыл)."}, {"from": -1000000, "to": -140000, "name": "Бөріқазған тұрағы", "type": "site", "where": "Қаратау", "lon": 70.75, "lat": 43.42, "text": "Ерте палеолит шеберханасы: шақпақ тастан қол шапқы, қырғыш, үшкір жасалған. 1958 ж. Х.Алпысбаев ашты."}, {"from": -1000000, "to": -12000, "name": "Шабақты мен Қазанғап тұрақтары", "type": "site", "where": "Қаратау", "lon": 69.6, "lat": 43.6, "text": "Қаратаудағы палеолит тұрақтары тобына жатады; тас құралдар табылған. Нақты мерзімдері әр түрлі беріледі."}, {"from": -1000000, "to": -140000, "name": "Семізбұғы", "type": "site", "where": "Балқаш маңы", "lon": 74.9, "lat": 46.9, "text": "Балқаштың солтүстігіндегі палеолит шеберханалары; мұнда тас құралдар жасауға қажет шикізат мол болған. Орны шамамен."}, {"from": -140000, "to": -40000, "name": "Орта палеолит (мустье)", "type": "event", "where": "Қазақстан", "lon": 70.0, "lat": 43.3, "text": "Неандерталь үлгісіндегі адамдар тас құралдарды жұқа қабыршақтан жасай бастады; оттың көмегімен үңгірлер мен баспаналарда тұрды."}, {"from": -45000, "to": -12000, "name": "Ұшбұлақ тұрағы", "type": "site", "where": "Шығыс Қазақстан", "lon": 85.5, "lat": 47.4, "text": "Шілікті аңғарындағы көп қабатты тұрақ; кейінгі палеолиттің ең көне қабаттары шамамен 45–40 мың жыл бұрынғы. 2016 ж. ашылды."}, {"from": -40000, "to": -40000, "name": "Саналы адам Еуразияға тарады", "type": "event", "where": "Еуразия", "lon": 1.01, "lat": 44.94, "text": "Шамамен 40 мың жыл бұрын саналы адам (кроманьон) Еуразияға кең тарады. Кейінгі палеолитте ру қауымы қалыптасты."}, {"from": -40000, "to": -12000, "name": "Кейінгі палеолит: ру қауымы", "type": "event", "where": "Қазақстан", "lon": 72.0, "lat": 48.0, "text": "Сүйектен ине, тастан пышақ тәрізді ұзын тілікшелер жасалды. Адамдар ру болып бірге тұрып, мамонт, бизон, жабайы жылқы аулады."}, {"from": -12000, "to": -12000, "name": "Мұз басудың аяқталуы", "type": "event", "where": "Еуразия", "lon": 68.0, "lat": 48.0, "text": "Климат жылынып, мамонт сияқты ірі аңдар жойылды. Мезолит басталды: адамдар ұсақ әрі жүйрік аңдарды аулауға көшті."}, {"from": -11000, "to": -7000, "name": "Садақ пен жебенің пайда болуы", "type": "event", "where": "Қазақстан", "lon": 69.0, "lat": 46.0, "text": "Мезолитте садақ-жебе ойлап табылды: аңды алыстан атуға мүмкіндік туды. Микролиттерді ағаш не сүйек сапқа қондырып, құрама құрал жасады."}, {"from": -10000, "to": -6000, "name": "Маятас тұрағы", "type": "site", "where": "Қаратау", "lon": 69.3, "lat": 43.5, "text": "Қаратаудағы мезолит тұрағы; микролиттер мен ұсақ тас құралдар табылды. Орны шамамен."}, {"from": -10000, "to": -6000, "name": "Жаңашілік тұрағы", "type": "site", "where": "Оңтүстік Қазақстан", "lon": 68.8, "lat": 43.0, "text": "Оңтүстік Қазақстандағы мезолит тұрағы. Орны шамамен."}, {"from": -9000, "to": -6000, "name": "Виноградовка тұрақтары", "type": "site", "where": "Солтүстік Қазақстан", "lon": 69.6, "lat": 53.2, "text": "Шағалалы өзені бойындағы мезолит тұрақтары; аңшылар мен балықшылардың маусымдық қонысы. Орны шамамен."}, {"from": -9000, "to": -6000, "name": "Ақимбек және Қарағанды-15", "type": "site", "where": "Орталық Қазақстан", "lon": 72.8, "lat": 49.9, "text": "Орталық Қазақстандағы мезолит тұрақтары: микролиттер, ұсақ жебе ұштары табылды."}, {"from": -5000, "to": -4000, "name": "Неолиттік төңкеріс", "type": "event", "where": "Қазақстан", "lon": 65.0, "lat": 47.0, "text": "Адамдар табиғаттан дайынды алудан мал өсіру мен егін егуге көше бастады. Тасты тегістеу, бұрғылау, аралау тәсілдері мен қыш ыдыс пайда болды."}, {"from": -5000, "to": -4000, "name": "Келтеминар қоныстары", "type": "site", "where": "Арал маңы", "lon": 60.0, "lat": 43.5, "text": "Арал маңы мен Әмудария, Сырдария сағасындағы балықшы-аңшылардың үлкен қамыс күркелері мен қыш ыдыстары табылды."}, {"from": -5000, "to": -4000, "name": "Атбасар мәдениеті тұрақтары", "type": "site", "where": "Солтүстік Қазақстан", "lon": 68.36, "lat": 51.8, "text": "Есіл бойындағы неолит тұрақтары; тегістелген тас балталар мен жебе ұштары табылды."}, {"from": -5000, "to": -4000, "name": "Қаратау мен Балқаш маңы неолит тұрақтары", "type": "site", "where": "Оңтүстік Қазақстан", "lon": 75.0, "lat": 46.6, "text": "Балқаш маңы мен Қаратаудағы неолит тұрақтары: тас балта, кетпен, дән үгітетін тас жасалды. Орны шамамен."}, {"from": -3700, "to": -3100, "name": "Ботай қонысы", "type": "site", "where": "Солтүстік Қазақстан", "lon": 67.65, "lat": 53.3, "text": "Иманбұрлық өзені бойындағы 150-ден астам үйі бар энеолит қонысы; табылған сүйектердің басым бөлігі — жылқы сүйегі. 1980 ж. В.Ф.Зайберт ашты."}, {"from": -3500, "to": -3500, "name": "Жылқының қолға үйретілуі", "type": "event", "where": "Солтүстік Қазақстан", "lon": 67.4, "lat": 53.1, "text": "Ботай тұрғындары жылқыны ертеде қолға үйреткен: ыдыстардан бие сүтінің, тістерден ауыздық іздері табылды (2009). 2018 ж. генетикалық зерттеу ботай жылқысы қазіргі Пржевальский жылқысының арғы тегі екенін көрсетті, сондықтан ғалымдар арасында пікір бөлінеді."}, {"from": -3700, "to": -3000, "name": "Терсек мәдениеті", "type": "site", "where": "Торғай", "lon": 63.5, "lat": 49.6, "text": "Торғай өңіріндегі энеолит мәдениеті; Ботайға жақын, тұрғындары жылқы өсірді. Орны шамамен."}, {"from": -3500, "to": -2500, "name": "Алғашқы мыс бұйымдар", "type": "event", "where": "Қазақстан", "lon": 67.71, "lat": 47.79, "text": "Тас құралдармен бірге мыс пышақ, біз, әшекейлер қолданыла бастады. Мыс-тас дәуірі қола дәуіріне жол ашты."}, {"from": -2000, "to": -1800, "name": "Қола дәуірінің басталуы", "type": "event", "where": "Орталық Қазақстан", "lon": 67.71, "lat": 47.79, "text": "Мыс пен қалайыны қорытып, қатты әрі берік қола алу үйренілді. Жезқазған мыс кендері ерте игерілді."}, {"from": -2000, "to": -1700, "name": "Арқайым", "type": "site", "where": "Оңтүстік Орал", "lon": 59.57, "lat": 52.65, "text": "Оңтүстік Оралдағы шеңбер пішінді бекіністі қоныс; ерте қола дәуірінің металлургтері мен соғыс арбасы иелерінің орталығы."}, {"from": -1800, "to": -1100, "name": "Андронов мәдениеті: Андроново ауылы", "type": "site", "where": "Оңтүстік Сібір", "lon": 89.8, "lat": 55.3, "text": "Мәдениет 1914 ж. Ачинск маңындағы Андроново ауылынан алғаш табылғандықтан осылай аталды. Кейбір ғалымдар оның мерзімін б.з.б. XX–IX ғғ. немесе XIV–XII ғғ. деп береді."}, {"from": -1700, "to": -1200, "name": "Атасу қонысы", "type": "site", "where": "Орталық Қазақстан", "lon": 71.64, "lat": 48.68, "text": "Андроновтықтардың жер үйлі қонысы; мыс балқытатын пештер мен кен қазу іздері табылды."}, {"from": -1700, "to": -1200, "name": "Алакөл қорымы", "type": "site", "where": "Тобыл бойы", "lon": 63.7, "lat": 54.4, "text": "Қазақстан шекарасына жақын Тобыл бойындағы (қазір Ресейдің Қорған облысы) андроновтық қорым; ғалымдар мәдениетті Федоров және Алакөл кезеңдеріне бөледі. Орны шамамен."}, {"from": -1700, "to": -1300, "name": "Тасты-Бұтақ қорымы", "type": "site", "where": "Батыс Қазақстан", "lon": 57.6, "lat": 50.1, "text": "Ақтөбе маңындағы андроновтық қорым: қабірлердегі от іздері мен күл күнге, отқа табынуды көрсетеді. Орны шамамен."}, {"from": -1700, "to": -1200, "name": "Лисаковск қорымдары", "type": "site", "where": "Солтүстік Қазақстан", "lon": 62.49, "lat": 52.54, "text": "Тобыл бойындағы андроновтық қоныстар мен қорымдар; қыш ыдыстағы ою-өрнектер мен әшекейлер табылды."}, {"from": -1400, "to": -800, "name": "Таңбалы жартас суреттері", "type": "site", "where": "Жетісу", "lon": 75.53, "lat": 43.8, "text": "Қола дәуірінде салына бастаған мыңдаған петроглиф: күн басты бейнелер, жануарлар, ғұрып көріністері. 2004 ж. ЮНЕСКО тізіміне енді."}, {"from": -1600, "to": -900, "name": "Шығыс Қазақстан қалайы кендері", "type": "event", "where": "Шығыс Қазақстан", "lon": 83.5, "lat": 49.6, "text": "Қола алу үшін қажет қалайы осы өңірден өндірілді; Қазақстан Еуразиядағы ірі металлургия ошақтарының біріне айналды."}, {"from": -1200, "to": -800, "name": "Беғазы кесенелері", "type": "site", "where": "Орталық Қазақстан", "lon": 75.35, "lat": 48.27, "text": "Тастан қаланған ақсүйектер кесенелері — Беғазы-Дәндібай мәдениетінің белгісі. XX ғ. 40–50-жылдары Ә.Марғұлан экспедициясы қазды."}, {"from": -1200, "to": -800, "name": "Дәндібай қорымы", "type": "site", "where": "Орталық Қазақстан", "lon": 73.4, "lat": 49.6, "text": "Қарағанды маңындағы қорым; мәдениетке аты берілген. Мұндағы қыш ыдыстар өрнегімен ерекшеленеді. Орны шамамен."}, {"from": -1200, "to": -800, "name": "Айбас дарасы, Бұғылы, Саңғыру кесенелері", "type": "site", "where": "Орталық Қазақстан", "lon": 66.95, "lat": 48.65, "text": "Ұлытау, Бұғылы, Қарқаралы өңірлеріндегі зәулім кесенелер қоғамда ақсүйектер мен қарапайым адамдардың бөлінгенін көрсетеді."}, {"from": -800, "to": -700, "name": "Шілікті патша обалары", "type": "site", "where": "Шығыс Қазақстан", "lon": 85.4, "lat": 47.3, "text": "Шілікті аңғарындағы ерте сақ патшаларының обалары; 2003 ж. алтын әшекейлі «Шілікті алтын адамы» табылды. Орны шамамен."}, {"from": -700, "to": -500, "name": "Тасмола обалары", "type": "site", "where": "Орталық Қазақстан", "lon": 75.4, "lat": 50.9, "text": "Тасмола мәдениетіне аты берілген қорым: тас «мұртты» обалар, аң стиліндегі әшекейлер, қару мен ер-тұрман табылды. Орны шамамен."}, {"from": -700, "to": -400, "name": "Савромат тайпалық одағы", "type": "event", "where": "Батыс Қазақстан", "lon": 51.5, "lat": 50.0, "text": "Еділ мен Жайық аралығындағы савроматтар көшпелі мал шаруашылығымен айналысты; әйелдер қару асынып соғысқан, сондықтан грек жазбаларындағы «амазонкалар» аңызы осымен байланыстырылады."}, {"from": -650, "to": -600, "name": "Зарина патшайымның соғысы", "type": "battle", "where": "Сақтар", "lon": 62.0, "lat": 41.0, "text": "Ктесийдің жазуы бойынша сақ патшайымы Зарина мидиялықтарға қарсы соғысып, кейін бітім жасады. Оқиға аңызға бейім, орны белгісіз."}, {"from": -550, "to": -550, "name": "Ахемен империясының құрылуы", "type": "event", "where": "Иран", "lon": 53.17, "lat": 30.2, "text": "Парсы патшасы Кир II Мидияны бағындырып, Ахемен империясын құрды. Кейін ол Орта Азияға, сақ жеріне көз тікті."}, {"from": -540, "to": -329, "name": "Кирополь бекінісі", "type": "fort", "where": "Соғды", "lon": 69.0, "lat": 39.9, "text": "Кир II сақтардан қорғану үшін Сырдарияның оңтүстігіне салдырған шекара бекінісі; б.з.б. 329 ж. Александр Македонский қиратты. Орны шамамен (Истаравшан маңы)."}, {"from": -530, "to": -530, "name": "Кир II-нің массагеттерге жорығы", "type": "migration", "where": "Сыр бойы", "lon": 61.0, "lat": 38.5, "route": [[53.17, 30.2], [57.5, 35.5], [61, 37.5], [62.5, 40], [63, 42.3]], "text": "Кир II массагеттерге жорық жасап, айламен Томиристің ұлы Спаргапистің әскерін қолға түсірді."}, {"from": -530, "to": -530, "name": "Томиристің Кир II-ні жеңуі", "type": "battle", "where": "Массагеттер", "lon": 63.0, "lat": 42.5, "text": "Массагеттер патшайымы Томирис парсы әскерін талқандап, Кир II-ні өлтірді (Геродот). Шайқас орны деректе нақты көрсетілмеген."}, {"from": -519, "to": -518, "name": "Дарий I-нің сақтарға жорығы және Шырақтың ерлігі", "type": "migration", "where": "Сыр бойы", "lon": 69.5, "lat": 42.3, "route": [[52.9, 30.0], [58, 36], [63, 39], [67, 40.6], [69.5, 42.3]], "text": "Дарий I сақтарға жорық жасап, тиграхауда көсемі Скунханы тұтқындады. Полиэннің жазуы бойынша сақ бақташысы Шырақ парсы әскерін жеті күн сусыз шөлге адастырып, өзі қаза тапты."}, {"from": -520, "to": -518, "name": "Бехистун жазуы", "type": "site", "where": "Ахемен империясы", "lon": 47.44, "lat": 34.39, "text": "Дарий I-нің жартастағы жазуы мен бедері (б.з.б. 520 ж. басталды). Сақтарға жорықтан кейін (шамамен б.з.б. 519–518) тұтқын сақ көсемі Скунханың шошақ бөрікті бейнесі қосылды."}, {"from": -513, "to": -513, "name": "Дарий I-нің скифтерге жорығы", "type": "migration", "where": "Қара теңіз даласы", "lon": 34.0, "lat": 47.0, "route": [[29.0, 41.1], [28.5, 44.5], [30.5, 46.5], [34, 47.5], [37, 48.5]], "text": "Дарий I Дунайдан өтіп, скифтерге жорық жасады. Скифтер шайқасқа шықпай, жерді өртеп шегінді; парсылар нәтижесіз қайтты."}, {"from": -500, "to": -400, "name": "Бесшатыр обалары", "type": "site", "where": "Жетісу", "lon": 78.21, "lat": 43.92, "text": "Іле бойындағы 31 обадан тұратын сақ патшаларының қорымы; ішінде бөренеден салынған жерасты бөлмелері бар."}, {"from": -490, "to": -490, "name": "Сақтар Марафон шайқасында", "type": "battle", "where": "Грекия", "lon": 23.98, "lat": 38.15, "text": "Сақ атты әскері парсы әскерінің ортасында соғысып, гректердің сапын бұзды. Парсылар жеңілгенімен, сақ жауынгерлерінің ерлігін Геродот жазды."}, {"from": -486, "to": -486, "name": "Нақш-и Рустам жазуы", "type": "site", "where": "Ахемен империясы", "lon": 52.87, "lat": 29.99, "text": "Дарий I-нің қабіріндегі жазу сақтардың үш тобын атайды: хаомаварга, тиграхауда және парадарая. Парадараяның «теңіздің арғы жағы» Арал маңы ма, Қара теңіз даласы ма — ғалымдар екіге бөлінеді."}, {"from": -440, "to": -440, "name": "Геродоттың «Тарихы»", "type": "event", "where": "Грек деректері", "lon": 27.42, "lat": 37.04, "text": "Геродот массагеттер, скифтер, исседондар туралы жазды; Томиристің Кирді жеңуін баяндады. Дерек аңызға бейім болғанымен, сақтардың тұрмысы туралы ең толық жазба."}, {"from": -400, "to": -300, "name": "Филиппов қорғандары", "type": "site", "where": "Батыс Қазақстан", "lon": 54.12, "lat": 51.34, "text": "Орынбор маңындағы ерте сармат қорғандары; алтын бұғы мүсіндері мен аң стиліндегі бұйымдар табылды."}, {"from": -400, "to": -250, "name": "Есік обасы («Алтын адам»)", "type": "site", "where": "Жетісу", "lon": 77.45, "lat": 43.35, "text": "Сақ ақсүйегінің обасы: 4 мыңнан астам алтын әшекейлі киім киген жауынгер, жанында қанжар мен семсер, күміс тостағандағы жазу. 1969–1970 жж. К.Ақышев қазды."}, {"from": -400, "to": -200, "name": "Шірік-Рабат қалашығы", "type": "city", "where": "Сыр бойы", "lon": 62.91, "lat": 44.09, "text": "Жаңадарияның сол жағасындағы бекіністі қала; сақ-массагет ақсүйектерінің орталығы болған деп саналады."}, {"from": -331, "to": -331, "name": "Гавгамела шайқасы", "type": "battle", "where": "Ахемен империясы", "lon": 43.3, "lat": 36.6, "text": "Дарий III-нің жағында сақ атты әскері соғысты. Александр жеңіп, Ахемен империясы құлады."}, {"from": -329, "to": -329, "name": "Шеткі Александрия салынды", "type": "city", "where": "Соғды", "lon": 69.62, "lat": 40.28, "text": "Александр Македонский Сырдария (Яксарт) жағасында көшпелілерден қорғану үшін қала салдырды (қазіргі Ходжент)."}, {"from": -329, "to": -329, "name": "Яксарт жағасындағы шайқас", "type": "battle", "where": "Сыр бойы", "lon": 69.9, "lat": 40.4, "route": [[66.9, 36.76], [66.96, 39.65], [69.62, 40.28]], "text": "Александр Сырдарияның арғы бетіне өтіп, сақтармен шайқасты. Ауыр жеңіспен шектеліп, далаға терең кірмеді; сақтармен бітім жасады. Орны шамамен."}, {"from": -329, "to": -328, "name": "Спитамен көтерілісі", "type": "uprising", "where": "Соғды", "lon": 66.96, "lat": 39.65, "text": "Соғдылық Спитамен сақ-массагеттермен бірге Мараканданы қоршап, Политимет өзені бойында македондардың бір отрядын жойды. Б.з.б. 328 ж. жеңіліп, массагеттер оны өлтіріп, басын Александрға жіберді."}, {"from": -323, "to": -323, "name": "Александр Македонскийдің қайтыс болуы", "type": "event", "where": "Вавилон", "lon": 44.42, "lat": 32.54, "text": "Александр Вавилонда қайтыс болды; империя оның қолбасшылары арасында бөлінді."}, {"from": -312, "to": -312, "name": "Селевкидтер мемлекеті құрылды", "type": "event", "where": "Орта Азия", "lon": 44.52, "lat": 33.1, "text": "Селевк I Вавилонды алып, Александр империясының шығыс бөлігін, оның ішінде Бактрия мен Соғдыны біріктірді."}, {"from": -300, "to": -210, "name": "Сарматтардың батысқа жылжуы", "type": "migration", "where": "Батыс Қазақстан", "lon": 47.0, "lat": 49.0, "route": [[52, 50], [47, 49], [42, 48], [37, 47.2]], "text": "Сарматтар Жайық пен Еділден батысқа жылжып, Қара теңіз даласында скифтерді ығыстыра бастады (б.з.б. III–II ғғ.)."}, {"from": -300, "to": -200, "name": "Берел обалары", "type": "site", "where": "Шығыс Қазақстан", "lon": 86.38, "lat": 49.38, "text": "Бұқтырма аңғарындағы мұз басқан сақ обалары; әбзелдегі жылқылар, ағаш бұйымдар, мүрделер жақсы сақталды. 1998 ж. бастап З.Самашев зерттеді."}, {"from": -250, "to": -250, "name": "Грек-Бактрия бөлінді", "type": "event", "where": "Бактрия", "lon": 66.9, "lat": 36.76, "text": "Сатрап Диодот Селевкидтерден бөлініп, Бактрияда грек патшалығын құрды; ол солтүстіктегі сақтармен шектесті."}, {"from": -247, "to": -247, "name": "Парфия құрылды", "type": "event", "where": "Парфия", "lon": 58.2, "lat": 37.95, "text": "Дах тайпалық одағына кірген парн көшпелілері Аршак бастап Парфияны басып алды; кейін Парфия Римнің басты қарсыласына айналды."}, {"from": -221, "to": -221, "name": "Цинь Қытайды біріктірді", "type": "event", "where": "Қытай", "lon": 108.7, "lat": 34.35, "text": "Цинь Шихуанди соғысушы патшалықтарды біріктіріп, тұңғыш Қытай империясын құрды."}, {"from": -215, "to": -214, "name": "Мэн Тянь ғұндарды Ордостан ығыстырды", "type": "battle", "where": "Ғұндар", "lon": 108.5, "lat": 39.5, "text": "Цинь қолбасшысы Мэн Тянь Түмен шаньюйдің ғұндарын Хуанхэ иініндегі Ордостан қуып шығып, Ұлы Қытай қорғанын салуды жалғастырды."}, {"from": -210, "to": -210, "name": "Антиох III-нің шығыс жорығы", "type": "migration", "where": "Орта Азия", "lon": 58.2, "lat": 37.0, "route": [[44.5, 33.1], [48.5, 34.8], [54, 36], [58.2, 37.95], [62.5, 36.5], [66.9, 36.76]], "text": "Селевкид патшасы Антиох III Парфия мен Бактрияны қайта бағындыру үшін шығысқа жорық бастады (б.з.б. 210–206)."}, {"from": -209, "to": -209, "name": "Мөде шаньюй болды", "type": "event", "where": "Ғұн мемлекеті", "lon": 102.5, "lat": 47.5, "text": "Мөде әкесі Түменді өлтіріп, билікті алды. Әскерді ондық жүйемен қайта құрып, ғұн тайпаларын бір державаға біріктірді."}, {"from": -206, "to": -206, "name": "Мөде Дунхуды талқандады", "type": "battle", "where": "Ғұн мемлекеті", "lon": 120.0, "lat": 45.5, "text": "Шығыстағы дунху тайпалары жер сұрағанда Мөде соғыс ашып, оларды талқандады. Ғұндардың шығыс шекарасы Маньчжурияға жетті (орны шамамен)."}, {"from": -200, "to": -200, "name": "Байдэн тауындағы қоршау (Пинчэн)", "type": "battle", "where": "Ғұн мемлекеті", "lon": 113.4, "lat": 40.15, "text": "Мөде Хань императоры Лю Банды Пинчэн маңындағы Байдэн тауында жеті күн қоршап тұрды. Хань ғұндармен бейбіт келісімге баруға мәжбүр болды."}, {"from": -198, "to": -198, "name": "«Бейбітшілік пен туыстық» шарты", "type": "law", "where": "Хань империясы", "lon": 108.9, "lat": 34.3, "text": "Хань ханшайымды шаньюйге ұзатып, ғұндарға жыл сайын жібек, шарап, астық беруге міндеттенді. Ұлы Қорған екі елдің шекарасы деп танылды."}, {"from": -176, "to": -162, "name": "Юэчжилердің батысқа ығысуы", "type": "migration", "where": "Жетісу", "lon": 85.0, "lat": 44.0, "route": [[99, 39.5], [92, 42.5], [85, 44], [78, 43.5], [73, 41], [68, 38.5]], "text": "Мөде мен Лаошан юэчжилерді жеңді, олар Ганьсудан Жетісуға, кейін Орта Азияның оңтүстігіне қарай кетті. Ғұндар Шығыс Түркістандағы қала-мемлекеттерді бағындырды."}, {"from": -161, "to": -160, "name": "Үйсіндер Жетісуға қоныстанды", "type": "migration", "where": "Үйсін (Жетісу)", "lon": 78.3, "lat": 42.5, "route": [[96, 40.5], [91, 43], [86, 43.8], [81, 43.5], [78.3, 42.5]], "text": "Ғұндардың қолдауымен гуньмо Лэцзяоми юэчжилерді Іле бойынан ығыстырды. Үйсіндер Жетісуда өз мемлекетін құрды (жылы шамамен)."}, {"from": -138, "to": -126, "name": "Чжан Цяньның бірінші сапары", "type": "migration", "where": "Қаңлы (Сыр бойы)", "lon": 69.0, "lat": 42.5, "route": [[108.9, 34.3], [100.5, 38.9], [94.7, 40.1], [89.2, 42.9], [80.3, 41.2], [76, 39.5], [71.8, 40.8], [69.0, 42.5], [67, 39.5], [67, 37]], "text": "Хань елшісі юэчжилерді ғұндарға қарсы одаққа шақыру үшін аттанды; он жыл ғұн тұтқынында болып, Ферғана мен Қаңлы арқылы Бактрияға жетті. Ол батыстағы елдер туралы алғашқы нақты деректі Қытайға әкелді."}, {"from": -133, "to": -133, "name": "Маи қақпаны: Хань-ғұн соғысының басталуы", "type": "battle", "where": "Ғұн мемлекеті", "lon": 112.4, "lat": 39.4, "text": "Хань ғұн шаньюйін Маи маңында тұтқиылдан қолға түсірмек болды, бірақ айла ашылып қалды. Осыдан кейін екі ел арасында ондаған жылға созылған соғыс басталды."}, {"from": -127, "to": -119, "name": "Хань жорықтары: Ордос пен Ганьсу", "type": "battle", "where": "Ғұн мемлекеті", "lon": 103.5, "lat": 39.5, "route": [[108.94, 34.34], [106.5, 37.5], [103.5, 38.5], [100.5, 38.9], [96, 40]], "text": "Вэй Цин мен Хо Цюйбин Ордосты (б.з.б. 127) және Ганьсу дәлізін (б.з.б. 121) ғұндардан тартып алды. Б.з.б. 119 жылғы жорықтан кейін ғұндар Гоби шөлінен солтүстікке шегінді."}, {"from": -119, "to": -115, "name": "Чжан Цянь үйсіндерге келді", "type": "migration", "where": "Үйсін (Жетісу)", "lon": 78.3, "lat": 42.5, "route": [[108.94, 34.34], [103.8, 36.1], [100.5, 38.9], [97.0, 39.8], [94.66, 40.14], [89.2, 42.9], [84, 42.2], [78.3, 42.5]], "text": "Чжан Цяньның екінші сапары үйсін гуньмосын ғұндарға қарсы одаққа тартуды көздеді. Осы сапарлардан кейін Қытайдан Жетісу мен Сыр бойы арқылы батысқа апаратын Жібек жолы тұрақты жұмыс істей бастады."}, {"from": -105, "to": -101, "name": "Хань ханшайымдары үйсінге ұзатылды", "type": "event", "where": "Үйсін (Жетісу)", "lon": 78.3, "lat": 42.5, "text": "Ханьның Сицзюнь, кейін Цзеию ханшайымдары үйсін гуньмосына ұзатылды. Некелік одақ Ханьға ғұндарға қарсы батыста одақтас берді, ал үйсіндерге сауда мен сый-сияпат әкелді."}, {"from": -71, "to": -71, "name": "Үйсін мен Хань ғұндарды жеңді", "type": "battle", "where": "Үйсін (Жетісу)", "lon": 86.0, "lat": 45.5, "text": "Ғұндар үйсін жеріне шабуыл жасағанда, гуньмо Вэнгуйми Хань әскерімен бірге оларға соққы беріп, мыңдаған тұтқын мен мал алды. Бұл жеңіс ғұндардың батыстағы ықпалын әлсіретті (орны шамамен)."}, {"from": -57, "to": -51, "name": "Ғұндардағы алауыздық", "type": "event", "where": "Ғұн мемлекеті", "lon": 104.0, "lat": 46.0, "text": "Бір мезгілде бірнеше шаньюй билікке таласып, ел Хуханье мен Чжичжи жақтарына бөлінді. Б.з.б. 51 жылы Хуханье Хань билеушісіне бағынды."}, {"from": -44, "to": -36, "name": "Чжичжи шаньюй Қаңлыда", "type": "migration", "where": "Қаңлы (Сыр бойы)", "lon": 71.4, "lat": 42.9, "route": [[102.5, 47.5], [92, 47], [84, 46], [77, 44.5], [71.4, 42.9]], "text": "Чжичжи батысқа кетіп, қаңлы ханымен одақтасты, оның қызына үйленді. Ол Талас бойында бекініс салдырып, үйсіндерге шабуыл жасап тұрды."}, {"from": -36, "to": -36, "name": "Чжичжи бекінісі алынды", "type": "fort", "where": "Қаңлы (Сыр бойы)", "lon": 71.4, "lat": 42.9, "text": "Хань қолбасшылары Чэнь Тан мен Гань Яньшоу Талас бойындағы бекіністі қоршап алды. Чжичжи қаза тапты, батыстағы ғұндардың күші сынды (орны шамамен)."}, {"from": -100, "to": 300, "name": "Қаңлы қалалары мен Жібек жолы", "type": "city", "where": "Қаңлы (Сыр бойы)", "lon": 68.3, "lat": 42.85, "text": "Арыс пен Сыр бойында Көк-Мардан, Отырартөбе сияқты бекініс-қалалар өсті; қаңлылар егіншілік пен мал шаруашылығын ұштастырды. Жібек жолының Сыр бойындағы тармағы олардың жері арқылы өтті."}, {"from": -209, "to": -100, "name": "Сарматтар Қара теңіз жағалауына жылжыды", "type": "migration", "where": "Батыс Қазақстан", "lon": 50.0, "lat": 49.5, "route": [[52, 50], [47, 49], [42, 48], [37, 47.2], [33, 46.8]], "text": "Жайық пен Еділ бойындағы сармат тайпалары батысқа жылжып, скифтерді Қырымға ығыстырды. Солтүстік Қара теңіз даласы Сарматия деп атала бастады."}, {"from": 48, "to": 48, "name": "Ғұн мемлекеті екіге бөлінді", "type": "event", "where": "Ғұн мемлекеті", "lon": 108.0, "lat": 44.0, "text": "Ішкі тартыс пен табиғи апаттардан кейін ғұндар оңтүстік және солтүстік болып бөлінді. Оңтүстік ғұндар Ханьға бағынды, солтүстік ғұндар Моңғолия даласында қалды."}, {"from": 89, "to": 91, "name": "Солтүстік ғұндардың батысқа кетуі", "type": "migration", "where": "Ғұн мемлекеті", "lon": 86.0, "lat": 45.0, "route": [[104, 47], [94, 46], [86, 45], [78, 44]], "text": "Хань мен оңтүстік ғұндардың бірлескен әскері 89–91 жж. солтүстік ғұндарды талқандады. Олардың бір бөлігі Тарбағатай мен Жетісуға кетіп, кейін батысқа жылжуын жалғастырды."}, {"from": 150, "to": 450, "name": "Юэбань мемлекеті", "type": "event", "where": "Жетісу", "lon": 82.0, "lat": 46.0, "text": "Солтүстік ғұндардың Жетісу мен Тарбағатайда қалған бөлігі Юэбань иелігін құрды. Қытай деректері оның әдет-ғұрпын үйсіндерге ұқсас деп жазады; V ғ. жужандардың соққысынан әлсіреді (жылдары шамамен)."}, {"from": 100, "to": 300, "name": "Лебедевка сармат қорымдары", "type": "site", "where": "Батыс Қазақстан", "lon": 53.9, "lat": 50.8, "text": "Батыс Қазақстан облысындағы бұл қорымдардан кейінгі сармат дәуірінің бай жерлеулері, Рим және Иран бұйымдары табылды. Олар сарматтардың алыс елдермен саудасын көрсетеді (орны шамамен)."}, {"from": 370, "to": 375, "name": "Ғұндар Еділден өтті", "type": "battle", "where": "Еділ бойы", "lon": 44.0, "lat": 47.5, "text": "Ғұндар Еділден өтіп, сармат-алан тайпаларын талқандады; аландардың бір бөлігі ғұндарға қосылды. Бұл Еуропадағы ғұн дәуірінің басы болды."}, {"from": 375, "to": 375, "name": "Остготтар жеңілді: Ұлы қоныс аудару басталды", "type": "battle", "where": "Қара теңіз жағалауы", "lon": 33.0, "lat": 48.0, "route": [[78, 44], [70, 46], [60, 48], [50, 48], [45, 47.5], [38, 47.5], [33, 48]], "text": "Ғұндар Германарих бастаған остготтарды жеңді, вестготтар Рим шекарасына қашты. Еуропада ондаған халық орын ауыстырған Халықтардың ұлы қоныс аударуы басталды."}, {"from": 378, "to": 378, "name": "Адрианополь шайқасы", "type": "battle", "where": "Шығыс Рим", "lon": 26.56, "lat": 41.68, "text": "Ғұндардан қашқан готтар Рим жеріне өтіп, Адрианопольде император Валенттің әскерін талқандады. Рим империясының әлсіреуі тездеді."}, {"from": 395, "to": 396, "name": "Ғұндардың Кавказ сыртына жорығы", "type": "migration", "where": "Кавказ", "lon": 45.0, "lat": 41.0, "route": [[46, 46.5], [47.5, 42], [44.5, 40], [38.5, 38], [36.5, 36.5]], "text": "Ғұн жасақтары Кавказ асуларынан өтіп, Армения, Каппадокия мен Сирияға дейін жетті. Жорық Рим мен Иранды үлкен үрейге түсірді."}, {"from": 434, "to": 434, "name": "Аттила мен Бледа билікке келді", "type": "event", "where": "Паннония", "lon": 20.2, "lat": 46.6, "text": "Руа қайтыс болғаннан кейін інілері Аттила мен Бледа ғұндарды бірге басқарды. 445 жылдан Аттила жалғыз биледі."}, {"from": 441, "to": 447, "name": "Аттиланың Балқан жорықтары", "type": "migration", "where": "Шығыс Рим", "lon": 25.0, "lat": 43.5, "route": [[20.2, 46.6], [21.5, 44.5], [23.3, 42.7], [26.5, 41.7], [28.98, 41.01]], "text": "Ғұндар Дунайдан өтіп, Балқандағы ондаған қаланы алып, Константинопольге жақындады. Шығыс Рим жыл сайынғы алымды бірнеше есе өсіруге келісті."}, {"from": 449, "to": 449, "name": "Приск Аттила ордасында", "type": "event", "where": "Паннония", "lon": 20.2, "lat": 46.6, "text": "Шығыс Рим елшілігімен келген тарихшы Приск Аттиланың ордасын, тойлары мен басқару тәртібін жазып қалдырды. Бұл ғұндар туралы ең құнды жазба дерек саналады."}, {"from": 451, "to": 451, "name": "Каталаун шайқасы", "type": "battle", "where": "Галлия", "lon": 4.4, "lat": 48.9, "route": [[20.2, 46.6], [16, 48], [11, 49.5], [7, 49.5], [4.4, 48.9]], "text": "Аттила Галлияға басып кірді, Рим қолбасшысы Аэций мен вестготтар одағы оны Каталаун алқабында тоқтатты. Шайқас нақты жеңіссіз аяқталып, ғұндар шегінді (орны шамамен)."}, {"from": 452, "to": 452, "name": "Аттиланың Италияға жорығы", "type": "migration", "where": "Италия", "lon": 13.4, "lat": 45.8, "route": [[20.2, 46.6], [16, 46], [13.4, 45.8], [11, 45.4]], "text": "Ғұндар Аквилея мен солтүстік Италия қалаларын алды. Рим папасы Лев I-мен кездесуден кейін Аттила кері қайтты."}, {"from": 453, "to": 454, "name": "Аттиланың өлімі және Недао шайқасы", "type": "battle", "where": "Паннония", "lon": 19.5, "lat": 46.0, "text": "453 ж. Аттила кенеттен қайтыс болды, ұлдары билікке таласты. 454 ж. Недао шайқасында гепидтер бастаған бағынышты тайпалар ғұндарды жеңіп, держава ыдырады (орны шамамен)."}, {"from": 476, "to": 476, "name": "Батыс Рим империясы құлады", "type": "event", "where": "Италия", "lon": 12.5, "lat": 41.9, "text": "Герман көсемі Одоакр соңғы император Ромул Августулді тақтан тайдырды. Ұлы қоныс аудару салдарынан Еуропаның саяси картасы түбегейлі өзгерді."}, {"from": 430, "to": 450, "name": "Жужандар үйсіндерді ығыстырды", "type": "battle", "where": "Үйсін (Жетісу)", "lon": 79.0, "lat": 42.8, "text": "Жужан қағанатының шабуылынан кейін үйсіндер Тәңіртау тауларына ығысты. Жетісудағы үйсін билігі осымен аяқталды (жылдары шамамен)."}, {"from": 484, "to": 484, "name": "Эфталиттер Иран шаһын жеңді", "type": "battle", "where": "Хорасан", "lon": 62.5, "lat": 36.5, "text": "Эфталиттер Иран шаһы Пероздың әскерін талқандап, шаһтың өзі қаза тапты. Иран эфталиттерге ұзақ жыл алым төледі, ал эфталиттер Орта Азияның оңтүстігіндегі басты күшке айналды (орны шамамен)."}, {"from": 545, "to": 545, "name": "Батыс Вэй елшілігі түріктерге келді", "type": "event", "where": "Түрік қағанаты", "lon": 90.0, "lat": 48.0, "text": "Батыс Вэй әулеті Алтайдағы түрік көсемі Бумынға елші жіберді. Түріктер бұл кезде жужандарға бағынып, темір өңдеумен танымал болған еді."}, {"from": 546, "to": 546, "name": "Бумын телелерді жеңді", "type": "battle", "where": "Түрік қағанаты", "lon": 92.0, "lat": 46.5, "text": "Бумын жужандарға қарсы аттанған теле тайпаларын тосып, 50 мың шаңырақты бағындырды. Осыдан кейін ол жужан қағанынан қызын сұрап, бас тартылған соң онымен жауласты (орны шамамен)."}, {"from": 552, "to": 552, "name": "Түрік қағанаты құрылды", "type": "battle", "where": "Түрік қағанаты", "lon": 108.0, "lat": 43.0, "text": "Бумын жужандарды талқандап, олардың қағаны Анагуй өзін-өзі өлтірді. Бумын «Іле қаған» атағын алып, Түрік қағанатының негізін қалады (шайқас орны шамамен)."}, {"from": 555, "to": 558, "name": "Истемидің Еділге жорығы", "type": "migration", "where": "Түрік қағанаты", "lon": 60.0, "lat": 47.0, "route": [[75.2, 42.8], [69.8, 43.5], [64, 46], [58, 47.5], [52, 48], [47, 47.5]], "text": "Истеми ябғу батысқа жорық жасап, Арал маңы мен Жайық бойын бағындырды да, Еділге жетті. Қағанаттан қашқан аварлар Еуропаға кетті."}, {"from": 563, "to": 567, "name": "Эфталиттер талқандалды", "type": "battle", "where": "Мәуереннахр", "lon": 64.5, "lat": 39.7, "text": "Истеми Иран шаһы Хосровпен одақтасып, эфталиттерді Бұхара маңында жеңді. Түріктер Амударияға дейінгі жерлерді алып, Жібек жолының үлкен бөлігін бақылауға алды (оқулықта 563–567 жж.)."}, {"from": 568, "to": 568, "name": "Земарх елшілігі", "type": "event", "where": "Жетісу", "lon": 71.37, "lat": 42.9, "text": "Византия императоры Юстин II жіберген Земарх Истеми қағанның ордасында қабылданып, Иранға қарсы одақ жасалды. Тараз қаласының аты алғаш осы елшілік туралы жазбада аталады."}, {"from": 568, "to": 568, "name": "Маниах бастаған соғды-түрік елшілігі", "type": "event", "where": "Жібек жолы", "lon": 51.7, "lat": 47.4, "route": [[71.37, 42.9], [68.3, 42.85], [61.9, 45.6], [57, 47.8], [51.7, 47.4], [47.9, 46.4], [44, 43.5], [41.7, 41.6], [35, 41.5], [28.98, 41.01]], "text": "Соғды көпесі Маниах түрік қағанының атынан Константинопольге барып, жібек саудасы туралы келісті. Жібек жолының Иранды айналып өтетін солтүстік тармағы күшейді."}, {"from": 576, "to": 576, "name": "Түріктер Боспорды алды", "type": "battle", "where": "Қырым", "lon": 36.5, "lat": 45.3, "text": "Византиямен одақ бұзылған соң түрік әскері утигурлармен бірге Қырымдағы Боспор қаласын алды. Қағанаттың батыс шекарасы Қара теңізге жетті."}, {"from": 588, "to": 589, "name": "Бірінші түрік-парсы соғысы", "type": "battle", "where": "Хорасан", "lon": 62.2, "lat": 34.3, "text": "Түрік әскері Иранның шығыс шекарасына басып кірді, бірақ Герат маңында Бахрам Чубиннен жеңілді. Бұл соғыс қағанаттағы ішкі тартысты күшейтті (орны шамамен)."}, {"from": 603, "to": 603, "name": "Түрік қағанаты екіге бөлінді", "type": "event", "where": "Түрік қағанаты", "lon": 88.0, "lat": 45.5, "text": "Ұзақ ішкі тартыстан кейін қағанат Шығыс (Моңғолия) және Батыс (Жетісу, Сыр бойы) қағанаттарына бөлінді. Шекара шамамен Алтай мен Шығыс Тәңіртау бойымен өтті."}, {"from": 627, "to": 628, "name": "Тон ябғудың Кавказ сыртына жорығы", "type": "battle", "where": "Батыс Түрік қағанаты", "lon": 44.8, "lat": 41.7, "text": "Тон ябғу Византия императоры Ираклиймен одақтасып, Иранға қарсы Кавказ сыртына әскер жіберді; Тбилиси қоршалып, алынды."}, {"from": 630, "to": 630, "name": "Сюань-цзян Суябта", "type": "event", "where": "Батыс Түрік қағанаты", "lon": 75.2, "lat": 42.8, "text": "Буддист монах Сюань-цзян Үндістанға бара жатып Тон ябғу қағанның ордасында болды. Ол қағанның салтанатын, Суяб пен Жетісу қалаларын сипаттап қалдырды. Сол жылы Тон ябғу өлтірілді."}, {"from": 634, "to": 639, "name": "«Он оқ бұдун» жүйесі", "type": "law", "where": "Батыс Түрік қағанаты", "lon": 74.5, "lat": 43.5, "text": "Ышбара Толис қаған елді он тайпаға бөліп, әр тайпа көсеміне бір жебе берді. Шудан батыстағы бес тайпа нушиби, шығыстағы бес тайпа дулу деп аталды."}, {"from": 657, "to": 659, "name": "Таң Батыс Түрік қағанатын бағындырды", "type": "battle", "where": "Батыс Түрік қағанаты", "lon": 84.0, "lat": 46.5, "text": "Таң қолбасшысы Су Динфан Ашина Хэлуды жеңіп, тұтқынға алды. Жетісу мен Шығыс Түркістан Таңның бақылауына өтті, бірақ он оқ тайпалары бағынбай, жиі көтеріліп тұрды (шайқас орны шамамен)."}, {"from": 679, "to": 679, "name": "Суябта Таң бекінісі салынды", "type": "fort", "where": "Батыс Түрік қағанаты", "lon": 75.2, "lat": 42.8, "text": "Таң қолбасшысы Суябта бекініс салдырып, оны батыстағы әскери тірегіне айналдырды. Ол көп ұзамай түргештердің қолына өтті."}, {"from": 682, "to": 682, "name": "Екінші Шығыс Түрік қағанаты құрылды", "type": "uprising", "where": "Моңғолия", "lon": 102.5, "lat": 47.5, "text": "Құтлұқ (Елтеріс) Таң билігіне қарсы көтерілісті бастап, Түрік қағанатын қайта құрды. Қағанның кеңесшісі Тоныкөк болды."}, {"from": 699, "to": 704, "name": "Үшелік Суябты алды: Түргеш қағанаты", "type": "city", "where": "Жетісу", "lon": 75.2, "lat": 42.8, "text": "Түргеш көсемі Үшелік Таңның бақылауындағы Суябты алып, ордасын сонда тікті. Ол Батыс Түрік қағанатының мұрасын жалғастырған Түргеш қағанатын құрды."}, {"from": 705, "to": 715, "name": "Арабтар Мәуереннахрды жаулады", "type": "battle", "where": "Мәуереннахр", "lon": 66.96, "lat": 39.65, "text": "Хорасан наместнигі Құтайба ибн Мүслім Бұхараны, 712 ж. Самарқандты, кейін Шашты алды. Араб халифатының шекарасы Сыр бойына жақындады."}, {"from": 711, "to": 711, "name": "Болшу шайқасы", "type": "battle", "where": "Жетісу", "lon": 88.5, "lat": 46.5, "text": "Күлтегін мен Тоныкөк бастаған шығыс түріктер Алтайдан асып, түргештерді Болшуда жеңді; Сақал қаған қаза тапты. Тоныкөк жазуында бұл жорық сипатталады (орны шамамен)."}, {"from": 724, "to": 724, "name": "«Шөл күні» шайқасы", "type": "battle", "where": "Мәуереннахр", "lon": 69.6, "lat": 40.4, "text": "Сұлу қаған Ферғанаға жорық жасаған араб әскерін Сырдария маңында қуып жетіп, талқандады. Араб жылнамалары бұл жеңілісті «Шөл күні» деп атады (орны шамамен)."}, {"from": 731, "to": 731, "name": "Тахтақарача асуындағы шайқас", "type": "battle", "where": "Мәуереннахр", "lon": 66.9, "lat": 39.4, "text": "Сұлу Самарқандты қоршап, оған көмекке келген араб әскерін асуда тосып, қатты шығынға ұшыратты. Арабтар Самарқандты сақтап қалғанымен, мыңдаған жауынгерінен айырылды (орны шамамен)."}, {"from": 732, "to": 735, "name": "Орхон жазбалары", "type": "site", "where": "Моңғолия", "lon": 102.8, "lat": 47.5, "text": "Күлтегін (732) мен Білге қаған (735) құрметіне ескерткіш тастар қойылды, оларға көне түркі жазуымен ел тарихы жазылды. Жазуларда елді, төрені сақтау туралы ой айтылады."}, {"from": 737, "to": 737, "name": "Харистан шайқасы", "type": "battle", "where": "Тохарстан", "lon": 66.0, "lat": 36.7, "text": "Сұлу Тохарстанға жорық жасап, араб наместнигі Асад ибн Абдаллаһтан жеңілді. Бұл жеңілістен кейін Сұлудың беделі түсіп, ішкі қарсылық күшейді (орны шамамен)."}, {"from": 738, "to": 738, "name": "Сұлу қаған өлтірілді", "type": "event", "where": "Жетісу", "lon": 75.2, "lat": 42.8, "text": "Сұлуды түргеш ақсүйегі Баға тархан Құрсұл өлтірді. Қағанат қара және сары түргештердің тартысына түсіп, әлсірей бастады."}, {"from": 744, "to": 744, "name": "Ұйғыр қағанаты құрылды", "type": "event", "where": "Моңғолия", "lon": 102.6, "lat": 47.4, "text": "Ұйғырлар, басмылдар мен қарлұқтар одағы Екінші Шығыс Түрік қағанатын құлатты. Кейін ұйғырлар қарлұқтарды батысқа, Жетісуға қарай ығыстырды."}, {"from": 748, "to": 748, "name": "Таң әскері Суябты қиратты", "type": "city", "where": "Жетісу", "lon": 75.2, "lat": 42.8, "text": "Таң қолбасшысы Ван Чжэнцзянь түргештердің ордасы Суябты алып, қала қабырғаларын бұздырды."}, {"from": 751, "to": 751, "name": "Атлах шайқасы", "type": "battle", "where": "Жетісу", "lon": 71.6, "lat": 42.6, "route": [[80.3, 41.2], [77, 41.9], [74, 42.4], [71.6, 42.6]], "text": "Талас бойында Зияд ибн Салих бастаған араб әскері мен Гао Сяньчжи бастаған Таң әскері шайқасты. Шайқас кезінде қарлұқтар арабтар жағына шығып, Таң жеңілді; Орталық Азияда Қытай ықпалы тоқтап, ислам таралуына жол ашылды (орны шамамен)."}, {"from": 756, "to": 756, "name": "Қарлұқ мемлекеті құрылды", "type": "event", "where": "Жетісу", "lon": 75.0, "lat": 44.0, "route": [[88, 48.5], [84, 47.8], [80.5, 46.8], [78, 45], [76, 43.5], [75.2, 42.8]], "text": "Тарбағатай мен Алтайдан келген қарлұқтар Жетісуды алып, ябғу басқарған мемлекет құрды."}, {"from": 766, "to": 766, "name": "Қарлұқтар Суябты алды", "type": "city", "where": "Жетісу", "lon": 75.2, "lat": 42.8, "text": "Қарлұқ ябғуы ордасын Суябқа көшірді. Қарлұқтар Жетісудағы түргеш тайпаларын біртіндеп бағындырды."}, {"from": 776, "to": 783, "name": "Муқанна көтерілісі («ақ киімділер»)", "type": "uprising", "where": "Мәуереннахр", "lon": 66.8, "lat": 39.0, "text": "Мәуереннахрда Аббасид билігіне қарсы «ақ киімділер» көтерілісі болды, оны түрік тайпалары қолдады. Көтеріліс басылғанымен, халифаттың бұл өңірдегі билігі әлсіреді."}, {"from": 800, "to": 900, "name": "Тараздағы теңге сарайы", "type": "city", "where": "Жетісу", "lon": 71.37, "lat": 42.9, "text": "VIII–IX ғғ. Таразда өз теңгесі соғылып, қала Жетісу мен Мәуереннахр арасындағы ірі сауда орталығына айналды."}, {"from": 840, "to": 840, "name": "Ұйғыр қағанаты құлады", "type": "event", "where": "Моңғолия", "lon": 102.6, "lat": 47.4, "text": "Енисей қырғыздары Ұйғыр астанасы Орду-Балықты алды. Бұдан кейін Жетісуда қарлұқ билеушілері қаған атағын алды, ал Ертіс бойында қимақтар күшейді."}, {"from": 840, "to": 840, "name": "Саманидтер Испиджабты алды", "type": "city", "where": "Сыр бойы", "lon": 69.77, "lat": 42.3, "text": "Саманид әмірі Нұх ибн Асад Испиджабты (Сайрамды) алып, жүзімдіктер мен егістерді қорғау үшін ұзын қабырға салдырды."}, {"from": 870, "to": 870, "name": "Әл-Фараби Фарабта туды", "type": "site", "where": "Сыр бойы", "lon": 68.3, "lat": 42.85, "text": "Әбу Насыр әл-Фараби Отырар (Фараб) маңында туды. Ол Аристотельдің еңбектеріне түсініктеме жазып, «Екінші ұстаз» атанды; «Қайырымды қала тұрғындарының көзқарасы» сияқты еңбектерінде бақытты қоғам туралы ой айтты."}, {"from": 893, "to": 893, "name": "Исмаил Самани Таразды алды", "type": "city", "where": "Жетісу", "lon": 71.37, "lat": 42.9, "text": "Саманид әмірі Исмаил Таразды алып, ондағы үлкен шіркеуді мешітке айналдырды. Қарлұқтардың оңтүстік шекарасы шегінді."}, {"from": 900, "to": 1050, "name": "Янгикент — оғыз ябғуының ордасы", "type": "city", "where": "Сыр бойы", "lon": 61.92, "lat": 45.61, "text": "Сырдарияның төменгі ағысындағы Янгикент (араб деректерінде «Жаңа қала») оғыз ябғуының қысқы ордасы болды. Мұнда көпестер мен егіншілер тұрып, Хорезм мен Еділ бойына керуендер өтті."}, {"from": 921, "to": 922, "name": "Ибн Фадланның оғыздар арқылы сапары", "type": "migration", "where": "Оғыз мемлекеті", "lon": 55.0, "lat": 47.0, "route": [[64.42, 39.77], [59.15, 42.33], [56, 44.5], [55, 47.5], [51.5, 50], [49.1, 55.0]], "text": "Аббасид халифының елшісі Ибн Фадлан Хорезмнен Үстірт арқылы оғыз жерін басып, Еділ бұлғарларына барды. Ол оғыздардың тұрмысы, наным-сенімі мен басқаруын сипаттап жазды."}, {"from": 940, "to": 940, "name": "Қарлұқ мемлекеті құлады", "type": "event", "where": "Жетісу", "lon": 75.25, "lat": 42.75, "text": "Шығыстан келген тайпалар Баласағұнды алып, қарлұқ ябғуларының билігі аяқталды. Жетісуда Қарахан әулеті күшейді."}, {"from": 950, "to": 950, "name": "Әл-Фараби Дамаскіде қайтыс болды", "type": "event", "where": "Сирия", "lon": 36.3, "lat": 33.5, "text": "Әл-Фараби Бағдат, Халеб пен Дамаскіде өмір сүріп, философия, логика, музыка мен математика бойынша жүзден астам еңбек жазды. Ол Дамаскіде жерленді."}, {"from": 965, "to": 965, "name": "Хазар қағанатының талқандалуы", "type": "battle", "where": "Еділ бойы", "lon": 47.9, "lat": 46.4, "text": "Киев князі Святослав Хазар қағанатын талқандады; деректерде оғыздардың да бұл соғыстарға қатысқаны айтылады. Хазарлардың құлауы Еділ бойын оғыздар мен қыпшақтарға ашты (орны шамамен)."}, {"from": 982, "to": 982, "name": "«Худуд әл-әлам»: қимақтар мен оғыздар", "type": "event", "where": "Қимақ қағанаты", "lon": 80.0, "lat": 50.6, "text": "Парсы тілінде жазылған бұл географиялық еңбек қимақтардың Ертіс бойындағы жерін, оғыздардың Сыр бойындағы мекенін сипаттайды. Онда қимақ қағанының жазғы ордасы да аталады."}, {"from": 985, "to": 985, "name": "Сауран — шекаралық қала", "type": "city", "where": "Сыр бойы", "lon": 68.0, "lat": 43.37, "text": "Араб географы әл-Мақдиси Сауранды (Сабран) оғыздар мен қимақтар саудаға келетін, мықты қорғанмен қоршалған шекаралық қала деп жазды."}, {"from": 985, "to": 1000, "name": "Селжұқтар Жентке көшті", "type": "migration", "where": "Сыр бойы", "lon": 64.0, "lat": 45.3, "route": [[61.92, 45.61], [64.0, 45.3], [66.5, 42.5], [64.42, 39.77]], "text": "Оғыз ябғуымен араздасқан Селжұқ өз руымен Жент маңына көшіп, исламды қабылдады. Кейін селжұқтар Мәуереннахр мен Хорасанға өтті."}, {"from": 1040, "to": 1040, "name": "Дандақан шайқасы", "type": "battle", "where": "Хорасан", "lon": 61.
