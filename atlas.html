7, "lat": 37.4, "text": "Оғыздардан шыққан селжұқтар Ғазнауи сұлтанын Мерв маңында жеңіп, Селжұқ мемлекетін құрды. Оғыздардың бір бөлігі Иран мен Кіші Азияға қоныс аударды (орны шамамен)."}, {"from": 1041, "to": 1043, "name": "Шахмәлік Хорезмді алды", "type": "battle", "where": "Хорезм", "lon": 59.15, "lat": 42.33, "text": "Оғыз ябғуы Шахмәлік Хорезмді басып алды, бірақ 1043 ж. селжұқтардан жеңіліп, өлтірілді. Бұдан кейін Сыр бойындағы оғыз мемлекеті ыдырады."}, {"from": 1030, "to": 1050, "name": "Билік қимақтардан қыпшақтарға өтті", "type": "event", "where": "Дешті Қыпшақ", "lon": 70.0, "lat": 50.5, "text": "Қимақ қағанатының батыс бөлігіндегі қыпшақ тайпалары күшейіп, қағанаттағы билікті қолға алды. Қимақтардың бір бөлігі қыпшақтарға сіңіп кетті."}, {"from": 1050, "to": 1060, "name": "Қыпшақтар оғыздарды Сыр бойынан ығыстырды", "type": "migration", "where": "Сыр бойы", "lon": 62.0, "lat": 46.0, "route": [[62, 46], [57, 47.8], [52, 48], [47, 47.5], [40, 47.5], [34, 47.5]], "text": "Қыпшақтар Сыр бойы мен Арал маңын алды, оғыздардың бір бөлігі Қара теңіз жағалауына (орыс деректерінде «торктар»), бір бөлігі оңтүстікке кетті."}, {"from": 1055, "to": 1061, "name": "Қыпшақтар Русь шекарасына жетті", "type": "event", "where": "Батыс қыпшақтар", "lon": 31.4, "lat": 50.1, "text": "1055 ж. орыс жылнамасы половецтердің (қыпшақтардың) Переяславль маңына келгенін, 1061 ж. алғашқы шабуылын жазды. Ертістен Дунайға дейінгі дала парсы деректерінде «Дешті Қыпшақ» атанды."}, {"from": 942, "to": 942, "name": "Сатұқ Боғра хан Баласағұнды алды", "type": "city", "where": "Жетісу", "lon": 75.25, "lat": 42.75, "text": "Исламды қабылдаған Сатұқ Боғра хан Қашғардан келіп, Баласағұнды бағындырды. Қарахан мемлекеті Жетісу мен Шығыс Түркістанды біріктірді."}, {"from": 960, "to": 960, "name": "Ислам — мемлекеттік дін", "type": "law", "where": "Қарахан мемлекеті", "lon": 75.99, "lat": 39.47, "text": "Ибн әл-Асирдің жазуынша, 960 ж. 200 мың шаңырақ түрік исламды қабылдады. Қарахандар ислам дінін мемлекеттік дін деп жариялады; қалаларда мешіт, медресе, кесенелер салына бастады."}, {"from": 999, "to": 999, "name": "Қарахандар Бұхараны алды", "type": "battle", "where": "Мәуереннахр", "lon": 64.42, "lat": 39.77, "route": [[75.25, 42.75], [71.4, 42.9], [69.24, 41.3], [66.96, 39.65], [64.42, 39.77]], "text": "Наср Илек хан Бұхараны алып, Саманидтер мемлекетін құлатты. Мәуереннахр Қарахан мемлекетінің құрамына енді."}, {"from": 1006, "to": 1006, "name": "Хотан бағындырылды", "type": "battle", "where": "Шығыс Түркістан", "lon": 79.9, "lat": 37.1, "text": "Ұзақ соғыстан кейін Юсуф Қадыр хан буддист Хотанды алды. Шығыс Түркістанның оңтүстігінде ислам орнықты."}, {"from": 1000, "to": 1100, "name": "Бұрана мұнарасы", "type": "site", "where": "Жетісу", "lon": 75.25, "lat": 42.75, "text": "Баласағұнның орнындағы Бұрана мұнарасы XI ғасырда салынған. Ол Қарахан дәуіріндегі мұсылман сәулетінің Жетісудағы белгісі."}, {"from": 1041, "to": 1042, "name": "Қарахан мемлекеті екіге бөлінді", "type": "law", "where": "Қарахан мемлекеті", "lon": 72.0, "lat": 41.5, "text": "Ел Шығыс (Баласағұн, Қашғар) және Батыс (Самарқанд, Бұхара) қағанаттарына бөлінді. Шекара шамамен Ферғана мен Шаш бойымен өтті."}, {"from": 1069, "to": 1070, "name": "«Құтадғу біліг» жазылды", "type": "site", "where": "Қарахан мемлекеті", "lon": 75.99, "lat": 39.47, "text": "Баласағұнда туған Жүсіп Баласағұни «Құтты білік» дастанын Қашғарда аяқтап, Табғаш Боғра ханға тартты. Дастанда әділ билеуші, білім мен ақыл, мемлекетті басқару туралы ой айтылады."}, {"from": 1072, "to": 1077, "name": "«Диуани лұғат-ит-түрк»", "type": "site", "where": "Бағдат (Аббасид халифаты)", "lon": 44.4, "lat": 33.3, "text": "Қашғарлық Махмұд Бағдатта түркі тілдерінің араб тіліндегі сөздігін жазды. Онда түркі тайпалары, мақал-мәтелдер, өлеңдер жиналып, түркі жерінің алғашқы картасы берілді."}, {"from": 1089, "to": 1089, "name": "Селжұқтар Самарқандты алды", "type": "battle", "where": "Мәуереннахр", "lon": 66.96, "lat": 39.65, "text": "Селжұқ сұлтаны Мәлікшах Самарқандты алып, Батыс Қарахандарды өзіне тәуелді етті."}, {"from": 1000, "to": 1200, "name": "Айша бибі және Бабаджа қатын кесенелері", "type": "site", "where": "Жетісу", "lon": 71.13, "lat": 42.83, "text": "Тараз маңындағы бұл кесенелер XI–XII ғғ. салынған. Айша бибі кесенесі ою-өрнекті терракота кірпіштерімен әйгілі."}, {"from": 1127, "to": 1127, "name": "Калян мұнарасы", "type": "site", "where": "Мәуереннахр", "lon": 64.42, "lat": 39.77, "text": "Қарахан билеушісі Арслан хан Мұхаммед Бұхарада биіктігі 46 метрлік Калян мұнарасын салдырды."}, {"from": 950, "to": 1150, "name": "Сыр бойы мен Жетісу қалаларының өркендеуі", "type": "city", "where": "Сыр бойы", "lon": 68.27, "lat": 43.3, "text": "Отырар (Фараб), Шауғар (кейін Ясы, Түркістан), Сығанақ, Испиджаб, Тараз, Баласағұн ислам мәдениетінің орталықтарына айналды. Қалаларда мешіт, медресе, монша, қолөнер орамдары пайда болды."}, {"from": 1124, "to": 1128, "name": "Елюй Дашидің батысқа жорығы", "type": "migration", "where": "Жетісу", "lon": 75.25, "lat": 42.75, "route": [[110, 46], [102, 46.5], [95, 46], [88, 46], [82, 45.5], [78, 44], [75.25, 42.75]], "text": "Чжурчжэндер Ляо империясын құлатқанда, қидан ханзадасы Елюй Даши батысқа кетті. 1128 ж. Баласағұнды алып, Қарақытай мемлекетін құрды."}, {"from": 1137, "to": 1137, "name": "Хұжанд маңындағы шайқас", "type": "battle", "where": "Мәуереннахр", "lon": 69.6, "lat": 40.3, "text": "Қарақытайлар Самарқанд Қарахан ханы Махмұдты Хұжанд маңында жеңді. Батыс Қарахандар Қарақытайға алым төлей бастады."}, {"from": 1141, "to": 1141, "name": "Қатуан шайқасы", "type": "battle", "where": "Мәуереннахр", "lon": 66.9, "lat": 39.8, "text": "Елюй Даши Самарқанд маңындағы Қатуан даласында Селжұқ сұлтаны Санжарды талқандады. Мәуереннахр мен Хорезм Қарақытайдың алым төлеушісіне айналды."}, {"from": 1093, "to": 1166, "name": "Қожа Ахмет Ясауи", "type": "site", "where": "Сыр бойы", "lon": 68.27, "lat": 43.3, "text": "Испиджабта (Сайрамда) туып, Ясыда (Түркістанда) өмір сүрген сопы ақын «Диуани хикмет» жинағын түркі тілінде жазды. Ол 1166 ж. қайтыс болды; туған жылы деректе әртүрлі (1093 не 1103)."}, {"from": 1150, "to": 1200, "name": "Сығанақ — қыпшақтардың орталығы", "type": "city", "where": "Сыр бойы", "lon": 66.95, "lat": 44.16, "text": "XII ғ. Сығанақ Сыр бойындағы қыпшақ хандарының орталығы әрі далалықтар мен отырықшылардың сауда орны болды. Хорезм шахтары Сыр бойын алу үшін қыпшақтармен кезек соғысып, кезек одақтасты."}, {"from": 1185, "to": 1185, "name": "Игорь князьдің половецтерге жорығы", "type": "battle", "where": "Батыс қыпшақтар", "lon": 38.5, "lat": 48.5, "text": "Новгород-Северский князі Игорь половецтерге (қыпшақтарға) жорық жасап, хан Кончактан жеңілді. Бұл оқиға «Игорь жасағы туралы жырда» суреттелген (орны шамамен)."}, {"from": 1203, "to": 1203, "name": "Керей ханы Тоғырыл жеңілді", "type": "battle", "where": "Керей хандығы", "lon": 108.5, "lat": 47.0, "text": "Темучин бұрынғы одақтасы Ван ханды тұтқиыл шабуылмен жеңді. Тоғырыл найман жеріне қашып бара жатқанда өлтірілді, керейлер моңғолдарға бағынды (орны шамамен)."}, {"from": 1204, "to": 1204, "name": "Шақырмауыт шайқасы", "type": "battle", "where": "Найман хандығы", "lon": 103.5, "lat": 47.2, "text": "Таян хан бастаған наймандар Шыңғыс ханнан жеңіліп, Таян қаза тапты. Оның ұлы Күшлік батысқа қашты (орны шамамен)."}, {"from": 1206, "to": 1206, "name": "Шыңғыс хан ұлы хан болып жарияланды", "type": "event", "where": "Моңғол мемлекеті", "lon": 110.5, "lat": 48.5, "text": "Онон өзенінің бойындағы құрылтайда Темучин Шыңғыс хан деп жарияланды. Ол әскерді ондық жүйемен қайта құрып, «Ұлы Ясаны» енгізді (орны шамамен)."}, {"from": 1208, "to": 1208, "name": "Ертіс бойындағы шайқас", "type": "battle", "where": "Найман хандығы", "lon": 84.5, "lat": 48.0, "text": "Моңғолдар Ертіс бойында найман мен меркіттердің қалдығын талқандады. Күшлік Қарақытайға қашып, гурханның қызына үйленді (орны шамамен)."}, {"from": 1210, "to": 1210, "name": "Хорезмшах Қарақытайды жеңді", "type": "battle", "where": "Жетісу", "lon": 71.4, "lat": 42.9, "text": "Хорезмшах Мұхаммед Талас маңында қарақытай қолбасшысы Таянгуды жеңіп, тұтқынға алды. Қарақытай мемлекеті әлсіреп, Мәуереннахр Хорезмге өтті (орны шамамен)."}, {"from": 1211, "to": 1211, "name": "Күшлік билікті тартып алды", "type": "event", "where": "Жетісу", "lon": 75.25, "lat": 42.75, "text": "Найман Күшлік гурхан Чжилугуды тақтан тайдырып, Қарақытай билігін алды. Ол мұсылмандарды қудалап, жергілікті халықтың наразылығын туғызды."}, {"from": 1211, "to": 1211, "name": "Қарлұқтар Шыңғыс ханға бағынды", "type": "event", "where": "Жетісу", "lon": 80.26, "lat": 45.66, "text": "Қаялықтағы қарлұқ билеушісі Арслан хан мен Алмалық билеушісі Бұзар Шыңғыс ханға өз еркімен бағынды. Жетісудың солтүстік-шығысы моңғолдар ықпалына өтті."}, {"from": 1216, "to": 1216, "name": "Ырғыз бойындағы шайқас", "type": "battle", "where": "Дешті Қыпшақ", "lon": 61.3, "lat": 48.6, "text": "Меркіттерді қуып келген Жошы әскері мен хорезмшах Мұхаммед әскері Ырғыз бойында алғаш соғысты. Шайқас нақты жеңіссіз аяқталды, бірақ хорезмшах моңғол әскерінің күшін көрді (кей деректе 1219 ж.; орны шамамен)."}, {"from": 1218, "to": 1218, "name": "Жебе Күшлікті жеңді", "type": "battle", "where": "Жетісу", "lon": 71.5, "lat": 37.5, "text": "Шыңғыс хан жіберген Жебе Қарақытай жерін алды, жергілікті халық Күшлікке қарсы шықты. Күшлік Бадахшанға қашып, сонда өлтірілді (орны шамамен)."}, {"from": 1218, "to": 1218, "name": "Отырар оқиғасы", "type": "event", "where": "Сыр бойы", "lon": 68.3, "lat": 42.85, "text": "Отырар билеушісі Қайыр хан (Иналшық) Шыңғыс ханның 450-ге жуық адамы бар сауда керуенін тыңшы деп қырып тастады. Хорезмшах моңғол елшілерін де өлтіргеннен кейін Шыңғыс хан Орта Азияға жорыққа аттанды."}, {"from": 1218, "to": 1218, "name": "Жетісу моңғолдарға бағынды", "type": "event", "where": "Жетісу", "lon": 75.25, "lat": 42.75, "text": "Жебе қолбасшы Қарақытайды басып алған Күшлікті талқандады. Жетісу мен Шығыс Түркістан моңғолдардың қолына өтті."}, {"from": 1219, "to": 1219, "name": "Шыңғыс ханның Орта Азияға жорығы", "type": "migration", "where": "Ертіс – Жетісу – Сыр бойы", "lon": 83, "lat": 47, "route": [[88, 48.5], [85.5, 47.9], [83, 47], [80.53, 44.24], [78, 45.5], [73, 44], [68.3, 42.85]], "text": "Шыңғыс хан 1219 жылдың жазын Ертіс бойында өткізіп, Жетісу арқылы Сырдарияға аттанды. Қарлұқтар мен ұйғырлар әскеріне қосылды."}, {"from": 1219, "to": 1219, "name": "Алмалық пен Қаялық әскері моңғолдарға қосылды", "type": "event", "where": "Жетісу", "lon": 80.53, "lat": 44.24, "text": "Алмалық пен Қаялықтың қарлұқ билеушілері Шыңғыс ханға өз еркімен бағынып, Отырарға аттанған әскерге қосылды."}, {"from": 1219, "to": 1220, "name": "Отырар қорғанысы", "type": "battle", "where": "Сыр бойы", "lon": 68.3, "lat": 42.85, "text": "Қайыр хан бастаған қала халқы шамамен алты ай қорғанды. Сатқындықтан қала алынып, Қайыр хан ішкі қамалда соңына дейін шайқасып, тұтқынға түсіп өлтірілді."}, {"from": 1219, "to": 1220, "name": "Жошының Сыр бойына жорығы", "type": "migration", "where": "Сыр бойы", "lon": 66.96, "lat": 44.16, "route": [[68.3, 42.85], [66.96, 44.16], [65.9, 44.7], [64.3, 44.9]], "text": "Жошы Сығанақты, Үзкентті, Баршынкентті, Жентті алды. Сыр бойы қалаларының тұрғындары қатты қарсылық көрсетті."}, {"from": 1219, "to": 1219, "name": "Сығанақ қорғанысы", "type": "battle", "where": "Сыр бойы", "lon": 66.96, "lat": 44.16, "text": "Сығанақ халқы моңғол елшісін өлтіріп, жеті күн қорғанды. Қала алынған соң тұрғындары қырылды."}, {"from": 1220, "to": 1220, "name": "Бұхараның алынуы", "type": "city", "where": "Мәуереннахр", "lon": 64.42, "lat": 39.77, "text": "Шыңғыс хан Отырардан кейін Бұхараны алып, өртеді."}, {"from": 1220, "to": 1220, "name": "Самарқанның алынуы", "type": "city", "where": "Мәуереннахр", "lon": 66.97, "lat": 39.65, "route": [[68.3, 42.85], [64.42, 39.77], [66.97, 39.65]], "text": "Хорезмшахтың жаңа астанасы бірнеше күн қоршаудан кейін берілді. Қолөнершілері Моңғолияға айдалды."}, {"from": 1221, "to": 1221, "name": "Үргеніштің құлауы", "type": "city", "where": "Хорезм", "lon": 59.15, "lat": 42.33, "text": "Жошы, Шағатай, Үгедей ұзақ қоршаудан кейін Хорезм астанасын алды. Әмудария бөгетін бұзып, қаланы суға батырды."}, {"from": 1223, "to": 1223, "name": "Қалқа шайқасы", "type": "battle", "where": "Дешті Қыпшақ", "lon": 37.6, "lat": 47.3, "text": "Жебе мен Сүбедей қыпшақтар мен орыс княздерінің біріккен әскерін Қалқа өзенінде жеңді."}, {"from": 1224, "to": 1224, "name": "Ұлыстарға бөлу", "type": "law", "where": "Жетісу", "lon": 72.8, "lat": 43.0, "text": "Шыңғыс хан жорықтан қайтып, Құланбасы өңірінде ұлдарымен жиналды. Жаулаған жер Жошы, Шағатай, Үгедей ұлыстарына бөлінді (орны шамамен; бөлінудің уақыты деректерде 1224–1227)."}, {"from": 1227, "to": 1227, "name": "Шыңғыс ханның өлімі", "type": "event", "where": "Моңғол империясы", "lon": 106.0, "lat": 38.5, "text": "Шыңғыс хан Тангут жорығы кезінде қайтыс болды. Сол жылы Жошы да дүниеден өтті, ұлысын ұлы Батый алды."}, {"from": 1227, "to": 1227, "name": "Жошы хан кесенесі", "type": "site", "where": "Ұлытау", "lon": 67.9, "lat": 48.1, "text": "Ұлытау өңірінде, Кеңгір бойында Жошының кесенесі тұр. Салынған уақыты туралы деректер әртүрлі (XIII–XIV ғғ.)."}, {"from": 1229, "to": 1229, "name": "Үгедей ұлы хан болды", "type": "event", "where": "Моңғол империясы", "lon": 102.8, "lat": 47.2, "text": "Құрылтай Үгедейді ұлы хан етіп сайлады. Қарақорым империя астанасына айналды."}, {"from": 1235, "to": 1235, "name": "Қарақорым құрылтайы", "type": "event", "where": "Моңғол империясы", "lon": 102.8, "lat": 47.2, "text": "Құрылтай Батыйды бас етіп батысқа жорық жасауды шешті."}, {"from": 1236, "to": 1242, "name": "Батыйдың Батыс жорығы", "type": "migration", "where": "Дешті Қыпшақ – Еуропа", "lon": 49.06, "lat": 54.98, "route": [[56, 52.5], [49.06, 54.98], [40.1, 54.4], [40.41, 56.13], [35.5, 52], [30.52, 50.45], [26, 49.5], [20.9, 48]], "text": "Батый Еділ бұлғарларын, қыпшақтарды, орыс княздіктерін бағындырып, Польша мен Венгрияға дейін барды."}, {"from": 1236, "to": 1236, "name": "Еділ Бұлғарының алынуы", "type": "city", "where": "Еділ бойы", "lon": 49.06, "lat": 54.98, "text": "Бұлғар қаласы алынып, Еділ бұлғарлары Жошы ұлысына бағынды."}, {"from": 1238, "to": 1238, "name": "Владимирдің алынуы", "type": "city", "where": "Орыс княздіктері", "lon": 40.41, "lat": 56.13, "text": "Рязань, Владимир, т.б. қалалар алынды; Сит өзенінде ұлы князь Юрий жеңілді."}, {"from": 1240, "to": 1240, "name": "Киевтің алынуы", "type": "city", "where": "Орыс княздіктері", "lon": 30.52, "lat": 50.45, "text": "Батый әскері Киевті қоршап алды. Оңтүстік орыс жері де бағындырылды."}, {"from": 1241, "to": 1241, "name": "Легница мен Шайо шайқастары", "type": "battle", "where": "Еуропа", "lon": 20.9, "lat": 48.0, "text": "Моңғолдар поляк-неміс және венгр әскерлерін жеңді. 1242 жылы ұлы хан Үгедейдің өлімінен кейін Батый Еділге қайтты."}, {"from": 1243, "to": 1243, "name": "Алтын Орданың құрылуы", "type": "event", "where": "Еділ бойы", "lon": 47.45, "lat": 47.17, "text": "Батый Еділдің төменгі ағысында мемлекет құрып, Сарай-Бату қаласын астана етті. Жошы ұлысы Ертістен Дунайға дейін созылды."}, {"from": 1251, "to": 1251, "name": "Мөңке ұлы хан болды", "type": "event", "where": "Моңғол империясы", "lon": 102.8, "lat": 47.2, "text": "Батыйдың қолдауымен Төленің ұлы Мөңке ұлы хан болды. Батыйдың империядағы ықпалы күшейді."}, {"from": 1253, "to": 1254, "name": "Рубруктың Қаялыққа келуі", "type": "event", "where": "Жетісу", "lon": 80.26, "lat": 45.66, "text": "Француз королінің елшісі Гильом Рубрук Қарақорымға бара жатып Қаялықта болды. Қала мен ондағы мешіт, будда ғибадатханаларын сипаттап жазды (Қаялық — бүгінгі Қойлық ауылы маңы)."}, {"from": 1256, "to": 1256, "name": "Ілхандар мемлекетінің құрылуы", "type": "event", "where": "Иран", "lon": 46.29, "lat": 38.08, "text": "Құлағу Иранды, кейін Бағдатты (1258) алып, Ілхандар мемлекетін құрды."}, {"from": 1257, "to": 1257, "name": "Берке хан тағына отырды", "type": "event", "where": "Алтын Орда", "lon": 45.34, "lat": 48.68, "text": "Хан болмай тұрып исламды қабылдаған Берке 1257 жылы таққа отырды, ол — мұсылман болған алғашқы Жошы ұрпағы. Ордада мұсылман ғалымдары мен көпестердің ықпалы өсті."}, {"from": 1257, "to": 1259, "name": "Орыс жерлеріндегі санақ", "type": "law", "where": "Орыс княздіктері", "lon": 40.41, "lat": 56.13, "text": "Алым-салық жинау үшін халық санағы жүргізілді. Баскақтар салық жинауды қадағалады."}, {"from": 1260, "to": 1262, "name": "Берке мен Бейбарыс одағы", "type": "event", "where": "Алтын Орда – Мысыр", "lon": 31.24, "lat": 30.04, "route": [[35.38, 45.03], [31, 42.5], [28.98, 41.01], [27, 38], [29, 34], [31, 31.5], [31.24, 30.04]], "text": "Берке Ілхандарға қарсы Мысыр мәмлүктерінің сұлтаны Бейбарыспен одақ құрды. Елшілер Қырым порттарынан бұғаздар арқылы Мысырға жүзді."}, {"from": 1260, "to": 1266, "name": "Сарай-Берке салынды", "type": "city", "where": "Еділ бойы", "lon": 45.34, "lat": 48.68, "text": "Еділдің сол тармағы Ахтубада Жаңа Сарай салынды. Мұнда сарай, мешіттер, шеберханалар болды (салынған уақыты деректерде әртүрлі)."}, {"from": 1262, "to": 1263, "name": "Терек бойындағы шайқас", "type": "battle", "where": "Солтүстік Кавказ", "lon": 46.0, "lat": 43.7, "text": "Берке қолбасшысы Ноғай Құлағу әскерін Терек өзенінде талқандады (орны шамамен)."}, {"from": 1266, "to": 1266, "name": "Меңгу-Темір өз атынан теңге соқтырды", "type": "law", "where": "Алтын Орда", "lon": 45.34, "lat": 48.68, "text": "Алтын Орда теңгесінде ұлы ханның есімінің орнына өз ханының есімі жазыла бастады. Бұл Қарақорымнан бөлінудің белгісі болды."}, {"from": 1269, "to": 1269, "name": "Талас құрылтайы", "type": "event", "where": "Жетісу", "lon": 71.4, "lat": 42.9, "text": "Жошы, Шағатай, Үгедей ұрпақтары Талас бойында жиналып, Мәуереннахрдағы жерлерді бөлісті. Ұлыстар іс жүзінде ұлы ханнан бөлінді."}, {"from": 1299, "to": 1300, "name": "Тоқта хан мен Ноғай әмірдің тартысы", "type": "battle", "where": "Алтын Орда", "lon": 33.5, "lat": 47.5, "text": "Батыс ұлыстарды билеген Ноғай әмір Византиямен өз бетінше байланыс жасады. Тоқта хан оны жеңіп, хан билігін күшейтті (орны шамамен)."}, {"from": 1301, "to": 1309, "name": "Үгедей ұлысының ыдырауы", "type": "event", "where": "Тарбағатай", "lon": 83.6, "lat": 46.5, "text": "Қайду өлгеннен кейін Шағатай әулетінен шыққан Дува Үгедей ұлысын өзіне қаратты."}, {"from": 1312, "to": 1312, "name": "Ислам мемлекеттік дін болды", "type": "law", "where": "Алтын Орда", "lon": 45.34, "lat": 48.68, "text": "Өзбек хан исламды мемлекеттік дін етіп жариялады. Оған қарсы шыққан ақсүйектер жазаланды."}, {"from": 1315, "to": 1320, "name": "Ерзеннің қала құрылысы", "type": "city", "where": "Сыр бойы", "lon": 68.3, "lat": 42.85, "text": "Ақ Орда ханы Ерзен Отырар, Сығанақ, Сауран, Жент, Баршынкентте мешіт, медресе, ханакалар салдырды."}, {"from": 1320, "to": 1344, "name": "Мүбарак-қожа теңгесі", "type": "law", "where": "Ақ Орда", "lon": 66.96, "lat": 44.16, "text": "Мүбарак-қожа Сығанақта өз атынан теңге соқтырды. Бұл Ақ Орданың Сарайдан бөлінуге ұмтылысы еді."}, {"from": 1333, "to": 1334, "name": "Ибн Баттутаның Алтын Ордаға келуі", "type": "event", "where": "Алтын Орда", "lon": 47.45, "lat": 47.17, "text": "Араб саяхатшысы Өзбек ханның ордасында, Сарайда болып, елдің байлығын, қалаларын, әйелдердің құрметті орнын жазып қалдырды."}, {"from": 1346, "to": 1347, "name": "Кафаны қоршау және оба", "type": "event", "where": "Қырым", "lon": 35.38, "lat": 45.03, "text": "Жәнібек хан Генуяның Кафа портын қоршады. Әскерде оба тарап, кейін бүкіл Еуропа мен Алтын Ордада халықты қырды."}, {"from": 1348, "to": 1348, "name": "Моғолстанның құрылуы", "type": "event", "where": "Жетісу", "lon": 80.53, "lat": 44.24, "text": "Дулат әмірлері Шағатай ұлысының шығысында Тоғылық Темірді хан көтерді. Мемлекет Жетісу мен Шығыс Түркістанды қамтыды."}, {"from": 1359, "to": 1380, "name": "Ұлы дүрбелең", "type": "event", "where": "Алтын Орда", "lon": 45.34, "lat": 48.68, "text": "Бердібек өлтірілгеннен кейін 20 жылда жиырмадан астам хан ауысты. Ел Мамай билеген батыс бөлікке және бірнеше ұлысқа бөлінді."}, {"from": 1360, "to": 1361, "name": "Тоғылық Темірдің Мәуереннахрға жорығы", "type": "migration", "where": "Мәуереннахр", "lon": 66.97, "lat": 39.65, "route": [[80.53, 44.24], [75, 43], [69.24, 41.3], [66.97, 39.65]], "text": "Моғол ханы Мәуереннахрды екі рет жаулап алып, ұлы Ілияс-Қожаны билеуші етіп қалдырды."}, {"from": 1361, "to": 1361, "name": "Орыс хан Ақ Орда тағына отырды", "type": "event", "where": "Ақ Орда", "lon": 66.96, "lat": 44.16, "text": "Орыс хан Сығанақты астана етіп, Ақ Орданы Алтын Ордадан іс жүзінде бөлек мемлекетке айналдырды (кейбір деректе 1368 жыл)."}, {"from": 1365, "to": 1365, "name": "Батпақ шайқасы", "type": "battle", "where": "Мәуереннахр", "lon": 69.3, "lat": 41.3, "text": "Ташкент маңында Ілияс-Қожа бастаған моғолдар Ақсақ Темір мен Хусейінді жеңді. Самарқан халқы қаланы өзі қорғап қалды."}, {"from": 1370, "to": 1370, "name": "Ақсақ Темір билікке келді", "type": "event", "where": "Мәуереннахр", "lon": 66.97, "lat": 39.65, "text": "Темір Балхта Хусейінді жеңіп, Самарқанды астана етті. Келесі он жылда Моғолстанға бірнеше рет жорық жасады."}, {"from": 1371, "to": 1390, "name": "Ақсақ Темірдің Моғолстанға жорықтары", "type": "migration", "where": "Жетісу", "lon": 76.9, "lat": 43.3, "route": [[66.97, 39.65], [69.24, 41.3], [72.8, 43], [76.9, 43.3], [80.53, 44.24], [84, 46.5], [85.5, 47.9]], "text": "Темір Моғолстанға жеті-сегіз рет жорық жасап, Жетісуды күйзелтті. Соңғы жорықта (1390) әскері Ертіске дейін жетті."}, {"from": 1374, "to": 1375, "name": "Орыс ханның Сарайға жорығы", "type": "migration", "where": "Алтын Орда", "lon": 45.34, "lat": 48.68, "route": [[66.96, 44.16], [62, 46.5], [56, 48], [50, 48.5], [45.34, 48.68]], "text": "Орыс хан Алтын Орда тағына таласып, Сарайды алды, бірақ онда ұзақ тұрақтай алмады."}, {"from": 1376, "to": 1379, "name": "Тоқтамыстың Ақ Ордаға шабуылдары", "type": "migration", "where": "Ақ Орда", "lon": 66.96, "lat": 44.16, "route": [[66.97, 39.65], [68.3, 42.85], [67.77, 43.52], [66.96, 44.16]], "text": "Ақсақ Темірге қашып барған Тоқтамыс оның әскерімен Ақ Ордаға бірнеше рет шабуыл жасап, Орыс хан мен оның ұлдарынан жеңілді. 1379 жылға қарай Сығанақты алды."}, {"from": 1377, "to": 1377, "name": "Орыс ханның қайтыс болуы", "type": "event", "where": "Ақ Орда", "lon": 66.96, "lat": 44.16, "text": "Орыс хан Тоқтамыспен соғыс кезінде қайтыс болды. Ұлдары Тоқтақия мен Темір-Мәлік таққа ұзақ отыра алмады."}, {"from": 1380, "to": 1380, "name": "Куликово шайқасы", "type": "battle", "where": "Орыс княздіктері", "lon": 38.66, "lat": 53.65, "text": "Мәскеу князі Дмитрий Мамайдың әскерін жеңді. Бұл Ордаға тәуелді орыс жерінің алғашқы ірі жеңісі болды."}, {"from": 1380, "to": 1380, "name": "Тоқтамыс Мамайды жеңді", "type": "battle", "where": "Алтын Орда", "lon": 37.6, "lat": 47.3, "text": "Тоқтамыс Қалқа өзенінде Мамайды жеңіп, Ақ Орда мен Алтын Орданы өз қолына біріктірді."}, {"from": 1382, "to": 1382, "name": "Тоқтамыстың Мәскеуді өртеуі", "type": "city", "where": "Орыс княздіктері", "lon": 37.62, "lat": 55.75, "text": "Тоқтамыс Мәскеуді алып, өртеді. Мәскеу князі Ордаға алым төлеуді қайта бастады."}, {"from": 1385, "to": 1386, "name": "Тоқтамыстың Тебризге жорығы", "type": "migration", "where": "Әзірбайжан", "lon": 46.29, "lat": 38.08, "route": [[45.34, 48.68], [47.5, 43], [48.29, 42.06], [46.29, 38.08]], "text": "Тоқтамыс Кавказ арқылы өтіп, Тебризді талқандады. Бұл оны Ақсақ Темірмен соқтығыстырды."}, {"from": 1391, "to": 1391, "name": "Ақсақ Темірдің Дешті Қыпшаққа жорығы", "type": "migration", "where": "Дешті Қыпшақ", "lon": 67.0, "lat": 48.6, "route": [[69.24, 41.3], [68.27, 43.3], [67, 48.6], [64, 52], [57, 52.5], [51, 53.5], [50.7, 53.8]], "text": "Темір Ташкенттен Сарыарқа арқылы Тоқтамысқа аттанды. Жолда Ұлытау маңындағы Алтын шоқы тауына жазу қалдырды (орны шамамен)."}, {"from": 1391, "to": 1391, "name": "Құндызша шайқасы", "type": "battle", "where": "Еділ бойы", "lon": 50.7, "lat": 53.8, "text": "Темір Тоқтамысты Құндызша өзенінде (Самара маңы) жеңді. Алтын Орданың әскери қуаты әлсіреді (орны шамамен)."}, {"from": 1395, "to": 1395, "name": "Терек шайқасы", "type": "battle", "where": "Солтүстік Кавказ", "lon": 44.6, "lat": 43.7, "route": [[46.29, 38.08], [48.29, 42.06], [44.6, 43.7]], "text": "Ақсақ Темір Тоқтамысты Терек бойында түпкілікті жеңді. Тоқтамыс Литваға қашты (орны шамамен)."}, {"from": 1395, "to": 1396, "name": "Сарай-Берке мен Еділ қалаларының қиратылуы", "type": "city", "where": "Алтын Орда", "lon": 45.34, "lat": 48.68, "route": [[44.6, 43.7], [48, 46.4], [45.34, 48.68]], "text": "Темір әскері Сарай-Беркені, Қажы-Тарханды, Азақты талқандады. Алтын Ордадағы сауда мен қала өмірі құлдырады."}, {"from": 1395, "to": 1405, "name": "Қожа Ахмет Ясауи кесенесі", "type": "site", "where": "Сыр бойы", "lon": 68.27, "lat": 43.3, "text": "Ақсақ Темірдің бұйрығымен Түркістанда Ясауи кесенесі салына бастады, бірақ ол өлген соң аяқталмай қалды (басталған жылы деректерде 1389–1399 аралығында)."}, {"from": 1396, "to": 1396, "name": "Ноғай Ордасының қалыптасуы", "type": "event", "where": "Жайық бойы", "lon": 51.73, "lat": 47.5, "text": "Едіге Еділ мен Жайық арасындағы маңғыт, т.б. тайпаларды біріктірді. Орталығы Сарайшық болды; ноғайлар Шыңғыс ұрпағы емес, бидің билігінде болды."}, {"from": 1399, "to": 1399, "name": "Ворскла шайқасы", "type": "battle", "where": "Дешті Қыпшақ", "lon": 34.6, "lat": 49.6, "text": "Едіге мен Темір-Құтлық хан Литва князі Витовт пен Тоқтамыстың әскерін жеңді. Едігенің ықпалы бүкіл Алтын Ордаға жайылды."}, {"from": 1405, "to": 1405, "name": "Ақсақ Темірдің Отырарда қайтыс болуы", "type": "event", "where": "Сыр бойы", "lon": 68.3, "lat": 42.85, "text": "Қытайға жорыққа шыққан Темір Отырарда қайтыс болды. Империя ұрпақтарының таласына түсті."}, {"from": 1406, "to": 1406, "name": "Тоқтамыстың өлімі", "type": "event", "where": "Батыс Сібір", "lon": 65.53, "lat": 57.15, "text": "Тоқтамыс Шыңғы-Тура (Түмен) маңында Едігенің адамдарының қолынан қаза тапты."}, {"from": 1408, "to": 1408, "name": "Едігенің Мәскеуге жорығы", "type": "migration", "where": "Орыс княздіктері", "lon": 37.62, "lat": 55.75, "route": [[45.34, 48.68], [44, 51], [40, 54], [37.62, 55.75]], "text": "Едіге Мәскеуді қоршап, айналасын шауып, алым алып қайтты."}, {"from": 1419, "to": 1419, "name": "Едігенің қаза табуы", "type": "event", "where": "Ноғай Ордасы", "lon": 51.73, "lat": 47.5, "text": "Едіге Тоқтамыстың ұлдарымен соғыста қаза тапты (қайтыс болған жері деректерде әртүрлі). Ұрпақтары Ноғай Ордасын билеуді жалғастырды."}, {"from": 1418, "to": 1428, "name": "Уәйіс ханның ойраттармен соғыстары", "type": "battle", "where": "Моғолстан", "lon": 82.0, "lat": 45.0, "text": "Моғол ханы Уәйіс ойраттармен көп рет соғысып, екі рет тұтқынға түсті. Моғолстан шығыстан қысым көре бастады (орны шамамен)."}, {"from": 1423, "to": 1428, "name": "Барақ ханның билігі", "type": "event", "where": "Ақ Орда", "lon": 66.96, "lat": 44.16, "text": "Барақ хан Ақ Ордада билікті алып, Ұлы Мұхаммедті Сарайдан қуды. 1428 жылы өлтірілген соң Ақ Орда ыдырады."}, {"from": 1428, "to": 1428, "name": "Әбілқайыр хандығының құрылуы", "type": "event", "where": "Батыс Сібір", "lon": 65.53, "lat": 57.15, "text": "Тура өңірінде шайбан әулетінен шыққан 17 жастағы Әбілқайыр хан болып жарияланды. Хандық Батыс Сібір мен Дешті Қыпшақты қамтыды."}, {"from": 1430, "to": 1431, "name": "Әбілқайырдың Үргенішті алуы", "type": "city", "where": "Хорезм", "lon": 59.15, "lat": 42.33, "route": [[65.53, 57.15], [62, 52], [60, 46], [59.15, 42.33]], "text": "Әбілқайыр Темір ұрпақтарынан Үргенішті тартып алды, бірақ қаланы ұзақ ұстай алмады."}, {"from": 1438, "to": 1438, "name": "Қазан хандығының құрылуы", "type": "event", "where": "Еділ бойы", "lon": 49.1, "lat": 55.8, "text": "Ұлы Мұхаммед Еділдің орта ағысында Қазан хандығының негізін қалады. Алтын Орда бөлшектене бастады."}, {"from": 1441, "to": 1441, "name": "Қырым хандығының бөлінуі", "type": "event", "where": "Қырым", "lon": 34.0, "lat": 44.8, "text": "Қажы-Гирей Қырымды Алтын Ордадан бөліп, дербес хандық құрды."}, {"from": 1446, "to": 1446, "name": "Әбілқайыр Сыр бойы қалаларын алды", "type": "city", "where": "Сыр бойы", "lon": 66.96, "lat": 44.16, "route": [[65.53, 57.15], [66, 52], [67, 47], [66.96, 44.16]], "text": "Әбілқайыр Сығанақ, Аққорған, Ақсүмбе, Үзкент қалаларын алып, Сығанақты ордасы етті."}, {"from": 1449, "to": 1449, "name": "Ұлықбектің өлтірілуі", "type": "event", "where": "Мәуереннахр", "lon": 66.97, "lat": 39.65, "text": "Темір ұрпақтарының тартысында Ұлықбекті өз ұлы өлтірді. Мәуереннахрда билік әлсіреді."}, {"from": 1451, "to": 1451, "name": "Әбілқайыр Әбу Саидке Самарқанды алып берді", "type": "migration", "where": "Мәуереннахр", "lon": 66.97, "lat": 39.65, "route": [[66.96, 44.16], [68.3, 42.85], [69.24, 41.3], [66.97, 39.65]], "text": "Әбілқайыр әскерімен Темір ұрпағы Әбу Саидті Самарқан тағына отырғызды. Бұл оның Мәуереннахрдағы ықпалын күшейтті."}, {"from": 1453, "to": 1453, "name": "Константинопольдің құлауы", "type": "city", "where": "Византия", "lon": 28.98, "lat": 41.01, "text": "Осман түріктері Константинопольді алып, Византия жойылды. Қара теңіз саудасы түріктердің бақылауына өтті."}, {"from": 1457, "to": 1457, "name": "Сығанақ маңындағы шайқас", "type": "battle", "where": "Сыр бойы", "lon": 67.2, "lat": 44.5, "text": "Үз-Темір тайшы бастаған ойраттар Әбілқайырды Сығанақ маңында жеңді. Хан қорлықпен бітім жасап, беделі түсті (орны шамамен)."}, {"from": 1459, "to": 1459, "name": "Керей мен Жәнібектің Моғолстанға көшуі", "type": "migration", "where": "Дешті Қыпшақ – Жетісу", "lon": 74.5, "lat": 43.9, "route": [[66, 46.5], [69, 45.6], [72, 44.6], [74.5, 43.9]], "text": "Әбілқайырға наразы Керей мен Жәнібек өз адамдарымен Батыс Жетісуға, Моғолстан шегіне көшіп кетті. Бұл Қазақ хандығы құрылуының бастамасы болды (көшу жылы деректерде 1456–1460 аралығында)."}, {"from": 1459, "to": 1462, "name": "Есен-Бұға Шу мен Қозыбасын берді", "type": "event", "where": "Жетісу", "lon": 74.5, "lat": 43.7, "text": "Моғол ханы Есен-Бұға Керей мен Жәнібекті қабылдап, оларға Шу бойы мен Қозыбасы өңірін берді. Мақсаты — Әбілқайыр мен Жүніске қарсы одақтас табу (Қозыбасының орны шамамен)."}, {"from": 1462, "to": 1462, "name": "Есен-Бұғаның қайтыс болуы", "type": "event", "where": "Моғолстан", "lon": 80.26, "lat": 41.17, "text": "Есен-Бұға өлгеннен кейін Моғолстан Жүніс хан мен Досмұхаммед арасында бөлінді. Бұл Жетісудағы қазақтардың күшеюіне жол ашты."}, {"from": 1465, "to": 1465, "name": "Қазақ хандығының құрылуы", "type": "event", "where": "Жетісу", "lon": 74.5, "lat": 43.7, "text": "Керей мен Жәнібек Шу мен Қозыбасы өңірінде хан көтерілді; Мұхаммед Хайдар Дулати бұл оқиғаны 1465–1466 жылдарға жатқызады."}, {"from": 1468, "to": 1470, "name": "Қазақтардың Дешті Қыпшаққа оралуы", "type": "migration", "where": "Сыр бойы", "lon": 68.3, "lat": 43.3, "text": "Әбілқайыр өлген соң оның ұлысындағы тайпалардың көбі Керей мен Жәнібекке қосылды, хан ордасы Сыр бойына жақындады.", "route": [[74.5, 43.7], [71.5, 43.6], [69.5, 43.4], [68.3, 43.3], [66.96, 44.16]]}, {"from": 1470, "to": 1500, "name": "Сыр бойы қалалары үшін күрес", "type": "battle", "where": "Сыр бойы", "lon": 67.77, "lat": 43.52, "text": "Бұрындық пен Қасым сұлтан Сығанақ, Сауран, Созақ, Отырар үшін Мұхаммед Шайбанимен ұзақ соғысты; қалалар бірнеше рет қолдан-қолға өтті."}, {"from": 1500, "to": 1500, "name": "Шайбанидің Мауараннахрды алуы", "type": "event", "where": "Мауараннахр", "lon": 66.97, "lat": 39.65, "text": "Мұхаммед Шайбани Темір әулетінен Самарқанды тартып алып, Шайбанилер мемлекетін құрды. Енді Сыр бойы қалалары үшін күрес қазақ пен Шайбанилер арасында өрбіді."}, {"from": 1510, "to": 1510, "name": "Қасымның Шайбаниді жеңуі", "type": "battle", "where": "Сыр бойы", "lon": 67.3, "lat": 44.6, "text": "1509–1510 жылдың қысында Шайбани қазақ ауылдарына жорық жасап, Қасым сұлтаннан жеңілді. Осыдан кейін Шайбанилер Сыр бойындағы қазақ жеріне қайта шабуыл жасамады. Шайқас орны шамамен."}, {"from": 1511, "to": 1521, "name": "«Қасым ханның қасқа жолы»", "type": "law", "where": "Қазақ хандығы", "lon": 51.73, "lat": 47.5, "text": "Қасым хан тұсында қалыптасқан заңдар жинағы: жер, мүлік, әскер міндеті, елшілік, әдет-ғұрып туралы бес бөлімнен тұрды."}, {"from": 1513, "to": 1513, "name": "Қасымның Сайрамды алуы", "type": "city", "where": "Сыр бойы", "lon": 69.77, "lat": 42.3, "text": "Қасым хан Сайрамды бағындырып, моғол ханы Сұлтан Саидпен келіссөз жүргізді; хандықтың оңтүстік шекарасы Ташкентке жақындады."}, {"from": 1514, "to": 1514, "name": "Жаркент хандығының құрылуы", "type": "event", "where": "Моғолстан", "lon": 77.27, "lat": 38.42, "text": "Моғол ханы Сұлтан Саид Қашқар мен Жаркентке көшіп, жаңа хандық құрды. Жетісудағы моғол билігі әлсіреп, жер біртіндеп қазақтарға өтті."}, {"from": 1512, "to": 1512, "name": "Хиуа хандығының құрылуы", "type": "event", "where": "Хорезм", "lon": 60.63, "lat": 41.55, "text": "Хорезмде Шайбани әулетінің бір тармағы (Арабшахилер) дербес хандық құрды; ол Кіші жүздің оңтүстік көршісі болды."}, {"from": 1521, "to": 1521, "name": "Қасым ханның қайтыс болуы", "type": "event", "where": "Жайық бойы", "lon": 51.73, "lat": 47.5, "text": "Қасым хан Сарайшықта қайтыс болып, сонда жерленді. Кейбір деректе 1518 жыл көрсетіледі; одан кейін хандықта ішкі талас басталды."}, {"from": 1523, "to": 1523, "name": "Мамаш ханның қаза табуы", "type": "battle", "where": "Жайық бойы", "lon": 52.5, "lat": 48.0, "text": "Қасымның ұлы Мамаш ноғайлармен соғыста қаза тапты; хандық Жайық пен Ембі бойынан айырыла бастады. Орны шамамен."}, {"from": 1526, "to": 1533, "name": "Тахирдің Жетісуға шегінуі", "type": "migration", "where": "Жетісу", "lon": 75.5, "lat": 42.6, "text": "Ноғайлардан жеңілген Тахир хан халықтың бір бөлігімен Жетісу мен Тянь-Шаньға кетіп, қырғыздарға сүйенді; хандық екіге бөлінгендей болды.", "route": [[66.96, 44.16], [69.8, 42.6], [72.5, 42.8], [75.5, 42.6]]}, {"from": 1537, "to": 1537, "name": "Тоғым ханның қаза табуы", "type": "battle", "where": "Жетісу", "lon": 76.0, "lat": 42.5, "text": "Тоғым хан моғол ханы Әбд ар-Рашидке қарсы шайқаста 37 сұлтанмен бірге қаза тапты. Шайқас орны шамамен."}, {"from": 1552, "to": 1556, "name": "Мәскеудің Қазан мен Астраханьды алуы", "type": "event", "where": "Еділ бойы", "lon": 48.03, "lat": 46.35, "text": "IV Иван Қазан (1552) мен Астрахань (1556) хандықтарын жаулап, Еділдің төменгі бойына шықты. Ресей Ноғай Ордасы мен қазақ даласына жақындады."}, {"from": 1557, "to": 1568, "name": "Хақназардың ноғайларды бағындыруы", "type": "event", "where": "Жайық бойы", "lon": 53.5, "lat": 48.5, "text": "Ноғай Ордасы екіге бөлінген кезде Хақназар Жайықтың шығысындағы ноғайлардың бір бөлігін өзіне қаратып, «қазақ пен ноғайдың ханы» атанды."}, {"from": 1560, "to": 1570, "name": "Хақназардың моғолдармен соғысы", "type": "battle", "where": "Жетісу", "lon": 77.5, "lat": 43.8, "text": "Хақназар қырғыздармен одақтасып, Жетісу үшін Әбд ар-Рашид пен оның ұлдарына қарсы соғысты; Жетісудың көп бөлігі қазақтарда қалды."}, {"from": 1573, "to": 1573, "name": "Третьяк Чебуков елшілігі", "type": "event", "where": "Сібір", "lon": 68.4, "lat": 58.1, "text": "IV Иван Хақназарға Третьяк Чебуковты елші етіп жіберді, бірақ оны жолда Сібір ханы Көшімнің адамдары өлтірді."}, {"from": 1582, "to": 1582, "name": "Ермак жорығы, Искердің алынуы", "type": "event", "where": "Сібір", "lon": 68.4, "lat": 58.1, "text": "Ермак бастаған казактар Сібір хандығының орталығы Искерді алды; Ресейдің Ертіс бойына шығуы басталды."}, {"from": 1582, "to": 1582, "name": "Тәуекелдің Бабас сұлтанды жеңуі", "type": "battle", "where": "Ташкент өңірі", "lon": 69.24, "lat": 41.31, "text": "Шығай мен Тәуекел Бұхара ханы II Абдолламен бірге Ташкент билеушісі Бабас сұлтанға қарсы соғысты; Тәуекел Бабасты өлтірді."}, {"from": 1594, "to": 1594, "name": "Құл-Мұхаммед елшілігі Мәскеуде", "type": "event", "where": "Мәскеу", "lon": 37.62, "lat": 55.75, "text": "Тәуекел хан Мәскеуге Құл-Мұхаммедті жіберіп, Бұхараға қарсы одақ пен Ресейде аманат болып отырған жиені Ораз-Мұхаммедті босатуды сұрады."}, {"from": 1595, "to": 1595, "name": "Вельяминов-Степанов елшілігі", "type": "event", "where": "Қазақ хандығы", "lon": 66.96, "lat": 44.16, "text": "Мәскеу патшасы Тәуекелге Вельяминов-Степановты жіберді; ол хандықтың әскери күші мен көршілері туралы мәлімет жинады. Орны шамамен."}, {"from": 1598, "to": 1598, "name": "Тәуекелдің Бұхара жорығы", "type": "migration", "where": "Мауараннахр", "lon": 66.97, "lat": 39.65, "text": "Тәуекел Ташкент пен Самарқанды алып, Бұхараға дейін жетті, бірақ қала түбінде жараланып, Ташкентке қайтып қайтыс болды.", "route": [[69.24, 41.31], [66.97, 39.65], [64.42, 39.77]]}, {"from": 1598, "to": 1598, "name": "Ташкент пен Сыр бойы қалаларының қосылуы", "type": "city", "where": "Сыр бойы", "lon": 69.24, "lat": 41.31, "text": "Тәуекел жорығының нәтижесінде Ташкент, Түркістан, Сайрам, Сауран Қазақ хандығына өтті; бұл қалалар XVIII ғ. 20-жылдарына дейін қазақ хандарының қолында болды."}, {"from": 1598, "to": 1598, "name": "Сібір хандығының құлауы", "type": "event", "where": "Сібір", "lon": 82.5, "lat": 54.3, "text": "Ресей әскері Об бойында Көшім ханды түпкілікті жеңді; Сібір хандығы жойылып, Ресей қазақ жерінің солтүстігіне шықты. Орны шамамен."}, {"from": 1598, "to": 1628, "name": "«Есім ханның ескі жолы»", "type": "law", "where": "Түркістан", "lon": 68.27, "lat": 43.3, "text": "Есім хан «Қасым ханның қасқа жолын» жаңғыртып, сұлтандар мен батырлардың құқығын, әскер жинау тәртібін бекітті."}, {"from": 1613, "to": 1627, "name": "Есім мен Тұрсын ханның күресі", "type": "battle", "where": "Ташкент өңірі", "lon": 69.24, "lat": 41.31, "text": "Ташкентте Тұрсын Мұхаммед өзін хан жариялап, Есімге қарсы шықты. 1627 жылы Есім Ташкентті алып, Тұрсынды өлтірді, қатаған руы жазаға ұшырады."}, {"from": 1613, "to": 1613, "name": "Жайық қалашығы", "type": "fort", "where": "Жайық бойы", "lon": 51.37, "lat": 51.23, "text": "Жайық казактарының орталығы қазіргі Орал орнына орнықты; кейбір деректе қалашықтың негізі 1584 жылы қаланған."}, {"from": 1628, "to": 1632, "name": "Қалмақтардың Еділге көшуі", "type": "migration", "where": "Кіші жүз жері", "lon": 56.0, "lat": 48.5, "text": "Торғауыт ойраттары қазақ даласы арқылы Еділ бойына көшіп, Ноғай Ордасын ығыстырды; Кіші жүздің батыс көршісі Қалмақ хандығы пайда болды.", "route": [[82.5, 47.5], [76, 48.5], [70, 49], [64, 49], [58, 48.5], [53, 48], [48, 47]]}, {"from": 1634, "to": 1634, "name": "Ноғай Ордасының ыдырауы", "type": "event", "where": "Жайық бойы", "lon": 51.73, "lat": 47.5, "text": "Қалмақ шабуылынан кейін Ноғай Ордасы ыдырап, ноғайлардың көбі Еділдің батысына, Солтүстік Кавказ бен Қырымға кетті."}, {"from": 1635, "to": 1635, "name": "Жоңғар хандығының құрылуы", "type": "event", "where": "Жоңғария", "lon": 84.0, "lat": 46.0, "text": "Батур-хунтайшы ойрат тайпаларын біріктіріп, Жоңғар хандығын құрды; сол жылы Жәңгір сұлтан жоңғарлардың тұтқынына түсіп, кейін босады."}, {"from": 1640, "to": 1645, "name": "Үйшік (Гурьев) қалашығы", "type": "fort", "where": "Жайық бойы", "lon": 51.92, "lat": 47.11, "text": "Ярославль көпесі Гурьевтер Жайықтың сағасында бекініс салды; бұл қазіргі Атырау қаласының бастауы. Негізі қаланған жыл деректерде 1640–1645."}, {"from": 1643, "to": 1643, "name": "Орбұлақ шайқасы", "type": "battle", "where": "Жетісу", "lon": 78.3, "lat": 44.6, "text": "Жәңгір хан 600 жауынгермен тау шатқалында қорған қазып, Батур-хунтайшының көп әскерін тоқтатты; Самарқан билеушісі Жалаңтөс батырдың көмегі жетіп, жоңғарлар шегінді. Орны шамамен."}, {"from": 1652, "to": 1652, "name": "Жәңгір ханның қаза табуы", "type": "battle", "where": "Жетісу", "lon": 77.5, "lat": 44.0, "text": "Жәңгір хан жоңғар қолбасшысы Ғалдамбамен шайқаста қаза тапты; хандық тағы бір рет ішкі алауыздыққа ұшырады. Орны шамамен."}, {"from": 1680, "to": 1715, "name": "«Жеті жарғы»", "type": "law", "where": "Түркістан", "lon": 68.27, "lat": 43.3, "text": "Тәуке хан Күлтөбедегі билер кеңесінде Төле, Қазыбек, Әйтеке билермен бірге заң жинағын қабылдады: жер дауы, құн, ұрлық, неке, әскер міндеті туралы баптар болды."}, {"from": 1681, "to": 1685, "name": "Ғалдан Бошоқтының Сайрамға жорығы", "type": "battle", "where": "Сыр бойы", "lon": 69.77, "lat": 42.3, "text": "Жоңғар билеушісі Ғалдан Бошоқты Жетісу мен Сыр бойына бірнеше рет шабуыл жасап, Сайрамды алды; Тәуке ханның ұлы тұтқынға түсті."}, {"from": 1686, "to": 1694, "name": "Тәукенің Ресеймен елшілік алмасуы", "type": "event", "where": "Сібір", "lon": 68.25, "lat": 58.2, "text": "Тәуке хан Тобылға және Мәскеуге елшілер жіберіп, сауда мен жоңғарға қарсы көмек туралы келіссөз жүргізді. Нақты жылдары деректерде әртүрлі."}, {"from": 1709, "to": 1709, "name": "Қоқан хандығының құрылуы", "type": "event", "where": "Ферғана", "lon": 70.94, "lat": 40.53, "text": "Шахрух бий Ферғананы Бұхарадан бөліп, Миң әулетінің иелігін құрды; XVIII ғ. соңынан Қоқан Ұлы жүзге қысым жасай бастады."}, {"from": 1710, "to": 1710, "name": "Қарақұм жиыны", "type": "event", "where": "Сыр бойы", "lon": 64.5, "lat": 46.5, "text": "Үш жүздің өкілдері Қарақұмда жиналып, жоңғарға қарсы бірігуге уағдаласты; Бөгенбай батыр қолбасшы болып сайланды. Орны шамамен."}, {"from": 1715, "to": 1716, "name": "Ямышев бекінісі және Бухгольц экспедициясы", "type": "fort", "where": "Ертіс бойы", "lon": 77.4, "lat": 51.9, "text": "I Петрдің бұйрығымен Бухгольц Ертіспен жоғары көтеріліп, Ямышев көлінің маңында бекініс салды; жоңғарлар оны қоршап, экспедиция кері шегінді. Орны шамамен."}, {"from": 1716, "to": 1716, "name": "Омбы бекінісі", "type": "fort", "where": "Ертіс бойы", "lon": 73.37, "lat": 54.98, "text": "Бухгольц шегінген жолда Ертіс пен Омбы өзені қосылған жерде бекініс салды; ол Ертіс шебінің негізгі тірегі болды."}, {"from": 1717, "to": 1717, "name": "Аягөз шайқасы", "type": "battle", "where": "Шығыс Қазақстан", "lon": 80.4, "lat": 47.95, "text": "Аягөз өзені бойында қазақ әскері жоңғарлардан жеңілді; Тәукеден кейінгі алауыздық жау шабуылын жеңілдетті."}, {"from": 1718, "to": 1718, "name": "Семей бекінісі", "type": "fort", "where": "Ертіс бойы", "lon": 80.25, "lat": 50.41, "text": "Ресей Ертістің жоғарғы бойында Семей бекінісін салды."}, {"from": 1720, "to": 1720, "name": "Өскемен бекінісі", "type": "fort", "where": "Ертіс бойы", "lon": 82.61, "lat": 49.95, "text": "Лихарев экспедициясы Ертіс бойында Өскемен бекінісін салды; Ертіс шебі Омбыдан Өскеменге дейін созылды."}, {"from": 1716, "to": 1720, "name": "Ертіс шебі", "type": "fort", "where": "Ертіс бойы", "lon": 76.95, "lat": 52.29, "text": "Омбы, Железинск, Ямышев, Семей, Өскемен бекіністері тізбегі; Ресей Орта жүздің Ертіс бойындағы жайылымдарын біртіндеп иеленді.", "route": [[73.37, 54.98], [76.95, 52.29], [80.25, 50.41], [82.61, 49.95], [84.0, 49.6]]}, {"from": 1723, "to": 1727, "name": "Ақтабан шұбырынды, Алқакөл сұлама", "type": "migration", "where": "Үш жүз", "lon": 68.5, "lat": 44.0, "text": "1723 жылдың көктемінде Цэван-Рабдан жоңғарлары Талас, Шу, Іле бойындағы ауылдарға тұтқиылдан шабуыл жасады. Халық Сыр бойына, Хиуа мен Бұхараға, Жайыққа қарай босып, көп адам қырылды.", "route": [[76, 44.5], [72, 43.4], [69, 42.6], [65.5, 44.6], [62, 45.8]]}, {"from": 1723, "to": 1723, "name": "Түркістан мен Ташкенттің жауға өтуі", "type": "city", "where": "Сыр бойы", "lon": 68.27, "lat": 43.3, "text": "Жоңғарлар Түркістан, Ташкент, Сайрамды басып алды; Ұлы жүз бен Орта жүздің бір бөлігі жоңғарға алым төлеуге мәжбүр болды."}, {"from": 1726, "to": 1726, "name": "Ордабасы жиыны", "type": "event", "where": "Үш жүз", "lon": 69.15, "lat": 42.45, "text": "Үш жүздің хандары, билері мен батырлары Ордабасы тауында жиналып, бірігіп соғысуға келісті; Әбілқайыр бас қолбасшы болып сайланды. Жылы кейбір деректе 1725–1726."}, {"from": 1728, "to": 1728, "name": "Бұланты-Білеуті шайқасы", "type": "battle", "where": "Ұлытау", "lon": 66.5, "lat": 48.0, "text": "Бұланты өзені бойында, Қарасиыр деген жерде үш жүздің біріккен әскері жоңғарларды ойсырата жеңді; ел бұл жерді «Қалмақ қырылған» атады. Орны шамамен."}, {"from": 1729, "to": 1729, "name": "Аңырақай шайқасы", "type": "battle", "where": "Жетісу", "lon": 74.9, "lat": 44.1, "text": "Балқаштың оңтүстігінде, Аңырақай тауы маңында Әбілқайыр бастаған қазақ әскері жоңғарларды жеңді. Кейбір деректе 1730; жеңістен кейін хан тағына талас басталып, Әбілқайыр мен Сәмеке әскерін алып кетті."}, {"from": 1730, "to": 1730, "name": "Әбілқайырдың Ресейге елшілігі", "type": "event", "where": "Кіші жүз", "lon": 55.97, "lat": 54.73, "text": "Әбілқайыр хан Сейітқұл Қойдағұлұлы мен Құтлымбет Қоштайұлын Уфа арқылы Петербургке жіберіп, Анна Иоанновнадан бодандыққа қабылдауды сұрады."}, {"from": 1731, "to": 1731, "name": "Кіші жүздің Ресейге анты", "type": "law", "where": "Кіші жүз", "lon": 59.0, "lat": 49.8, "text": "1731 жылы 19 ақпанда Анна Иоанновна грамотаға қол қойды. 10 қазанда Әбілқайыр мен бірнеше старшын Тевкелев алдында ант берді; көп старшын қарсы болды. Ант орны шамамен.", "route": [[55.97, 54.73], [57.5, 52.5], [58.5, 50.8], [59.0, 49.8]]}, {"from": 1732, "to": 1732, "name": "Сәмекенің Ресейге ант беруге келісуі", "type": "event", "where": "Орта жүз", "lon": 66.0, "lat": 50.5, "text": "Орта жүз ханы Сәмеке мен сұлтандардың бір бөлігі Ресей бодандығын қабылдауға келісім берді; бодандық іс жүзінде шектеулі болды. Орны шамамен."}, {"from": 1734, "to": 1734, "name": "Кириловтың «Орынбор жобасы»", "type": "law", "where": "Кіші жүз", "lon": 55.1, "lat": 51.77, "text": "И. Кирилов Жайық бойында қала салу, Орта Азияға сауда жолын ашу жоспарын ұсынды; жоба патшайымның бекітуін алып, Орынбор экспедициясы құрылды."}, {"from": 1735, "to": 1735, "name": "Орынбор бекінісі (қазіргі Орск)", "type": "fort", "where": "Кіші жүз", "lon": 58.57, "lat": 51.2, "text": "Орынбор экспедициясы Ор өзенінің сағасында алғашқы Орынбор бекінісін салды; кейін бұл жер Орск деп аталды."}, {"from": 1735, "to": 1743, "name": "Орынбор шебі", "type": "fort", "where": "Кіші жүз", "lon": 55.1, "lat": 51.77, "text": "Жайық пен Ор бойымен Гурьевтен Орск арқылы Тобылға дейін созылған бекіністер тізбегі; Жайықтың оң жағасы казактарға берілді.", "route": [[51.92, 47.11], [51.37, 51.23], [55.1, 51.77], [58.57, 51.2], [61.56, 54.08]]}, {"from": 1738, "to": 1738, "name": "Жолбарыстың Ресейге хаты", "type": "event", "where": "Ұлы жүз", "lon": 69.24, "lat": 41.31, "text": "Ташкенттегі Жолбарыс хан Ұлы жүздің бір бөлігін Ресей бодандығына алуды сұрады; жоңғар қысымы мен алыстық салдарынан бұл іске аспады."}, {"from": 1740, "to": 1740, "name": "Әбілмәмбет пен Абылайдың анты", "type": "event", "where": "Орта жүз", "lon": 58.57, "lat": 51.2, "text": "Орта жүздің ханы Әбілмәмбет пен Абылай сұлтан Орынборда (қазіргі Орск) Ресейге адалдыққа ант берді."}, {"from": 1740, "to": 1740, "name": "Жолбарыс ханның өлтірілуі", "type": "event", "where": "Ұлы жүз", "lon": 69.24, "lat": 41.31, "text": "Жолбарыс хан Ташкентте мешітте өлтіріліп, Түркістанда жерленді. Ұлы жүздің ісі Төле бидің қолына көшті."}, {"from": 1741, "to": 1743, "name": "Абылайдың жоңғар тұтқыны", "type": "event", "where": "Жоңғария", "lon": 81.32, "lat": 43.91, "text": "1741 жылы Абылай жоңғарларға қарсы шайқаста тұтқынға түсті. Қалдан-Церен ордасында екі жыл болып, Ресей елшісі К. Миллер мен Төле бидің араласуымен 1743 жылы босады."}, {"from": 1743, "to": 1743, "name": "Орынборды қазіргі орнына көшіру", "type": "city", "where": "Кіші жүз", "lon": 55.1, "lat": 51.77, "text": "Орынбор Сақмар өзенінің Жайыққа құяр тұсына көшірілді; қала Кіші жүзбен қатынас пен сауданың орталығына айналды."}, {"from": 1745, "to": 1745, "name": "Қалдан-Цереннің өлімі", "type": "event", "where": "Жоңғария", "lon": 81.32, "lat": 43.91, "text": "Қалдан-Церен қайтыс болған соң жоңғар ноёндары таққа таласып, Жоңғар хандығы әлсірей бастады."}, {"from": 1748, "to": 1748, "name": "Әбілқайырдың өлтірілуі", "type": "event", "where": "Кіші жүз", "lon": 63.5, "lat": 49.3, "text": "Әбілқайыр ханды Ұлқаяқ өзені бойында Орта жүз сұлтаны Барақ өлтірді; ханның ұлы Нұралы Ресейдің қолдауымен Кіші жүздің ханы болды. Орны шамамен."}, {"from": 1752, "to": 1752, "name": "Петропавл бекінісі", "type": "fort", "where": "Орта жүз", "lon": 69.15, "lat": 54.87, "text": "Есіл бойында Әулие Петр бекінісі салынды; ол Орта жүзбен сауда мен әкімшілік қатынастың орталығы болды."}, {"from": 1752, "to": 1755, "name": "Есіл шебі", "type": "fort", "where": "Орта жүз", "lon": 64.85, "lat": 54.47, "text": "Тобылдан Омбыға дейін Есіл бойымен бекіністер тізбегі салынып, Орынбор мен Ертіс шептерін жалғады; Орта жүздің солтүстік жайылымдары тарылды.", "route": [[61.56, 54.08], [64.85, 54.47], [69.15, 54.87], [73.37, 54.98]]}, {"from": 1755, "to": 1758, "name": "Жоңғар хандығының жойылуы", "type": "event", "where": "Жоңғария", "lon": 81.32, "lat": 43.91, "text": "Цин әскері жоңғар ноёндарының тартысын пайдаланып, хандықты жойды; Әмірсананың көтерілісі басылып, жоңғар халқының көбі қырылды."}, {"from": 1756, "to": 1757, "name": "Абылайдың Цинмен соғысы және келісімі", "type": "event", "where": "Орта жүз", "lon": 76.0, "lat": 48.5, "text": "Абылай Әмірсанаға пана берген соң Цин әскері Орта жүзге енді; Абылай шайқастан кейін келіссөзге барып, Цин императорына бағынуын мойындады. Орны шамамен."}, {"from": 1757, "to": 1757, "name": "Абылайдың Цинге елшілігі", "type": "migration", "where": "Орта жүз", "lon": 82.0, "lat": 47.5, "text": "Абылай Бейжіңге елшілер жіберіп, Цинмен бітім мен сауда байланысын орнатты; Ресей мұны алаңдаушылықпен қарсы алды.", "route": [[75, 49], [82, 47.5], [89.5, 45]]}, {"from": 1758, "to": 1770, "name": "Қазақтардың шығыс жерлерге оралуы", "type": "migration", "where": "Жетісу", "lon": 79.0, "lat": 46.0, "text": "Жоңғар құлаған соң Орта жүз бен Ұлы жүз рулары Тарбағатай, Алакөл, Іле бойына қайта көшті; Цин бұл жерлерді өзінікі санап, дау туды.", "route": [[72.0, 48.5], [76.0, 47.5], [79.0, 46.0], [81.0, 45.0]]}, {"from": 1760, "to": 1781, "name": "Құлжа мен Шәуешектегі сауда", "type": "event", "where": "Шығыс Қазақстан", "lon": 82.98, "lat": 46.75, "text": "Қазақтар Цин бекіністерінде мал мен жүнді мата мен шайға айырбастады; бұл сауда Абылай саясатының бір тірегі болды."}, {"from": 1762, "to": 1762, "name": "Іле әскери генерал-губернаторлығы", "type": "event", "where": "Шығыс Түркістан", "lon": 81.32, "lat": 43.91, "text": "Цин империясы жаулап алған Жоңғария мен Шығыс Түркістанды басқару үшін Құлжада әскери губернатор отырғызды; қазақ даласымен шекара осы жерден басталды."}, {"from": 1765, "to": 1770, "name": "Абылайдың қырғыздарға жорықтары", "type": "battle", "where": "Жетісу", "lon": 75.5, "lat": 42.7, "text": "Абылай Ұлы жүз жерін қорғау үшін қырғыздарға қарсы бірнеше жорық жасады; соғыстар бітіммен аяқталды. Орны шамамен."}, {"from": 1771, "to": 1771, "name": "Абылайдың хан сайлануы", "type": "event", "where": "Түркістан", "lon": 68.27, "lat": 43.3, "text": "Әбілмәмбет хан қайтыс болған соң Абылай Түркістанда үш жүздің ханы болып ақ киізге көтерілді."}, {"from": 1771, "to": 1771, "name": "Қалмақтардың Жоңғарияға қашуы", "type": "migration", "where": "Кіші жүз жері", "lon": 61.0, "lat": 48.5, "text": "Еділ қалмақтарының көпшілігі Убаши ханмен бірге қазақ даласы арқылы Жоңғарияға көшті; Нұралы мен Абылай әскері оларды жолда қуып, көбі қырылды.", "route": [[46.5, 47.5], [51.5, 48.5], [56, 49], [61, 48.5], [66, 47.5], [72, 46.8], [75, 46.3], [79, 45], [81.32, 43.91]]}, {"from": 1771, "to": 1771, "name": "Мойынты маңындағы шайқас", "type": "battle", "where": "Орта жүз", "lon": 73.5, "lat": 47.0, "text": "Абылай әскері Балқаш маңында, Мойынты өзенінің бойында көшіп бара жатқан қалмақтарға соққы берді; бұл жерді де «Қалмақ қырылған» деп атайды. Орны шамамен."}, {"from": 1773, "to": 1775, "name": "Пугачев көтерілісі", "type": "uprising", "where": "Кіші жүз", "lon": 51.37, "lat": 51.23, "text": "Е. Пугачев бастаған шаруалар соғысына Кіші жүздің қазақтары да қатысты, оның ішінде Сырым Датұлы болды; көтеріліс басылған соң шептегі шектеу күшейді."}, {"from": 1778, "to": 1778, "name": "Ресейдің Абылайды хан деп мойындауы", "type": "event", "where": "Орта жүз", "lon": 69.15, "lat": 54.87, "text": "II Екатерина Абылайдың хан атағын бекітті, бірақ Абылай грамотаны алу үшін Петропавлға бармады; ол үш жүздің сайлаған ханы ретінде қалуды жөн көрді."}, {"from": 1781, "to": 1781, "name": "Абылай ханның қайтыс болуы", "type": "event", "where": "Түркістан", "lon": 68.27, "lat": 43.3, "text": "Абылай хан қайтыс болып, Түркістандағы Қожа Ахмет Ясауи кесенесіне жерленді; Орта жүзде ханды ұлы Уәли иеленді."}, {"from": 1781, "to": 1781, "name": "Уәлидің Орта жүз ханы болуы", "type": "event", "where": "Орта жүз", "lon": 69.4, "lat": 53.0, "text": "Абылай қайтыс болғаннан кейін ұлы Уәли хан сайланды. Ресей мен Цин оны хан деп таныды, бірақ Абылайдай беделі болмады."}, {"from": 1783, "to": 1797, "name": "Сырым Датұлы көтерілісі", "type": "uprising", "where": "Кіші жүз", "lon": 53.5, "lat": 50.0, "text": "Байбақты руының старшыны Сырым Жайық казактары мен бекіністердің жер тартып алуына, Нұралы ханның озбырлығына қарсы шықты. Көтеріліс Нұралыны тақтан түсіріп, хан билігін әлсіретті; 1797 ж. Сырым Хиуаға кетті."}, {"from": 1785, "to": 1785, "name": "Сырым жасақтарының Жайық бекіністеріне шабуылы", "type": "battle", "where": "Кіші жүз", "lon": 51.4, "lat": 50.5, "text": "Сырым бастаған жасақтар Жайық шебіндегі бекіністер мен казак қыстақтарына шабуыл жасады. Көтерілісшілер Нұралы ханды тайдыруды талап етті."}, {"from": 1786, "to": 1786, "name": "Игельстром реформасы", "type": "law", "where": "Кіші жүз", "lon": 55.1, "lat": 51.77, "text": "Уфа мен Симбирск генерал-губернаторы О. Игельстром Нұралыны тақтан тайдырып, хан билігін жоюды көздеді: шекаралық сот пен руларда расправалар (сот-басқару органдары) құрылды. Жоба толық жүзеге аспай, 1791 ж. хан билігі қалпына келтірілді."}, {"from": 1786, "to": 1790, "name": "Нұралы ханның Уфаға жер аударылуы", "type": "migration", "where": "Кіші жүз", "lon": 55.97, "lat": 54.73, "route": [[54.0, 50.8], [55.1, 51.77], [55.97, 54.73]], "text": "Тақтан тайдырылған Нұралы Уфаға жіберілді де, 1790 ж. сонда қайтыс болды."}, {"from": 1791, "to": 1791, "name": "Ералының хан болып бекітілуі", "type": "event", "where": "Кіші жүз", "lon": 55.1, "lat": 51.77, "text": "Патша үкіметі Нұралының інісі Ералыны хан етіп бекітті; Игельстром реформасынан бас тартылғанын көрсетті. Ералы 1794 ж. қайтыс болды."}, {"from": 1797, "to": 1797, "name": "Есім ханның өлтірілуі", "type": "event", "where": "Кіші жүз", "lon": 53.0, "lat": 50.5, "text": "Хан билігін қалпына келтірмек болған Есімді Сырым жасағы өлтірді. Бұдан кейін Кіші жүзде Хан кеңесі құрылды. Орны шамамен."}, {"from": 1797, "to": 1797, "name": "Хан кеңесінің құрылуы", "type": "law", "where": "Кіші жүз", "lon": 55.1, "lat": 51.77, "text": "Игельстромның ұсынысымен Айшуақ хан басқарған Хан кеңесі құрылды; оған ханның ұлдары мен ру басылары кірді. Кеңестің билігі әлсіз болып, көп ұзамай таратылды."}, {"from": 1797, "to": 1802, "name": "Сырымның Хиуаға кетуі", "type": "migration", "where": "Кіші жүз", "lon": 60.36, "lat": 41.38, "route": [[53.5, 50.0], [56.0, 47.0], [58.5, 44.5], [60.36, 41.38]], "text": "Көтеріліс басылып, жақтастары азайған соң Сырым Хиуа жеріне кетті. 1802 ж. сонда қайтыс болды (деректерде уланып өлді деген нұсқа бар)."}, {"from": 1801, "to": 1801, "name": "Бөкей ордасының құрылуы", "type": "migration", "where": "Бөкей ордасы", "lon": 49.0, "lat": 48.2, "route": [[52.5, 49.5], [51.5, 49.0], [50.3, 48.6], [49.0, 48.2]], "text": "1801 ж. 11 наурызда Павел I жарлығымен Бөкей сұлтан 5 мыңдай үймен Жайықтан өтіп, Еділ мен Жайық арасындағы Нарын құмына қоныстанды. Кіші жүзден бөлек Ішкі (Бөкей) орда пайда болды."}, {"from": 1805, "to": 1809, "name": "Жантөре хан және Қаратай сұлтанның қарсылығы", "type": "event", "where": "Кіші жүз", "lon": 54.5, "lat": 49.5, "text": "Жантөре хан болған соң, Нұралының ұлы Қаратай сұлтан оған қарсы топты басқарды. 1809 ж. Жантөре өлтіріліп, Кіші жүз 1812 жылға дейін хансыз қалды."}, {"from": 1808, "to": 1809, "name": "Ташкентті Қоқанның басып алуы", "type": "battle", "where": "Ұлы жүз", "lon": 69.24, "lat": 41.3, "text": "Қоқан ханы Әлім Ташкентті алды; бұдан кейін Ұлы жүз руларына Қоқан алым сала бастады."}, {"from": 1812, "to": 1812, "name": "Бөкейдің хан атағын алуы", "type": "event", "where": "Бөкей ордасы", "lon": 49.0, "lat": 48.2, "text": "Патша үкіметі Бөкей сұлтанды Ішкі орданың ханы етіп бекітті."}, {"from": 1812, "to": 1812, "name": "Шерғазының Кіші жүз ханы болуы", "type": "event", "where": "Кіші жүз", "lon": 55.1, "lat": 51.77, "text": "Айшуақтың ұлы Шерғазы хан болып бекітілді. Ол Орынбор әкімшілігіне бағынышты болып, ру басылары арасында беделі аз болды."}, {"from": 1814, "to": 1820, "name": "Қоқанның Сыр бойындағы бекіністері", "type": "fort", "where": "Сыр бойы", "lon": 65.51, "lat": 44.85, "text": "Қоқан хандығы Түркістанды алып, Сырдария бойына Ақмешіт, Жаңақорған, Жөлек бекіністерін салды. Сыр бойы мен Ұлы жүз қазақтары ауыр салықпен жаншылды."}, {"from": 1815, "to": 1817, "name": "Орта жүзде екі хан", "type": "event", "where": "Орта жүз", "lon": 77.0, "lat": 49.5, "text": "1815 ж. Уәлиге қарсы сұлтандардың өтінішімен Бөкей Барақұлы екінші хан болып бекітілді. 1817 ж. Бөкей қайтыс болды (кей деректе 1819 ж.); бұл хан билігінің бөлшектенгенін көрсетті. Орны шамамен."}, {"from": 1816, "to": 1821, "name": "Арынғазы сұлтанның хандығы", "type": "event", "where": "Кіші жүз", "lon": 63.5, "lat": 46.0, "text": "Сыр бойындағы рулар Арынғазы Әбілғазыұлын хан сайлады; ол Хиуа мен Қоқанның алымына қарсы шығып, Шерғазыға бәсекелес болды. 1821 ж. Орынборда тұтқындалып, Калугаға жер аударылды."}, {"from": 1818, "to": 1819, "name": "Ұлы жүздің бір бөлігінің Ресей бодандығын қабылдауы", "type": "event", "where": "Ұлы жүз", "lon": 78.5, "lat": 45.0, "text": "Сүйік Абылайұлы бастаған Қаратал, Лепсі бойындағы Ұлы жүз рулары Ресей бодандығын сұрап өтініш берді. Оңтүстіктегі рулар Қоқанға бағынышты күйде қалды."}, {"from": 1819, "to": 1819, "name": "Уәли ханның қайтыс болуы", "type": "event", "where": "Орта жүз", "lon": 69.4, "lat": 53.0, "text": "Уәли қайтыс болды (кейбір деректе 1821 ж.). Патша үкіметі жаңа хан сайлауға рұқсат бермеді."}, {"from": 1822, "to": 1822, "name": "«Сібір қазақтары туралы жарғы»", "type": "law", "where": "Орта жүз", "lon": 73.37, "lat": 54.98, "text": "М. Сперанский әзірлеген жарғымен Орта жүзде хан билігі жойылды. Жер округ, болыс, ауылға бөлінді; округті аға сұлтан басқарды, Омбы облысына бағынды."}, {"from": 1822, "to": 1822, "name": "Ғұбайдолланың хан сайлануы", "type": "event", "where": "Орта жүз", "lon": 69.4, "lat": 53.1, "text": "Уәлидің ұлы Ғұбайдолланы сұлтандар хан сайлады, бірақ Ресей бұл сайлауды мойындамады. Хандықты қалпына келтіру әрекеті сәтсіз аяқталды."}, {"from": 1823, "to": 1823, "name": "Жәңгірдің хан болып бекітілуі", "type": "event", "where": "Бөкей ордасы", "lon": 49.0, "lat": 48.2, "text": "1823 ж. патша Бөкейдің ұлы Жәңгірді хан етіп бекітті; 1824 ж. Орал қаласында салтанатпен хан көтерілді."}, {"from": 1824, "to": 1824, "name": "«Орынбор қазақтары туралы жарғы»", "type": "law", "where": "Кіші жүз", "lon": 55.1, "lat": 51.77, "text": "Кіші жүзде хан билігі жойылды; жүз батыс, орта, шығыс бөлікке бөлініп, әрқайсысын сұлтан-правитель басқарды. Бәрі Орынбор шекара комиссиясына бағынды; Шерғазы Орынборға шақырылды."}, {"from": 1824, "to": 1824, "name": "Көкшетау округінің ашылуы", "type": "fort", "where": "Орта жүз", "lon": 69.39, "lat": 53.28, "text": "Сібір жарғысы бойынша алғашқы округтің бірі ашылды; аға сұлтаны Ғұбайдолла Уәлиханов болды."}, {"from": 1824, "to": 1824, "name": "Қарқаралы округінің ашылуы", "type": "fort", "where": "Орта жүз", "lon": 75.47, "lat": 49.41, "text": "Орта жүздің шығысында алғашқы округтің бірі ашылып, бекініс-приказ орнады."}, {"from": 1825, "to": 1836, "name": "Саржан Қасымұлы қозғалысы", "type": "uprising", "where": "Орта жүз", "lon": 71.0, "lat": 48.5, "text": "Абылайдың немересі Саржан жаңа округтердің ашылуына қарсы шығып, округ бекеттеріне шабуыл жасады. 1836 ж. Ташкентте өлтірілді; күресін інісі Кенесары жалғастырды."}, {"from": 1827, "to": 1827, "name": "Хан ордасының салынуы", "type": "city", "where": "Бөкей ордасы", "lon": 47.42, "lat": 48.72, "text": "Жәңгір Жасқұс деген жерге тұрақты хан ордасын салдырды; мұнда хан сарайы, мешіт, дүкендер пайда болды."}, {"from": 1830, "to": 1830, "name": "Ақмола бекінісі", "type": "fort", "where": "Орта жүз", "lon": 71.43, "lat": 51.17, "text": "Есіл бойында Ақмола бекінісі салынды, 1832 ж. Ақмола округі ашылды. Бекініс қазақтардың шұрайлы жайлауларын тартып алды."}, {"from": 1831, "to": 1833, "name": "Аягөз және Баянауыл округтері", "type": "fort", "where": "Орта жүз", "lon": 80.43, "lat": 47.97, "text": "Аягөз (1831) және Баянауыл (1833) округтері ашылып, далада патша әкімшілігінің тірек бекеттері көбейді."}, {"from": 1832, "to": 1832, "name": "Хан ордасындағы жәрмеңке", "type": "event", "where": "Бөкей ордасы", "lon": 47.42, "lat": 48.72, "text": "Жәңгір хан ордасында жыл сайын өтетін жәрмеңке ашты; мал мен тауар саудасы өрбіді."}, {"from": 1833, "to": 1833, "name": "Қарағанды көмірінің табылуы", "type": "site", "where": "Орта жүз", "lon": 73.1, "lat": 49.8, "text": "Аңыз бойынша, малшы Аппақ Байжанов Қарағанды маңынан көмір тапты. Кейін мұнда кеніш ашылды."}, {"from": 1835, "to": 1837, "name": "Жаңа шеп (Орск–Троицк аралығы)", "type": "fort", "where": "Кіші жүз", "lon": 60.5, "lat": 52.8, "route": [[58.57, 51.2], [59.5, 51.9], [60.3, 52.9], [61.57, 54.08]], "text": "Орынбор шебінің шығысына жаңа бекіністер тізбегі салынып, Кіші жүз руларының қонысы тарылды. Бұл Кенесары мен Кіші жүздегі толқулардың себебінің бірі болды."}, {"from": 1836, "to": 1838, "name": "Исатай мен Махамбет көтерілісі", "type": "uprising", "where": "Бөкей ордасы", "lon": 48.5, "lat": 48.6, "text": "Жәңгір ханның жерді сұлтандар мен билерге үлестіріп, алым-салықты көбейтуіне қарсы Исатай Тайманұлы мен ақын Махамбет Өтемісұлы халықты көтерді. Көтеріліс Ақбұлақта жеңіліп, Исатай қаза тапты."}, {"from": 1837, "to": 1837, "name": "Хан ордасын қоршау", "type": "battle", "where": "Бөкей ордасы", "lon": 47.42, "lat": 48.72, "text": "1837 ж. қазанда көтерілісшілер Хан ордасын қоршады, бірақ Жәңгір шақырған жазалаушы отряд келгендіктен кері шегінді."}, {"from": 1837, "to": 1837, "name": "Тастөбе шайқасы", "type": "battle", "where": "Бөкей ордасы", "lon": 49.6, "lat": 49.0, "text": "1837 ж. қарашада Тастөбеде көтерілісшілер полковник Гекенің отрядынан жеңіліп, Исатай мен Махамбет Жайықтан өтіп Кіші жүзге кетті. Орны шамамен."}, {"from": 1838, "to": 1838, "name": "Ақбұлақ шайқасы", "type": "battle", "where": "Кіші жүз", "lon": 54.6, "lat": 49.1, "route": [[47.42, 48.72], [49.6, 49.0], [51.3, 48.6], [53.2, 48.9], [54.6, 49.1]], "text": "1838 ж. 12 шілдеде Ақбұлақ маңында Исатай жасағы Гекенің отрядымен шайқаста жеңіліп, Исатай қаза тапты. Орны шамамен."}, {"from": 1837, "to": 1847, "name": "Кенесары Қасымұлы көтерілісі", "type": "uprising", "where": "Орта жүз", "lon": 67.0, "lat": 48.65, "route": [[69.39, 53.28], [71.43, 51.17], [67.0, 48.65], [63.5, 49.63], [66, 46.5], [71, 45], [75.5, 44.2], [75.0, 42.8]], "text": "Абылайдың немересі Кенесары округтерді жоюды, тартып алынған жерді қайтаруды талап етіп, он жыл күресті. 1841 ж. хан сайланып, Қазақ хандығын қалпына келтірмек болды; 1847 ж. Кекілікте қаза тапты."}, {"from": 1838, "to": 1838, "name": "Ақмола бекінісінің өртелуі", "type": "battle", "where": "Орта жүз", "lon": 71.43, "lat": 51.17, "text": "1838 ж. мамырда Кенесары жасақтары Ақмола бекінісін қоршап, өртеді. Бұл көтерілістің кең ауқымға жайылғанын көрсетті."}, {"from": 1841, "to": 1841, "name": "Кенесарының хан сайлануы", "type": "event", "where": "Орта жүз", "lon": 67.0, "lat": 48.65, "text": "Ұлытау өңірінде үш жүздің өкілдері Кенесарыны ақ кигізге көтеріп хан сайлады. Ол хан кеңесін құрып, салық пен әскер ісін қайта ұйымдастырды."}, {"from": 1841, "to": 1841, "name": "Хан ордасындағы мектеп", "type": "event", "where": "Бөкей ордасы", "lon": 47.42, "lat": 48.72, "text": "Жәңгір хан ордасында орыс тілі, математика, география оқытылатын мектеп ашты. Қазақ даласындағы алғашқы зайырлы мектептердің бірі болды."}, {"from": 1844, "to": 1844, "name": "Жантөрин жасағының талқандалуы", "type": "battle", "where": "Кіші жүз", "lon": 62.5, "lat": 49.5, "text": "1844 ж. шілдеде Кенесары патша жағындағы Ахмет Жантөрин бастаған сұлтандар жасағын талқандады. Орны шамамен."}, {"from": 1845, "to": 1845, "name": "Торғай және Ырғыз бекіністері", "type": "fort", "where": "Кіші жүз", "lon": 63.5, "lat": 49.63, "text": "Кенесарыны қоршау үшін Торғай өзенінде Орынбор бекінісі (кейін Торғай қаласы), Ырғыз өзенінде Ұрал бекінісі (кейін Ырғыз) салынды. Кенесары оңтүстікке, кейін Жетісуға ығысты."}, {"from": 1845, "to": 1845, "name": "Бөкей ордасында хандықтың жойылуы", "type": "law", "where": "Бөкей ордасы", "lon": 47.42, "lat": 48.72, "text": "Жәңгір қайтыс болған соң патша үкіметі жаңа хан тағайындамады. Орданы Уақытша кеңес басқара бастады."}, {"from": 1846, "to": 1846, "name": "Махамбеттің өлтірілуі", "type": "event", "where": "Кіші жүз", "lon": 51.6, "lat": 47.6, "text": "Ақын әрі батыр Махамбет Өтемісұлы 1846 ж. қазанда Қараой деген жерде сұлтан Баймағамбет жіберген адамдардың қолынан қаза тапты. Орны шамамен."}, {"from": 1846, "to": 1846, "name": "Ұлы жүздің Ресей бодандығына өтуі", "type": "event", "where": "Ұлы жүз", "lon": 78.5, "lat": 45.0, "text": "Жетісудағы Ұлы жүз сұлтандары мен билері Ресей бодандығын қабылдады; 1848 ж. Ұлы жүз приставы тағайындалды."}, {"from": 1846, "to": 1846, "name": "Новопетровск бекінісі (Маңғыстау)", "type": "fort", "where": "Маңғыстау", "lon": 50.26, "lat": 44.51, "text": "Маңғыстау түбегінде бекініс салынды; кейін Форт-Александровск деп аталды."}, {"from": 1847, "to": 1847, "name": "Кенесарының қаза табуы", "type": "battle", "where": "Жетісу", "lon": 75.0, "lat": 42.8, "text": "Кенесары Іле мен Шу арасына ығысып, қырғыз манаптарымен соғысты. Кекілік-Сеңгір тауында қолға түсіп, өлтірілді. Орны шамамен."}, {"from": 1847, "to": 1847, "name": "Қапал бекінісі", "type": "fort", "where": "Жетісу", "lon": 79.06, "lat": 45.12, "text": "Жетісуда салынған алғашқы орыс бекінісі; Ұлы жүзге патша билігінің тірегі болды."}, {"from": 1847, "to": 1847, "name": "Райым бекінісі", "type": "fort", "where": "Сыр бойы", "lon": 61.73, "lat": 46.07, "text": "Сырдария сағасына жақын Райым бекінісі салынды; Сыр бойындағы Ресей шебінің басы болды."}, {"from": 1847, "to": 1858, "name": "Есет Көтібарұлы көтерілісі", "type": "uprising", "where": "Кіші жүз", "lon": 56.0, "lat": 46.5, "text": "Шекті руының батыры Есет алым-салыққа, Сырдария бойындағы бекіністер үшін жүргізілген күштеп жинауға қарсы шықты. 1858 ж. патша үкіметімен келісіп, қаруын тастады."}, {"from": 1853, "to": 1853, "name": "Ақмешіттің алынуы", "type": "battle", "where": "Сыр бойы", "lon": 65.51, "lat": 44.85, "text": "1853 ж. шілдеде В. Перовский әскері Қоқанның Ақмешіт бекінісін алып, оны Перовский форты деп атады. Сырдария шебі құрылды."}, {"from": 1853, "to": 1853, "name": "Қазалы (№1 форт)", "type": "fort", "where": "Сыр бойы", "lon": 62.1, "lat": 45.76, "text": "Сырдарияның төменгі ағысында №1 форт салынды; кейін Қазалы қаласы болды."}, {"from": 1854, "to": 1854, "name": "Верный бекінісі", "type": "fort", "where": "Жетісу", "lon": 76.95, "lat": 43.25, "text": "Алматы жұртында Іле сыртындағы бекініс (Верный) салынды; Жетісудағы Ресейдің басты тірегіне айналды."}, {"from": 1854, "to": 1854, "name": "Семей облысының құрылуы", "type": "law", "where": "Шығыс Қазақстан", "lon": 80.25, "lat": 50.41, "text": "Орта жүздің шығысы мен Жетісудың солтүстігін қамтыған Семей облысы құрылды."}, {"from": 1855, "to": 1855, "name": "Арыстан Жантөриннің өлтірілуі", "type": "battle", "where": "Кіші жүз", "lon": 56.5, "lat": 47.0, "text": "Есет жасағы патша жағындағы сұлтан Арыстан Жантөрин бастаған отрядты талқандады, сұлтан өлтірілді. Орны шамамен."}, {"from": 1856, "to": 1857, "name": "Жанқожа Нұрмұхамедұлы көтерілісі", "type": "uprising", "where": "Сыр бойы", "lon": 62.4, "lat": 45.6, "route": [[62.4, 45.6], [62.5, 44.0], [61.5, 42.5], [60.36, 41.38]], "text": "Сыр бойындағы бекіністердің жер тартып алуына және салыққа қарсы Жанқожа батыр шайқасты. 1856 ж. желтоқсанда Қазалы фортын қоршады, 1857 ж. қаңтарда Арықбалықта жеңіліп, Хиуа жеріне кетті."}, {"from": 1857, "to": 1857, "name": "Арықбалық шайқасы", "type": "battle", "where": "Сыр бойы", "lon": 62.4, "lat": 45.6, "text": "1857 ж. қаңтарда Жанқожа жасағы Арықбалық маңында генерал Фитингоф отрядынан жеңілді. Орны шамамен, Қазалы маңы."}, {"from": 1856, "to": 1857, "name": "Семеновтің Тянь-Шань саяхаты", "type": "migration", "where": "Жетісу", "lon": 80.17, "lat": 42.21, "route": [[83.77, 53.35], [80.25, 50.41], [79.06, 45.12], [76.95, 43.25], [77.3, 42.2], [80.17, 42.21]], "text": "П.П. Семенов Барнаулдан Семей, Қапал, Верный арқылы Тянь-Шаньға барып, Хан Тәңірі мен Іле Алатауын зерттеді. 1906 ж. «Тян-Шанский» құрметті тегі берілді."}, {"from": 1857, "to": 1857, "name": "Спасск мыс қорыту зауыты", "type": "event", "where": "Орта жүз", "lon": 73.2, "lat": 49.55, "text": "Қарағанды көмірін пайдаланатын Спасск мыс қорыту зауыты іске қосылды; өлкедегі алғашқы өнеркәсіп орындарының бірі."}, {"from": 1858, "to": 1859, "name": "Шоқанның Қашғар сапары", "type": "migration", "where": "Қашғария", "lon": 75.99, "lat": 39.47, "route": [[80.25, 50.41], [79.06, 45.12], [77.5, 42.7], [75.99, 39.47], [76.95, 43.25]], "text": "Шоқан Уәлиханов саудагер Әлімбай атымен Қашғарға барып, Алтышардың тарихы мен халқын зерттеді. Еңбегі Еуропада жарияланып, ғалымға атақ әкелді."}, {"from": 1859, "to": 1871, "name": "Радловтың Алтай мен Қазақ даласын зерттеуі", "type": "event", "where": "Шығыс Қазақстан", "lon": 83.77, "lat": 53.35, "text": "В.В. Радлов Барнаулда тұрып, түркі халықтарының ауыз әдебиетін жинады. 1870 ж. «Түркі тайпаларының халық әдебиеті үлгілерінің» қазақ әдебиетіне арналған томы шықты."}, {"from": 1860, "to": 1860, "name": "Ұзынағаш шайқасы", "type": "battle", "where": "Жетісу", "lon": 76.31, "lat": 43.22, "text": "1860 ж. қазанда Колпаковский отряды Ұзынағаш маңында Қоқан әскерін жеңді; Жетісудағы Қоқан билігі құлады. Ресей жағында қазақ жасақтары да шайқасты."}, {"from": 1860, "to": 1862, "name": "Тоқмақ пен Пішпектің алынуы", "type": "battle", "where": "Жетісу", "lon": 74.6, "lat": 42.87, "text": "Шу бойындағы Қоқан бекіністері Тоқмақ пен Пішпекті орыс әскері алып, қиратты."}, {"from": 1864, "to": 1864, "name": "Әулиеатаның алынуы", "type": "battle", "where": "Оңтүстік", "lon": 71.37, "lat": 42.9, "route": [[79.06, 45.12], [76.95, 43.25], [71.37, 42.9]], "text": "1864 ж. маусымда Черняев отряды Әулиеатаны алды."}, {"from": 1864, "to": 1864, "name": "Түркістанның алынуы", "type": "battle", "where": "Оңтүстік", "lon": 68.27, "lat": 43.3, "route": [[65.51, 44.85], [68.27, 43.3]], "text": "1864 ж. маусымда Веревкин отряды Сырдария шебінен шығып, Түркістанды алды."}, {"from": 1864, "to": 1864, "name": "Шымкенттің алынуы", "type": "battle", "where": "Оңтүстік", "lon": 69.6, "lat": 42.32, "text": "1864 ж. қыркүйекте Черняев Шымкентті алды; Сібір мен Сырдария шептері тұйықталды."}, {"from": 1864, "to": 1864, "name": "Шәуешек хаттамасы", "type": "law", "where": "Шығыс Қазақстан", "lon": 82.98, "lat": 46.74, "text": "Ресей мен Цин батыс шекараны белгіледі; қазақтардың біраз жері мен халқы екі мемлекетке бөлінді."}, {"from": 1865, "to": 1865, "name": "Ташкенттің алынуы", "type": "battle", "where": "Оңтүстік", "lon": 69.24, "lat": 41.3, "route": [[69.6, 42.32], [69.24, 41.3]], "text": "1865 ж. маусымда Черняев Ташкентті алды; Оңтүстік Қазақстанды жаулап алу аяқталды. Сол жылы Түркістан облысы құрылды."}, {"from": 1865, "to": 1865, "name": "Шоқанның қайтыс болуы", "type": "site", "where": "Жетісу", "lon": 78.25, "lat": 44.25, "text": "Шоқан Уәлиханов Алтынемел тауының бөктеріндегі Көшентоған деген жерде 30 жасында қайтыс болып, сонда жерленді."}, {"from": 1864, "to": 1864, "name": "Торғайдағы алғашқы мектеп", "type": "event", "where": "Торғай", "lon": 63.5, "lat": 49.63, "text": "Ыбырай Алтынсарин Торғайда қазақ балаларына арналған мектеп ашып, мұғалім болды."}, {"from": 1867, "to": 1867, "name": "Түркістан генерал-губернаторлығының құрылуы", "type": "law", "where": "Оңтүстік", "lon": 69.24, "lat": 41.3, "text": "«Жетісу және Сырдария облыстарын басқару туралы ереже» бойынша Түркістан генерал-губернаторлығы құрылды; орталығы — Ташкент, Жетісу облысының орталығы — Верный."}, {"from": 1868, "to": 1868, "name": "Дала облыстарын басқару туралы Уақытша ереже", "type": "law", "where": "Қазақ облыстары", "lon": 55.1, "lat": 51.77, "text": "Орал, Торғай, Ақмола, Семей облыстары құрылды; уез, болыс, ауыл енгізілді. Жер мемлекет меншігі деп жарияланды, билер соты халық сотымен ауыстырылды, түтін салығы өсті."}, {"from": 1868, "to": 1868, "name": "Бұхара әмірлігінің Ресей протектораты болуы", "type": "event", "where": "Бұхара", "lon": 66.97, "lat": 39.65, "text": "Ресей Самарқанды алып, Бұхара әмірлігін тәуелді етті."}, {"from": 1868, "to": 1869, "name": "Орал облысындағы көтеріліс", "type": "uprising", "where": "Орал облысы", "lon": 53.0, "lat": 49.0, "text": "Уақытша ережеге қарсы Орал облысының қазақтары көтерілді; 1869 ж. шілдеде Уіл бойындағы Жаман-Сай маңында шешуші шайқас болды. Көтерілісті әскер басып, қатысушылар жер аударылды."}, {"from": 1868, "to": 1869, "name": "Торғай облысындағы көтеріліс", "type": "uprising", "where": "Торғай", "lon": 62.0, "lat": 49.0, "text": "Торғай облысының қазақтары жаңа салық пен болыстық басқаруға қарсы шықты. Көтеріліс 1869 ж. басылды."}, {"from": 1869, "to": 1869, "name": "Ақтөбе бекінісі", "type": "fort", "where": "Орал–Торғай", "lon": 57.17, "lat": 50.28, "text": "Елек бойында Ақтөбе бекінісі салынды; кейін қалаға айналды."}, {"from": 1870, "to": 1870, "name": "Маңғыстау көтерілісі", "type": "uprising", "where": "Маңғыстау", "lon": 51.5, "lat": 44.0, "text": "Адай руының қазақтары Иса Тіленбайұлы мен Досан Тәжіұлының бастауымен салық пен жаңа басқаруға қарсы көтеріліп, Форт-Александровскіні қоршады. Көтеріліс басылып, көп адам Хиуа мен Түрікменияға көшті."}, {"from": 1871, "to": 1881, "name": "Іле өлкесін Ресейдің басып алуы", "type": "event", "where": "Жетісу", "lon": 81.32, "lat": 43.92, "text": "Шыңжаңдағы көтерілістерді сылтау етіп, Ресей Құлжа өңірін уақытша басып алды. 1881 ж. Петербург шартымен Цинге қайтарылды."}, {"from": 1873, "to": 1873, "name": "Хиуа жорығы", "type": "battle", "where": "Хиуа", "lon": 60.36, "lat": 41.38, "text": "Ресей әскері Хиуаны алып, хандық протекторатқа айналды; Әмударияның оң жағалауы Түркістан генерал-губернаторлығына қосылды."}, {"from": 1876, "to": 1876, "name": "Қоқан хандығының жойылуы", "type": "event", "where": "Қоқан", "lon": 70.94, "lat": 40.53, "text": "Қоқандағы көтерілістен кейін хандық жойылып, жері Ферғана облысы болды."}, {"from": 1879, "to": 1879, "name": "Алтынсариннің «Қазақ хрестоматиясы»", "type": "event", "where": "Торғай", "lon": 55.1, "lat": 51.77, "text": "Ыбырай Алтынсарин Торғай облысы мектептерінің инспекторы болды; Орынборда «Қазақ хрестоматиясын» шығарды."}, {"from": 1879, "to": 1879, "name": "Николаевск (Қостанай) қаласы", "type": "city", "where": "Торғай", "lon": 63.63, "lat": 53.22, "text": "Тобыл бойында қоныс аударушылар қаласы салынды; кейін Қостанай атанды."}, {"from": 1881, "to": 1884, "name": "Ұйғырлар мен дүнгендердің Жетісуға көшуі", "type": "migration", "where": "Жетісу", "lon": 80.0, "lat": 44.17, "route": [[81.32, 43.92], [80.6, 44.1], [80.0, 44.17]], "text": "Петербург шартынан кейін Іле өлкесінен ұйғыр мен дүнгендердің бір бөлігі Жетісуға көшті; Жаркент маңына қоныстанды."}, {"from": 1882, "to": 1882, "name": "Дала генерал-губернаторлығының құрылуы", "type": "law", "where": "Дала өлкесі", "lon": 73.37, "lat": 54.98, "text": "Ақмола, Семей және Жетісу облыстарын біріктірген Дала генерал-губернаторлығы құрылды; 1899 ж. Жетісу қайтадан Түркістанға берілді."}, {"from": 1883, "to": 1883, "name": "Орскідегі қазақ мұғалімдер мектебі", "type": "event", "where": "Торғай", "lon": 58.57, "lat": 51.2, "text": "Алтынсариннің бастамасымен Орскіде қазақ мұғалімдер мектебі ашылды."}, {"from": 1884, "to": 1884, "name": "Жәдиттік мектептердің шығуы", "type": "event", "where": "Қазақ облыстары", "lon": 55.1, "lat": 51.77, "text": "Ысмайыл Гаспыралы Бақшасарайда дыбыс әдісімен оқытатын алғашқы жаңа әдісті мектеп ашты. Бұл үлгі кейін Орынбор (Хұсайния), Троицк, Уфа (Ғалия, 1906) медреселері арқылы қазақ даласына тарады."}, {"from": 1886, "to": 1886, "name": "Түркістан өлкесін басқару туралы ереже", "type": "law", "where": "Оңтүстік", "lon": 69.24, "lat": 41.3, "text": "Сырдария мен Жетісуда жерді мемлекет меншігі деп бекітті; «артық» жерлерді қоныс аударушыларға беруге жол ашты."}, {"from": 1887, "to": 1887, "name": "Ырғыздағы қыздар мектебі", "type": "event", "where": "Торғай", "lon": 61.27, "lat": 48.62, "text": "Алтынсарин Ырғызда қазақ қыздарына арналған интернаты бар мектеп ашты. Ыбырай 1889 ж. қайтыс болды."}, {"from": 1887, "to": 1887, "name": "Верныйдағы жер сілкінісі", "type": "event", "where": "Жетісу", "lon": 76.95, "lat": 43.25, "text": "1887 ж. мамырда күшті жер сілкінісі Верныйдың көп үйін қиратты; қала қайта салынды."}, {"from": 1889, "to": 1889, "name": "Қоныс аудару туралы заң", "type": "law", "where": "Қазақ облыстары", "lon": 69.15, "lat": 54.87, "route": [[61.4, 55.16], [69.15, 54.87], [69.39, 53.28], [71.43, 51.17]], "text": "Ішкі губерниялардан шаруалардың қазақ облыстарына қоныс аударуын реттеді. Солтүстік облыстарға шаруалар ағыны күшейді."}, {"from": 1890, "to": 1898, "name": "Абайдың қара сөздері", "type": "event", "where": "Семей облысы", "lon": 79.3, "lat": 49.0, "text": "Абай Құнанбайұлы қара сөздерінің негізгі бөлігін жазды: білім, еңбек, адамгершілік, ел басқарудағы әділдік туралы ойларын айтты."}, {"from": 1891, "to": 1891, "name": "Дала облыстарын басқару туралы ереже", "type": "law", "where": "Дала өлкесі", "lon": 73.37, "lat": 54.98, "text": "Ақмола, Семей, Жетісу, Орал, Торғай облыстарына ортақ ереже; көшпелілерге қажеттен «артық» жерді қоныс аудару қорына алуға рұқсат берді."}, {"from": 1896, "to": 1896, "name": "Сібір теміржолы Петропавл арқылы", "type": "event", "where": "Солтүстік", "lon": 69.15, "lat": 54.87, "route": [[61.4, 55.16], [65.34, 55.44], [69.15, 54.87], [73.37, 54.98]], "text": "Сібір теміржолы Петропавл арқылы өтіп, солтүстік облыстардың астығы мен малы Ресей нарығына шықты."}, {"from": 1896, "to": 1903, "name": "Щербина экспедициясы", "type": "event", "where": "Дала өлкесі", "lon": 73.37, "lat": 54.98, "text": "Ф. Щербина бастаған экспедиция Ақмола, Семей, Торғай облыстарындағы қазақ шаруашылығын зерттеп, «артық» жерді анықтады; деректері қоныс аудару қорын құруға пайдаланылды."}, {"from": 1899, "to": 1899, "name": "Қарашұңғыл мұнайы", "type": "site", "where": "Ембі", "lon": 53.0, "lat": 47.4, "text": "Ембі өңіріндегі Қарашұңғылда алғаш мұнай фонтаны атқылады. Орны шамамен."}, {"from": 1901, "to": 1906, "name": "Орынбор–Ташкент теміржолы", "type": "event", "where": "Батыс және Оңтүстік", "lon": 62.1, "lat": 45.76, "route": [[55.1, 51.77], [57.17, 50.28], [59.62, 47.83], [61.67, 46.8], [62.1, 45.76], [65.51, 44.85], [68.27, 43.3], [69.24, 41.3]], "text": "Ақтөбе, Қазалы, Перовск, Түркістан арқылы өткен жол 1906 ж. ашылды. Орта Азия мен Ресей арасындағы сауда өсіп, бекеттер маңында қалалар көбейді."}, {"from": 1904, "to": 1904, "name": "Абайдың қайтыс болуы", "type": "site", "where": "Семей облысы", "lon": 79.32, "lat": 49.13, "text": "Абай Шыңғыстау өңірінде қайтыс болып, Жидебайда жерленді. 1909 ж. Петербургте өлеңдерінің алғашқы жинағы басылды."}, {"from": 1905, "to": 1905, "name": "Қарқаралы петициясы", "type": "event", "where": "Семей облысы", "lon": 75.67, "lat": 49.87, "text": "Қоянды жәрмеңкесінде 14 мыңнан астам адам қол қойған петиция патшаға жолданды: қоныс аударуды тоқтату, жерді қазақтарға бекіту, қазақ тілінде мектеп, баспасөз, діни еркіндік, Думаға өкіл сайлау талап етілді."}, {"from": 1905, "to": 1905, "name": "Теміржолшылар ереуілі", "type":
