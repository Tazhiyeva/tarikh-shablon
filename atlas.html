"event", "where": "Сыр бойы", "lon": 65.51, "lat": 44.85, "text": "1905 ж. революция кезінде Перовск пен Қазалы бекеттерінің теміржолшылары ереуілге шықты."}, {"from": 1905, "to": 1905, "name": "Оралдағы бес облыс съезі", "type": "event", "where": "Орал облысы", "lon": 51.37, "lat": 51.23, "text": "1905 ж. желтоқсанда Оралда бес облыстың қазақ өкілдері жиналып, жер, сот, оқу мәселелерін талқылады; кадеттер партиясына жақын тұрды."}, {"from": 1906, "to": 1906, "name": "I Мемлекеттік Дума", "type": "event", "where": "Қазақ облыстары", "lon": 80.25, "lat": 50.41, "text": "Думаға Ә. Бөкейхан (Семей), А. Бірімжанов (Торғай), А. Қалменов (Орал), Ш. Қосшығұлов (Ақмола) т.б. сайланды. Дума таратылған соң Бөкейхан Выборг үндеуіне қол қойып, түрмеге жабылды."}, {"from": 1906, "to": 1912, "name": "Столыпин аграрлық реформасы", "type": "migration", "where": "Қазақ облыстары", "lon": 71.43, "lat": 51.17, "route": [[73.37, 54.98], [80.25, 50.41], [76.95, 43.25]], "text": "Қоныс аудару күшейіп, қазақтардың ең жақсы жерлері қоныс аудару қорына алынды. Солтүстік облыстарда, Жетісуда қазақтар шөл-шөлейтке ығыстырылды."}, {"from": 1907, "to": 1907, "name": "II Мемлекеттік Дума", "type": "event", "where": "Қазақ облыстары", "lon": 51.37, "lat": 51.23, "text": "Думаға Б. Қаратаев (Орал), М. Тынышбаев (Жетісу), Б. Құлманов (Бөкей ордасы) т.б. сайланды; олар жер мәселесін көтерді."}, {"from": 1907, "to": 1907, "name": "3 маусымдағы сайлау заңы", "type": "law", "where": "Қазақ облыстары", "lon": 66.9, "lat": 48.0, "text": "II Дума таратылып, жаңа заң бойынша Қазақстан мен Орта Азия халықтары Думаға сайлау құқығынан айырылды."}, {"from": 1909, "to": 1909, "name": "«Оян, қазақ!»", "type": "event", "where": "Қазақ облыстары", "lon": 55.97, "lat": 54.73, "text": "Міржақып Дулатұлының «Оян, қазақ!» кітабы Уфада басылды; патша үкіметі тыйым салып, авторы қуғындалды."}, {"from": 1911, "to": 1911, "name": "«Айқап» журналы", "type": "event", "where": "Торғай облысы", "lon": 61.57, "lat": 54.08, "text": "Мұхамеджан Сералин Троицкіде «Айқап» журналын шығарды; отырықшылыққа көшу, оқу-ағарту, әйел теңдігі мәселелерін жазды. 1915 ж. жабылды."}, {"from": 1911, "to": 1911, "name": "Доссор мұнай кен орны", "type": "site", "where": "Ембі", "lon": 52.98, "lat": 47.53, "text": "Доссордан өнеркәсіптік мұнай алынды; Ембі мұнай ауданы шетел капиталының қатысуымен игерілді."}, {"from": 1912, "to": 1912, "name": "Байтұрсынұлының «Оқу құралы»", "type": "event", "where": "Қазақ облыстары", "lon": 55.1, "lat": 51.77, "text": "А. Байтұрсынұлы араб жазуын қазақ дыбыстарына бейімдеген әліппе шығарды."}, {"from": 1913, "to": 1913, "name": "«Қазақ» газеті", "type": "event", "where": "Қазақ облыстары", "lon": 55.1, "lat": 51.77, "text": "1913 ж. 2 ақпанда Орынборда А. Байтұрсынұлы, М. Дулатұлы, Ә. Бөкейханның «Қазақ» газеті шықты; жер, оқу, тіл мәселесін көтеріп, ұлттық ойды біріктірді."}, {"from": 1914, "to": 1914, "name": "Бірінші дүниежүзілік соғыс", "type": "event", "where": "Қазақ облыстары", "lon": 66.9, "lat": 48.0, "text": "Соғыс салдарынан мал, астық, киіз реквизицияланып, салық 3–4 есе өсті; бағалар шарықтап, халық күйзелді."}, {"from": 1915, "to": 1915, "name": "Алтай теміржолы Семейге жетті", "type": "event", "where": "Семей облысы", "lon": 80.25, "lat": 50.41, "route": [[82.9, 55.0], [83.77, 53.35], [81.2, 51.5], [80.25, 50.41]], "text": "Новониколаевск–Семей теміржолы ашылып, Ертіс бойы Сібір жолымен жалғасты."}, {"from": 1916, "to": 1916, "name": "25 маусымдағы жарлық", "type": "law", "where": "Қазақ облыстары", "lon": 66.9, "lat": 48.0, "text": "Николай II 19–43 жас аралығындағы «бұратана» ер адамдарды майдандағы тыл жұмысына алу туралы жарлыққа қол қойды. Ол егін мен шөп науқанында жарияланып, жалпы көтеріліске ұласты."}, {"from": 1916, "to": 1916, "name": "Жетісудағы көтеріліс", "type": "uprising", "where": "Жетісу", "lon": 76.5, "lat": 43.5, "text": "Шілде–тамызда Жетісуда көтеріліс өршіді; Бекболат Әшекеев, Ұзақ Саурықов, Жәмеңке Мәмбетов, Тоқаш Бокин т.б. басқарды. Көтерілісті жазалаушы отрядтар қатыгездікпен басты."}, {"from": 1916, "to": 1916, "name": "Самсы, Қастек, Ұзынағаш шайқастары", "type": "battle", "where": "Жетісу", "lon": 76.1, "lat": 43.31, "text": "Бекболат Әшекеев бастаған көтерілісшілер Самсы, Қастек, Ұзынағаш маңында жазалаушы әскермен шайқасты. Орны шамамен."}, {"from": 1916, "to": 1916, "name": "Қарқарадағы шайқас", "type": "battle", "where": "Жетісу", "lon": 79.2, "lat": 42.85, "text": "Қарқара жәрмеңкесі маңында Ұзақ Саурықов пен Жәмеңке Мәмбетов бастаған албан көтерілісшілері патша әскерімен соқтығысты. Орны шамамен."}, {"from": 1916, "to": 1916, "name": "Үркін", "type": "migration", "where": "Жетісу", "lon": 81.32, "lat": 43.92, "route": [[76.5, 43.5], [78.5, 43.1], [80.2, 43.4], [81.32, 43.92]], "text": "Көтеріліс басылған соң жазалаудан қашқан мыңдаған қазақ пен қырғыз Шыңжаңға көшті; жолда көп адам қырылды."}, {"from": 1916, "to": 1917, "name": "Торғайдағы көтеріліс", "type": "uprising", "where": "Торғай", "lon": 63.5, "lat": 49.63, "text": "Әбдіғаппар Жанбосынов хан, Аманкелді Иманов сардарбек болып сайланып, 20 мыңдай сарбаз жиналды. Қазан–қарашада Торғай қаласын қоршады; көтерілісшілер 1917 ж. ақпанға дейін шайқасты."}, {"from": 1917, "to": 1917, "name": "Ақшығанақ шайқасы", "type": "battle", "where": "Торғай", "lon": 63.8, "lat": 49.2, "text": "1917 ж. ақпанда Аманкелді жасағы Ақшығанақ маңында жазалаушы отрядпен шайқасты. Ақпан төңкерісінен кейін жазалау тоқтады. Орны шамамен."}, {"from": 1917, "to": 1917, "name": "Ақпан төңкерісі", "type": "event", "where": "Ресей", "lon": 30.32, "lat": 59.94, "text": "27 ақпанда Петроградта көтеріліс жеңіп, 2 наурызда Николай II тақтан бас тартты. Елде Уақытша үкімет пен Кеңестер қатар билеген қосөкімет орнады."}, {"from": 1917, "to": 1917, "name": "Бөкейхан — Торғай облысының комиссары", "type": "event", "where": "Торғай облысы", "lon": 55.1, "lat": 51.77, "text": "Наурызда Уақытша үкімет Ә. Бөкейханды Торғай облысының комиссары етіп тағайындады; Алаш зиялылары жергілікті комитеттерге кіріп, автономияға жол ашуды көздеді."}, {"from": 1917, "to": 1917, "name": "Кеңестердің құрылуы", "type": "event", "where": "Қазақ даласы", "lon": 65.51, "lat": 44.85, "text": "1917 жылдың наурызынан Перовск, Верный, Петропавл, Орал т.б. қалаларда жұмысшы және солдат депутаттарының кеңестері құрылды."}, {"from": 1917, "to": 1917, "name": "«Алаш» партиясы бағдарламасы", "type": "law", "where": "Қазақ даласы", "lon": 55.1, "lat": 51.77, "text": "21 қарашада «Қазақ» газетінде бағдарлама жобасы жарияланды: 10 бөлім — мемлекет құрылысы, жер, дін, оқу-ағарту т.б., Ресей федерациясы құрамындағы қазақ автономиясы."}, {"from": 1917, "to": 1917, "name": "«Үш жүз» партиясы", "type": "event", "where": "Ақмола облысы", "lon": 73.37, "lat": 54.98, "text": "1917 жылдың қарашасында Омбыда К. Тоғысов бастаған «Үш жүз» партиясы құрылды; Алашқа қарсы шығып, кейін большевиктерге жақындады."}, {"from": 1917, "to": 1917, "name": "Ташкентте Кеңес өкіметі", "type": "event", "where": "Түркістан", "lon": 69.24, "lat": 41.3, "text": "1917 жылы 28 қазан – 1 қараша аралығындағы шайқастан кейін Ташкент Кеңесі билікті алды; жергілікті мұсылмандар билікке жіберілмеді."}, {"from": 1917, "to": 1917, "name": "Түркістан (Қоқан) автономиясы жарияланды", "type": "event", "where": "Түркістан", "lon": 70.94, "lat": 40.53, "text": "27 қарашада Қоқанда өткен IV төтенше өлкелік мұсылман съезі Ресей құрамындағы Түркістан автономиясын жариялады; үкіметті М. Тынышбаев, кейін М. Шоқай басқарды."}, {"from": 1918, "to": 1918, "name": "Қоқан автономиясының таратылуы", "type": "battle", "where": "Түркістан", "lon": 70.94, "lat": 40.53, "route": [[69.24, 41.3], [70.0, 40.9], [70.94, 40.53]], "text": "1918 жылы ақпанда Ташкенттен келген Қызыл Армия мен армян дашнактары Қоқанды алып, автономияны қанға батырды; мыңдаған бейбіт тұрғын қырылды."}, {"from": 1918, "to": 1918, "name": "Верныйда Кеңес өкіметі орнады", "type": "event", "where": "Жетісу облысы", "lon": 76.95, "lat": 43.25, "text": "1918 жылы 3 наурызда Верныйда Кеңес өкіметі орнады — Қазақстан қалаларының ішіндегі ең кешінің бірі."}, {"from": 1918, "to": 1918, "name": "Түркістан АКСР-і жарияланды", "type": "law", "where": "Түркістан", "lon": 69.24, "lat": 41.3, "text": "1918 жылы сәуірде Ташкентте Кеңестердің V өлкелік съезі РКФСР құрамындағы Түркістан АКСР-ін жариялады; Сырдария мен Жетісу қазақтары осы республикада қалды."}, {"from": 1918, "to": 1918, "name": "Алашорданың Батыс бөлімшесі", "type": "event", "where": "Орал облысы", "lon": 52.58, "lat": 50.25, "text": "1918 жылы Орал облысы қазақтарының съезі Ойыл уәлаятын жариялады; Жымпитыда Ж. және Х. Досмұхамедовтар бастаған Алашорданың Батыс бөлімшесі құрылды."}, {"from": 1918, "to": 1918, "name": "Семей — Алашорда орталығы", "type": "city", "where": "Семей облысы", "lon": 80.25, "lat": 50.41, "text": "1918 жылдың жазында Алашорда Семейге орналасты, Ертістің сол жағасы «Алаш қаласы» аталды. Алаш милициясы жасақталды."}, {"from": 1918, "to": 1919, "name": "Орынбор мен Ақтөбе майданы", "type": "battle", "where": "Торғай облысы", "lon": 57.17, "lat": 50.28, "text": "Атаман Дутовтың казактары мен қызылдар Орынбор үшін соғысты; 1918–1919 жылдары Ақтөбе майданы Түркістанды Орталық Ресейден бөліп тұрды."}, {"from": 1918, "to": 1919, "name": "Черкасск қорғанысы", "type": "battle", "where": "Жетісу облысы", "lon": 80.37, "lat": 45.67, "text": "Жетісудың солтүстігіндегі орыс қоныстары 1918–1919 жылдары ақтарға қарсы бір жылдан астам қоршауда қорғанды."}, {"from": 1918, "to": 1919, "name": "Аманкелді Иманов Торғайда", "type": "battle", "where": "Торғай облысы", "lon": 63.5, "lat": 49.63, "text": "1916 жылғы көтеріліс басшысы А. Иманов Кеңес өкіметі жағында Торғай уезінің әскери комиссары болды; 1919 жылы сәуірде Торғайда алашордашылар тұтқындап, өлтірді (кей деректе 18 мамырда атылған)."}, {"from": 1919, "to": 1919, "name": "Орал қоршауы, Чапаевтың қазасы", "type": "battle", "where": "Орал облысы", "lon": 51.17, "lat": 50.2, "text": "1919 жылы көктем–жазда Орал казактары Орал қаласын қоршады; 5 қыркүйекте Лбищенскіде (қазіргі Чапаев) В. Чапаевтың штабы талқандалды."}, {"from": 1919, "to": 1920, "name": "Азық-түлік салғырты", "type": "law", "where": "Қазақ даласы", "lon": 63.62, "lat": 53.21, "text": "«Әскери коммунизм» кезінде шаруалардың астығы мен малы күшпен алынды; Қостанай мен Ақмола уездерінде наразылық туды."}, {"from": 1919, "to": 1919, "name": "Қазревком құрылды", "type": "law", "where": "Қазақ даласы", "lon": 55.1, "lat": 51.77, "text": "1919 жылы 10 шілдеде Қырғыз (Қазақ) өлкесін басқаратын әскери-революциялық комитет құрылды, төрағасы — С. Пестковский, мүшесі — А. Байтұрсынұлы. Орталығы — Орынбор."}, {"from": 1920, "to": 1920, "name": "Алашорданың таратылуы", "type": "law", "where": "Семей облысы", "lon": 80.25, "lat": 50.41, "text": "1920 жылы 5 наурызда Қазревком шешімімен Алашорда таратылды; оның мүшелеріне кешірім жарияланды, бірақ кейін көбі қуғынға ұшырады."}, {"from": 1920, "to": 1920, "name": "Қырғыз АКСР-ін құру туралы декрет", "type": "law", "where": "Қазақ даласы", "lon": 37.62, "lat": 55.75, "text": "1920 жылы 26 тамызда Ленин мен Калинин РКФСР құрамында Қырғыз (Қазақ) АКСР-ін құру туралы декретке қол қойды. Құрамына Семей, Ақмола, Торғай, Орал облыстары, Маңғыстау, Бөкей ордасы т.б. кірді."}, {"from": 1920, "to": 1920, "name": "Кеңестердің құрылтай съезі", "type": "event", "where": "Қазақ даласы", "lon": 55.1, "lat": 51.77, "text": "1920 жылы 4–12 қазанда Орынборда Кеңестердің құрылтай съезі республиканы жариялады; Ә. Ермеков Сырдария мен Жетісуды қосу туралы баяндама жасады."}, {"from": 1921, "to": 1922, "name": "1921–1922 жылғы ашаршылық", "type": "event", "where": "Қазақ даласы", "lon": 57.17, "lat": 50.28, "text": "Азамат соғысы, салғырт пен құрғақшылық салдарынан Ақтөбе, Орал, Қостанай, Бөкей губернияларында ашаршылық болып, жүз мыңдаған адам қаза тапты."}, {"from": 1921, "to": 1921, "name": "ЖЭС-ке көшу", "type": "law", "where": "Қазақ даласы", "lon": 75.67, "lat": 49.87, "text": "1921 жылы наурызда РКП(б) X съезі салғыртты азық-түлік салығымен ауыстырды; сауда, Қоянды, Ойыл, Темір жәрмеңкелері қайта жанданды."}, {"from": 1921, "to": 1922, "name": "Жетісудағы жер-су реформасы", "type": "law", "where": "Жетісу", "lon": 76.95, "lat": 43.25, "text": "Патша кезінде тартып алынған жерлердің бір бөлігі қазақтарға қайтарылып, кулак шаруашылықтары кесілді; 1916 жылы Қытайға ауғандар қайта оралды."}, {"from": 1922, "to": 1922, "name": "КСРО құрылды", "type": "law", "where": "Ресей", "lon": 37.62, "lat": 55.75, "text": "1922 жылы 30 желтоқсанда КСРО құрылды; Қырғыз АКСР-і РКФСР құрамында қалды."}, {"from": 1924, "to": 1924, "name": "Ұлттық-аумақтық межелеу", "type": "law", "where": "Түркістан", "lon": 69.24, "lat": 41.3, "text": "1924 жылы Орта Азия республикалары ұлттық белгі бойынша бөлінді; Сырдария мен Жетісу облыстарының қазақ аудандары Қазақ АКСР-іне қосылды, Түркістан АКСР-і жойылды."}, {"from": 1925, "to": 1925, "name": "Қазақ АКСР-і, астана Қызылордаға көшті", "type": "law", "where": "Қазақ даласы", "lon": 65.51, "lat": 44.85, "text": "1925 жылы сәуірде Кеңестердің V съезі республиканы Қазақ АКСР-і деп атады; Орынбор РКФСР-ге берілді, Ақмешіт Қызылорда болып астанаға айналды."}, {"from": 1925, "to": 1925, "name": "«Кіші Қазан» идеясы", "type": "event", "where": "Қазақ даласы", "lon": 65.51, "lat": 44.85, "text": "1925 жылы желтоқсанда өлкелік партия конференциясында Ф. Голощекин ауылда «Кіші Қазан» жасау қажет деп, ұлт зиялылары мен байларға қарсы бағыт ұстады."}, {"from": 1926, "to": 1926, "name": "Сәтбаев Жезқазғанда", "type": "site", "where": "Ұлытау", "lon": 67.71, "lat": 47.8, "text": "1926 жылдан Қ. Сәтбаев Жезқазғанның мыс кен орындарын зерттеп, оның әлемдік маңызы бар қор екенін дәлелдеді."}, {"from": 1926, "to": 1927, "name": "Шабындық пен егістік жерді қайта бөлу", "type": "law", "where": "Қазақ даласы", "lon": 65.51, "lat": 44.85, "text": "Жерді байлардан кедейлерге бөлу науқаны жүргізілді; «Кіші Қазан» саясатының алғашқы қадамы болды."}, {"from": 1927, "to": 1930, "name": "Түрксіб салынды", "type": "city", "where": "Шығыс Қазақстан, Жетісу", "lon": 79.1, "lat": 46.3, "route": [[80.25, 50.41], [80.3, 49.2], [80.43, 47.96], [79.67, 46.95], [79.1, 46.3], [78.72, 45.89], [78.0, 45.25], [77.9, 44.35], [76.95, 43.24], [75.0, 43.1], [73.6, 43.0], [72.75, 42.92]], "text": "1927 жылы басталған Түркістан–Сібір темір жолының солтүстік және оңтүстік тармақтары 1930 жылы 28 сәуірде Айнабұлақта қосылды. Құрылысқа мыңдаған қазақ жұмысшы тартылды."}, {"from": 1928, "to": 1928, "name": "Байлардың малын тәркілеу", "type": "law", "where": "Қазақ даласы", "lon": 65.51, "lat": 44.85, "text": "1928 жылы 27 тамыздағы декрет бойынша 700-ге жуық ірі бай шаруашылығы мал-мүлкінен айырылып, жер аударылды."}, {"from": 1928, "to": 1928, "name": "Алматыда алғашқы университет", "type": "event", "where": "Жетісу", "lon": 76.95, "lat": 43.24, "text": "1928 жылы Алматыда Қазақ мемлекеттік университеті (кейін Абай атындағы ҚазПИ) ашылды — республикадағы алғашқы жоғары оқу орны."}, {"from": 1929, "to": 1929, "name": "Астана Алматыға көшті", "type": "city", "where": "Жетісу", "lon": 76.95, "lat": 43.24, "text": "Түрксіб құрылысымен байланысты астана Қызылордадан Алматыға (Алма-Атаға) көшірілді."}, {"from": 1929, "to": 1929, "name": "Латын әліпбиіне көшу", "type": "law", "where": "Қазақ даласы", "lon": 76.95, "lat": 43.24, "text": "Араб графикасындағы жазу латын әліпбиімен ауыстырылды; сауатсыздықты жою науқаны кең жүрді."}, {"from": 1929, "to": 1933, "name": "Күштеп ұжымдастыру және отырықшыландыру", "type": "law", "where": "Қазақ даласы", "lon": 65.51, "lat": 44.85, "text": "1929 жылдан ауыл шаруашылығын жаппай колхоздастыру, көшпелілерді күштеп отырықшыландыру басталды; мал ортақтандырылып, жаппай қырылды."}, {"from": 1930, "to": 1930, "name": "Созақ көтерілісі", "type": "uprising", "where": "Сыр бойы", "lon": 68.47, "lat": 44.13, "text": "1930 жылы ақпанда ұжымдастыру мен салыққа қарсы Созақта көтеріліс болды; ол әскермен басылып, көп адам атылды."}, {"from": 1930, "to": 1930, "name": "Ырғыз көтерілісі", "type": "uprising", "where": "Ақтөбе округі", "lon": 61.26, "lat": 48.62, "text": "1930 жылы Ырғыз ауданында шаруалар күштеп ұжымдастыруға қарсы шықты; ОГПУ бөлімдері көтерілісті басты."}, {"from": 1931, "to": 1931, "name": "Адай көтерілісі", "type": "uprising", "where": "Маңғыстау", "lon": 52.5, "lat": 44.0, "text": "1931 жылы Маңғыстау мен Үстірттегі адайлар мал дайындау мен ұжымдастыруға қарсы көтерілді; көтеріліс қарумен басылды."}, {"from": 1931, "to": 1933, "name": "1931–1933 жылғы ашаршылық", "type": "event", "where": "Қазақ даласы", "lon": 73.1, "lat": 49.81, "text": "Малдың тәркіленуі мен ет дайындаудан ауыл аштыққа ұрынды; 1,5 миллионнан астам қазақ (кейбір есептерде 2 миллионға жуық) қаза тапты, жүз мыңдаған адам көшіп кетті.", "note": "Сандар зерттеушілер арасында әртүрлі"}, {"from": 1931, "to": 1933, "name": "Босқындар Қытайға көшті", "type": "migration", "where": "Жетісу", "lon": 79.5, "lat": 45.5, "route": [[76.95, 46.5], [79.5, 45.5], [81.5, 45.0], [84.0, 44.5], [87.5, 44.0]], "text": "Ашаршылықтан қашқан қазақтар Шығыс Түркістанға, Өзбекстан мен Түрікменстанға, Сібір мен Еділ бойына босып кетті."}, {"from": 1931, "to": 1933, "name": "Босқындар Өзбекстанға көшті", "type": "migration", "where": "Сыр бойы", "lon": 65.0, "lat": 43.5, "route": [[65.5, 46.0], [65.0, 43.5], [64.5, 41.5], [63.5, 39.5]], "text": "Сыр бойы мен Арал маңынан мыңдаған отбасы оңтүстікке — Өзбекстан мен Түрікменстанға ауды."}, {"from": 1931, "to": 1959, "name": "Қарлаг", "type": "fort", "where": "Қарағанды", "lon": 72.68, "lat": 49.67, "text": "1931 жылы орталығы Долинкада болған Қарағанды еңбекпен түзеу лагері құрылды — КСРО-дағы ең ірі лагерьлердің бірі; 1959 жылы жабылды."}, {"from": 1931, "to": 1934, "name": "Қарағанды көмір бассейні", "type": "city", "where": "Қарағанды", "lon": 73.1, "lat": 49.81, "text": "1930-жылдардың басынан Қарағанды көмірі өндіріле бастады, бассейн КСРО-ның үшінші көмір базасына айналды; 1934 жылы Қарағанды қала мәртебесін алды. Негізгі жұмыс күші — жер аударылғандар мен тұтқындар."}, {"from": 1932, "to": 1932, "name": "КСРО ҒА Қазақ базасы", "type": "event", "where": "Жетісу", "lon": 76.95, "lat": 43.24, "text": "1932 жылы Алматыда КСРО Ғылым академиясының Қазақ базасы ашылды, 1938 жылы ол Қазақ филиалына айналды."}, {"from": 1933, "to": 1933, "name": "Голощекиннің кетуі", "type": "event", "where": "Қазақ даласы", "lon": 76.95, "lat": 43.24, "text": "1933 жылы қаңтарда Голощекин қызметтен алынып, орнына Л. Мырзоян келді. Бұған дейін Т. Рысқұлов пен «Бесеудің хаты» авторлары Сталинге ашаршылық туралы жазған."}, {"from": 1934, "to": 1934, "name": "Шымкент қорғасын зауыты", "type": "city", "where": "Оңтүстік Қазақстан", "lon": 69.6, "lat": 42.32, "text": "1934 жылы Шымкент қорғасын зауыты іске қосылды; соғыс жылдары КСРО-дағы қорғасынның басым бөлігін берді."}, {"from": 1936, "to": 1936, "name": "Қазақ КСР-і құрылды", "type": "law", "where": "Қазақ даласы", "lon": 76.95, "lat": 43.24, "text": "1936 жылы 5 желтоқсанда КСРО-ның жаңа Конституциясымен Қазақ АКСР-і одақтас Қазақ КСР-іне айналды; 1937 жылы республика Конституциясы қабылданды."}, {"from": 1936, "to": 1936, "name": "Поляктарды жер аудару", "type": "migration", "where": "Солтүстік Қазақстан", "lon": 69.39, "lat": 53.28, "route": [[40.5, 51.0], [46.0, 52.6], [55.0, 53.2], [62.0, 53.6], [69.39, 53.28]], "text": "1936 жылы Украина КСР-інің батыс шекаралық аудандарынан мыңдаған поляк пен неміс отбасы Көкшетау өңіріне жер аударылды."}, {"from": 1937, "to": 1937, "name": "Корейлерді жер аудару", "type": "migration", "where": "Қызылорда, Ұштөбе", "lon": 77.98, "lat": 45.25, "route": [[89.5, 55.0], [84.0, 55.0], [80.0, 53.0], [77.0, 50.0], [78.0, 45.25], [73.0, 44.5], [65.51, 44.85]], "text": "1937 жылы Қиыр Шығыстан 95 мыңнан астам корей Қазақстанға күшпен көшірілді; Ұштөбе мен Қызылорда маңына қоныстанды."}, {"from": 1937, "to": 1938, "name": "Жаппай қуғын-сүргін", "type": "event", "where": "Қазақ даласы", "lon": 76.95, "lat": 43.24, "text": "НКВД-ның 00447 бұйрығымен мыңдаған адам атылды; Ә. Бөкейхан (Мәскеу), А. Байтұрсынұлы, С. Сейфуллин, І. Жансүгіров, Б. Майлин (Алматы), М. Жұмабаев (Мәскеу) атылды."}, {"from": 1938, "to": 1953, "name": "АЛЖИР лагері", "type": "fort", "where": "Ақмола", "lon": 70.98, "lat": 51.07, "text": "1938 жылы Ақмола маңында «Отанын сатқандардың әйелдеріне» арналған лагерь ашылды; онда мыңдаған әйел, соның ішінде Алаш қайраткерлерінің жұбайлары отырды."}, {"from": 1938, "to": 1938, "name": "Балқаш мыс қорыту зауыты", "type": "city", "where": "Балқаш", "lon": 74.98, "lat": 46.85, "text": "1938 жылы Балқаш мыс қорыту зауыты іске қосылып, жаңа қала пайда болды."}, {"from": 1940, "to": 1940, "name": "Кирилл әліпбиіне көшу", "type": "law", "where": "Қазақ даласы", "lon": 76.95, "lat": 43.24, "text": "1940 жылы қазақ жазуы латыннан кирилл әліпбиіне ауыстырылды."}, {"from": 1941, "to": 1941, "name": "Ұлы Отан соғысы басталды", "type": "event", "where": "Қазақ даласы", "lon": 76.95, "lat": 43.24, "text": "1941 жылы 22 маусымда Германия КСРО-ға шабуыл жасады; соғыс жылдары Қазақстаннан 1,2 миллионнан астам адам майданға аттанды."}, {"from": 1941, "to": 1941, "name": "Момышұлы Мәскеу түбінде", "type": "battle", "where": "Мәскеу түбі", "lon": 35.96, "lat": 56.03, "text": "Б. Момышұлы бастаған батальон Волоколамск бағытында жаудың қоршауын бірнеше рет бұзып шықты. Батыр атағы оған тек 1990 жылы берілді."}, {"from": 1941, "to": 1941, "name": "Еділ бойы немістерін жер аудару", "type": "migration", "where": "Орталық және Солтүстік Қазақстан", "lon": 73.1, "lat": 49.81, "route": [[46.12, 51.48], [52.0, 51.5], [60.0, 51.5], [66.0, 52.5], [73.1, 49.81]], "text": "1941 жылы тамыз–қыркүйекте Еділ бойы немістерінің АКСР-і жойылып, немістер Қазақстан мен Сібірге жер аударылды."}, {"from": 1941, "to": 1942, "name": "Зауыттарды эвакуациялау", "type": "migration", "where": "Қазақ даласы", "lon": 57.17, "lat": 50.28, "route": [[45.5, 52.5], [48.5, 51.6], [51.37, 51.23], [57.17, 50.28], [62.0, 50.5], [69.15, 54.87]], "text": "Майдан маңынан 220-дан астам кәсіпорын, мыңдаған жұмысшы мен ғалым Қазақстанға көшірілді; олардың көбі соғыстан кейін де осында қалды."}, {"from": 1942, "to": 1942, "name": "«Абай» романы", "type": "event", "where": "Жетісу", "lon": 76.95, "lat": 43.24, "text": "1942 жылы М. Әуезовтің «Абай» романының бірінші кітабы жарық көрді."}, {"from": 1942, "to": 1943, "name": "Сталинград шайқасы", "type": "battle", "where": "Батыс Қазақстан", "lon": 44.52, "lat": 48.71, "text": "Сталинград түбінде Қазақстанда жасақталған дивизиялар соғысты; Батыс Қазақстан майдан маңы аймағына айналып, Орал мен Гурьевке неміс ұшақтары шабуыл жасады."}, {"from": 1943, "to": 1943, "name": "Ақтөбе ферроқорытпа зауыты", "type": "city", "where": "Ақтөбе", "lon": 57.17, "lat": 50.28, "text": "1943 жылы Ақтөбеде ферроқорытпа зауыты іске қосылды — қару-жарақ болатына қажет қоспалар шығарды."}, {"from": 1943, "to": 1943, "name": "Мәншүк Мәметованың ерлігі", "type": "battle", "where": "Невель", "lon": 29.92, "lat": 56.02, "text": "1943 жылы 15 қазанда пулеметші М. Мәметова Невель үшін шайқаста қаза тапты; Кеңес Одағының Батыры атағын алған алғашқы қазақ қызы (1944 жылы 1 наурызда, қаза болғаннан кейін)."}, {"from": 1944, "to": 1944, "name": "Әлия Молдағұлованың ерлігі", "type": "battle", "where": "Новосокольники", "lon": 30.15, "lat": 56.34, "text": "1944 жылы 14 қаңтарда мерген Ә. Молдағұлова Новосокольники маңында шабуылда қаза тапты; Кеңес Одағының Батыры атағы берілді."}, {"from": 1944, "to": 1944, "name": "Шешендер мен ингуштарды жер аудару", "type": "migration", "where": "Орталық және Солтүстік Қазақстан", "lon": 76.95, "lat": 52.29, "route": [[45.7, 43.32], [48.0, 45.5], [51.0, 48.0], [57.0, 50.0], [64.0, 50.5], [73.1, 49.81], [76.95, 52.29]], "text": "1944 жылы ақпанда Шешен-Ингуш АКСР-і жойылып, 400 мыңға жуық адам Қазақстан мен Орта Азияға жер аударылды. 1943–1944 жылдары қарашайлар, қалмақтар, балқарлар, Месхет түріктері де жер аударылды."}, {"from": 1944, "to": 1944, "name": "Теміртау болаты", "type": "city", "where": "Қарағанды", "lon": 72.96, "lat": 50.05, "text": "1944 жылы Теміртауда Қазақстан металлургия зауыты алғашқы болатын балқытты."}, {"from": 1945, "to": 1945, "name": "Рейхстагқа ту тігу", "type": "battle", "where": "Берлин", "lon": 13.38, "lat": 52.52, "text": "1945 жылы 30 сәуірде лейтенант Р. Қошқарбаев Г. Булатовпен бірге рейхстагқа алғашқылардың бірі болып ту тікті. 9 мамырда соғыс аяқталды."}, {"from": 1946, "to": 1946, "name": "Қазақ КСР Ғылым академиясы", "type": "event", "where": "Жетісу", "lon": 76.95, "lat": 43.24, "text": "1946 жылы 1 маусымда Қазақ КСР Ғылым академиясы құрылды, алғашқы президенті — Қ. Сәтбаев."}, {"from": 1947, "to": 1954, "name": "Бекмаханов ісі", "type": "event", "where": "Жетісу", "lon": 76.95, "lat": 43.24, "text": "1947 жылы шыққан «XIX ғасырдың 20–40 жылдарындағы Қазақстан» монографиясында Кенесары көтерілісі ұлт-азаттық күрес деп бағаланды. 1950 жылы «Правда» сынынан кейін Е. Бекмаханов 1952 жылы 25 жылға сотталды, 1954 жылы босатылды."}, {"from": 1949, "to": 1949, "name": "Семей полигонындағы алғашқы жарылыс", "type": "event", "where": "Семей облысы", "lon": 77.84, "lat": 50.44, "text": "1949 жылы 29 тамызда Семей полигонында КСРО-ның алғашқы атом бомбасы жарылды. 1949–1989 жылдары 456 ядролық сынақ жасалып, 1,5 миллионға жуық адам радиациядан зардап шекті."}, {"from": 1953, "to": 1953, "name": "Сутегі бомбасының сынағы", "type": "event", "where": "Семей облысы", "lon": 77.84, "lat": 50.44, "text": "1953 жылы 12 тамызда Семей полигонында КСРО-ның алғашқы сутегі бомбасы сыналды; маңайдағы ауылдар толық көшірілмеді."}, {"from": 1954, "to": 1954, "name": "Тың игеру басталды", "type": "law", "where": "Солтүстік Қазақстан", "lon": 71.43, "lat": 51.13, "text": "1954 жылы ақпан–наурыздағы КОКП ОК пленумынан кейін Солтүстік Қазақстанға жүз мыңдаған тыңгер келді; 1954–1960 жылдары 25 миллион гектардан астам жер жыртылды."}, {"from": 1955, "to": 1955, "name": "Байқоңыр ғарыш айлағы", "type": "city", "where": "Сыр бойы", "lon": 63.34, "lat": 45.92, "text": "1955 жылы Қызылорда облысындағы Төретам маңында ғарыш айлағын салу басталды. 1957 жылы 4 қазанда алғашқы жасанды серік ұшырылды."}, {"from": 1956, "to": 1956, "name": "Миллиард пұт астық", "type": "event", "where": "Солтүстік Қазақстан", "lon": 63.62, "lat": 53.21, "text": "1956 жылы Қазақстан алғаш рет миллиард пұт (16 млн тоннадан астам) астық тапсырды; республикаға Ленин ордені берілді."}, {"from": 1956, "to": 1957, "name": "ХХ съезд және ақтау", "type": "law", "where": "Қазақ даласы", "lon": 37.62, "lat": 55.75, "text": "1956 жылы ақпанда Н. Хрущев ХХ съезде Сталиннің жеке басына табынуды сынады; 1957 жылдан С. Сейфуллин, І. Жансүгіров, Б. Майлин т.б. ақтала бастады. Алаш қайраткерлері тек 1988–1989 жылдары ақталды."}, {"from": 1957, "to": 1957, "name": "Соколов-Сарыбай комбинаты", "type": "city", "where": "Қостанай", "lon": 63.12, "lat": 52.96, "text": "1957 жылы Рудныйда Соколов-Сарыбай тау-кен байыту комбинаты іске қосылды — темір кенін өндіретін ірі кешен."}, {"from": 1959, "to": 1959, "name": "Теміртау оқиғасы", "type": "uprising", "where": "Қарағанды", "lon": 72.96, "lat": 50.05, "text": "1959 жылы тамызда Қазақстан Магниткасын салған жас құрылысшылар жаман тұрмысқа наразылықпен көтеріліп, әскермен басылды; бірнеше адам қаза тапты."}, {"from": 1959, "to": 1959, "name": "«Абай жолы» Лениндік сыйлық алды", "type": "event", "where": "Жетісу", "lon": 76.95, "lat": 43.24, "text": "М. Әуезовтің «Абай жолы» эпопеясы Лениндік сыйлыққа ие болды."}, {"from": 1960, "to": 1965, "name": "Тың өлкесі", "type": "law", "where": "Солтүстік Қазақстан", "lon": 71.43, "lat": 51.13, "text": "1960 жылы солтүстіктегі бес облыс Тың өлкесіне біріктірілді, 1961 жылы Ақмола Целиноград атанды. Жыртылған жерде шаңды дауылдар басталды; Шортандыда А. Бараев жыртпай өңдеу әдісін енгізді."}, {"from": 1961, "to": 1961, "name": "Гагарин Байқоңырдан ұшты", "type": "event", "where": "Сыр бойы", "lon": 63.34, "lat": 45.92, "text": "1961 жылы 12 сәуірде Ю. Гагарин «Восток» кемесімен Байқоңырдан ұшып, ғарышқа шыққан алғашқы адам болды."}, {"from": 1961, "to": 1961, "name": "Өзен мен Жетібай мұнайы", "type": "site", "where": "Маңғыстау", "lon": 52.85, "lat": 43.34, "text": "1961 жылы Маңғыстауда Өзен мен Жетібай мұнай кен орындары ашылды; Шевченко (Ақтау) мен Жаңаөзен қалалары салынды."}, {"from": 1969, "to": 1969, "name": "Жалаңашкөл шекара қақтығысы", "type": "battle", "where": "Жетісу", "lon": 82.2, "lat": 45.6, "text": "1969 жылы тамызда Жоңғар қақпасы маңындағы Жалаңашкөлде кеңес шекарашылары мен қытай әскерлері арасында қақтығыс болды.", "note": "шамамен орны"}, {"from": 1960, "to": 1991, "name": "Арал апаты", "type": "event", "where": "Арал өңірі", "lon": 61.67, "lat": 46.8, "text": "1960-жылдардан Әмудария мен Сырдария суы мақта алқаптарына бұрылып, Арал теңізі тартыла бастады; ауа мен су ластанып, балық шаруашылығы жойылды."}, {"from": 1970, "to": 1970, "name": "Қапшағай су электр станциясы", "type": "city", "where": "Жетісу", "lon": 77.08, "lat": 43.88, "text": "1970 жылы Іле өзенінде Қапшағай СЭС-і іске қосылып, үлкен су қоймасы пайда болды."}, {"from": 1972, "to": 1972, "name": "Медеу мұз айдыны", "type": "city", "where": "Жетісу", "lon": 77.06, "lat": 43.16, "text": "1972 жылы Алматы маңында биік таулы Медеу мұз айдыны ашылды; Қонаев кезіндегі ірі құрылыстардың бірі."}, {"from": 1975, "to": 1975, "name": "«Аз и Я» кітабы", "type": "event", "where": "Жетісу", "lon": 76.95, "lat": 43.24, "text": "1975 жылы О. Сүлейменовтің «Аз и Я» кітабы шықты; «Игорь жасағы туралы жырдағы» түркі сөздерін зерттегені үшін ресми сынға ұшырады."}, {"from": 1979, "to": 1979, "name": "Целиноград оқиғасы", "type": "uprising", "where": "Ақмола", "lon": 71.43, "lat": 51.13, "text": "1979 жылы 16–19 маусымда Целиноградта студенттер мен жастар Ерейментау орталығымен неміс автономиясын құру жобасына қарсы шеруге шықты; жоба тоқтатылды."}, {"from": 1980, "to": 1980, "name": "Екібастұз ГРЭС-1", "type": "city", "where": "Павлодар", "lon": 75.37, "lat": 52.03, "text": "1980 жылы Екібастұз ГРЭС-1-нің алғашқы блогы іске қосылды; көмір кешені КСРО-ның энергия базасына айналды.", "note": "шамамен орны"}, {"from": 1985, "to": 1985, "name": "Қайта құру басталды", "type": "law", "where": "КСРО", "lon": 37.62, "lat": 55.75, "text": "1985 жылы сәуір пленумында М. Горбачев қайта құру бағытын жариялады, 1986 жылдан жариялылық кеңейді."}, {"from": 1986, "to": 1986, "name": "Желтоқсан көтерілісі", "type": "uprising", "where": "Жетісу", "lon": 76.95, "lat": 43.24, "text": "1986 жылы 16 желтоқсанда Қонаевтың орнына Г. Колбин тағайындалды; 17–18 желтоқсанда Алматыдағы Брежнев (қазіргі Республика) алаңына шыққан жастар әскермен қуылды, мыңдаған адам ұсталып, жазаланды."}, {"from": 1986, "to": 1986, "name": "Желтоқсан толқулары облыстарда", "type": "uprising", "where": "Қазақ даласы", "lon": 73.1, "lat": 49.81, "text": "Желтоқсанда Қарағанды, Талдықорған т.б. қалаларда да жастар наразылық білдірді."}, {"from": 1987, "to": 1987, "name": "«Қазақ ұлтшылдығы» туралы қаулы", "type": "law", "where": "КСРО", "lon": 37.62, "lat": 55.75, "text": "1987 жылы шілдеде КОКП ОК Желтоқсан оқиғасын «қазақ ұлтшылдығының көрінісі» деп айыптады; бұл баға 1990 жылы жойылды."}, {"from": 1988, "to": 1988, "name": "Қайрат Рысқұлбековтің қазасы", "type": "event", "where": "Семей облысы", "lon": 80.25, "lat": 50.41, "text": "1988 жылы мамырда Желтоқсан көтерілісіне қатысқаны үшін өлім жазасына кесілген (кейін 20 жылға ауыстырылған) Қ. Рысқұлбеков Семей түрмесінде қаза тапты."}, {"from": 1989, "to": 1989, "name": "«Невада–Семей» қозғалысы", "type": "event", "where": "Жетісу", "lon": 76.95, "lat": 43.24, "text": "1989 жылы 28 ақпанда Алматыда Жазушылар одағында О. Сүлейменов бастап «Невада–Семей» қозғалысы құрылды; ядролық сынақтарды тоқтатуды талап етті."}, {"from": 1989, "to": 1989, "name": "Жаңаөзен оқиғасы", "type": "uprising", "where": "Маңғыстау", "lon": 52.85, "lat": 43.34, "text": "1989 жылы маусымда Жаңаөзенде жұмыссыздық пен тұрмыстық теңсіздікке байланысты жастар толқуы болды."}, {"from": 1989, "to": 1989, "name": "Тілдер туралы заң", "type": "law", "where": "Қазақ даласы", "lon": 76.95, "lat": 43.24, "text": "1989 жылы 22 қыркүйекте «Қазақ КСР-індегі тілдер туралы» заң қабылданып, қазақ тілі мемлекеттік тіл, орыс тілі ұлтаралық қатынас тілі деп бекітілді."}, {"from": 1989, "to": 1989, "name": "Семей полигонындағы соңғы сынақ", "type": "event", "where": "Семей облысы", "lon": 78.0, "lat": 50.3, "text": "1989 жылы 19 қазанда Семей полигонында соңғы жерасты ядролық жарылысы болды; «Невада–Семей» қозғалысының қысымымен сынақтар тоқтады."}, {"from": 1990, "to": 1990, "name": "Қазақ КСР Президенті", "type": "law", "where": "Қазақ даласы", "lon": 76.95, "lat": 43.24, "text": "1990 жылы 24 сәуірде Жоғарғы Кеңес Н. Назарбаевты Қазақ КСР-інің Президенті етіп сайлады."}, {"from": 1991, "to": 1991, "name": "Тамыз бүлігі (ГКЧП)", "type": "event", "where": "КСРО", "lon": 37.62, "lat": 55.75, "text": "1991 жылы 19–21 тамызда Мәскеуде Төтенше жағдай жөніндегі мемлекеттік комитет билікті алмақ болды; бүлік жеңіліп, КСРО-ның ыдырауы жылдамдады. 22 тамызда Назарбаев КОКП ОК Саяси бюросы мен ОК құрамынан шықты."}, {"from": 1991, "to": 1991, "name": "Семей полигоны жабылды", "type": "law", "where": "Семей облысы", "lon": 78.0, "lat": 50.3, "text": "1991 жылы 29 тамызда Н. Назарбаевтың жарлығымен Семей ядролық полигоны жабылды; кейін БҰҰ 29 тамызды ядролық сынақтарға қарсы күн деп жариялады."}, {"from": 1991, "to": 1991, "name": "Тұңғыш президент сайлауы", "type": "event", "where": "Қазақ даласы", "lon": 76.95, "lat": 43.24, "text": "1991 жылы 1 желтоқсанда жалпыхалықтық сайлауда Н. Назарбаев Президент болып сайланды; 10 желтоқсанда Қазақ КСР-і Қазақстан Республикасы деп аталды."}, {"from": 1991, "to": 1991, "name": "Беловеж келісімі", "type": "law", "where": "КСРО", "lon": 23.95, "lat": 52.62, "text": "1991 жылы 8 желтоқсанда Ресей, Украина, Беларусь басшылары КСРО-ның тоқтағанын жариялап, ТМД құру туралы келісімге қол қойды."}, {"from": 1991, "to": 1991, "name": "Тәуелсіздік туралы заң", "type": "law", "where": "Қазақ даласы", "lon": 76.95, "lat": 43.24, "text": "1991 жылы 16 желтоқсанда Жоғарғы Кеңес «Қазақстан Республикасының мемлекеттік тәуелсіздігі туралы» Конституциялық заң қабылдады."}, {"from": 1992, "to": 1992, "name": "Бағаны ырықтандыру", "type": "law", "where": "Бүкіл Қазақстан", "lon": 72.0, "lat": 48.0, "text": "1992 жылғы қаңтардан бастап көп тауардың бағасы еркін болды. Баға күрт өсіп, жинақ құнсызданды, халықтың тұрмысы нашарлады."}, {"from": 1992, "to": 1992, "name": "Қазақстан БҰҰ-ға мүше болды", "type": "event", "where": "Халықаралық", "lon": 76.9, "lat": 43.3, "text": "1992 жылғы 2 наурызда Қазақстан Біріккен Ұлттар Ұйымына мүше болып қабылданды. Тәуелсіз мемлекет ретінде халықаралық танылу бекіді."}, {"from": 1992, "to": 1992, "name": "Мемлекеттік рәміздер", "type": "law", "where": "Алматы", "lon": 76.94, "lat": 43.23, "text": "1992 жылғы 4 маусымда Ту (авторы Ш. Ниязбеков) мен Елтаңба (авторлары Ж. Мәлібеков, Ш. Уәлиханов) бекітілді. Алғашқы Әнұран да сол жылы қабылданды, 2006 жылы «Менің Қазақстаным» болып өзгерді."}, {"from": 1993, "to": 1993, "name": "Тұңғыш Конституция", "type": "law", "where": "Алматы", "lon": 76.95, "lat": 43.26, "text": "1993 жылғы 28 қаңтарда Жоғарғы Кеңес тәуелсіз Қазақстанның алғашқы Конституциясын қабылдады. Қазақ тілі мемлекеттік тіл деп жарияланды."}, {"from": 1993, "to": 1993, "name": "«Теңізшевройл» құрылды", "type": "event", "where": "Атырау облысы", "lon": 53.38, "lat": 46.15, "text": "1993 жылы сәуірде Қазақстан мен американдық «Шеврон» Теңіз кен орнын игеретін бірлескен кәсіпорын құрды. Бұл — тәуелсіз елдегі алғашқы ірі шетел инвестициясы."}, {"from": 1993, "to": 1993, "name": "ТҮРКСОЙ құрылды", "type": "event", "where": "Алматы", "lon": 76.93, "lat": 43.25, "text": "1993 жылы шілдеде Алматыда түркі халықтарының мәдениеті мен өнерін бірлесіп дамытатын ТҮРКСОЙ ұйымы құрылды."}, {"from": 1993, "to": 1993, "name": "Аралды құтқару халықаралық қоры", "type": "event", "where": "Арал өңірі", "lon": 61.67, "lat": 46.8, "text": "1993 жылы Орталық Азия елдері Аралды құтқарудың халықаралық қорын құрды. Арал маңын сауықтыру ортақ мәселе деп танылды."}, {"from": 1993, "to": 1995, "name": "Купондық жекешелендіру", "type": "law", "where": "Бүкіл Қазақстан", "lon": 70.0, "lat": 47.5, "text": "1993–1995 жылдары халыққа жекешелендіру купондары таратылды, мемлекет меншігіндегі кәсіпорындар жеке қолға өте бастады. Купондардың көбі инвестициялық қорларға арзанға кетті."}, {"from": 1994, "to": 1994, "name": "Байқоңыр жалға берілді", "type": "event", "where": "Қызылорда облысы", "lon": 63.3, "lat": 45.9, "text": "1994 жылғы 28 наурызда Байқоңыр ғарыш айлағы Ресейге жалға берілді, 2004 жылы мерзімі 2050 жылға дейін ұзартылды. Жалдау ақысы жылына 115 млн доллар."}, {"from": 1994, "to": 1994, "name": "Қытаймен шекара келісімі", "type": "law", "where": "Қытаймен шекара", "lon": 80.4, "lat": 44.2, "text": "1994 жылғы 26 сәуірде Алматыда Қытаймен мемлекеттік шекара туралы алғашқы келісімге қол қойылды; 1997, 1998 жылғы келісімдермен толықтырылды. Демаркация 2002 жылы аяқталды."}, {"from": 1994, "to": 1994, "name": "Елорданы көшіру шешімі", "type": "law", "where": "Алматы", "lon": 76.95, "lat": 43.24, "text": "1994 жылғы 6 шілдеде Жоғарғы Кеңес елорданы Алматыдан Ақмолаға көшіру туралы қаулы қабылдады."}, {"from": 1994, "to": 1994, "name": "Будапешт меморандумы", "type": "event", "where": "Халықаралық", "lon": 19.04, "lat": 47.5, "text": "1994 жылғы 5 желтоқсанда АҚШ, Ресей және Ұлыбритания ядролық қарудан бас тартқан Қазақстанның қауіпсіздігіне кепілдік берді."}, {"from": 1995, "to": 1995, "name": "Қазақстан халқы Ассамблеясы", "type": "event", "where": "Алматы", "lon": 76.91, "lat": 43.24, "text": "1995 жылғы 1 наурызда елдегі этностардың өкілдерін біріктіретін кеңесші орган — Қазақстан халқы Ассамблеясы құрылды."}, {"from": 1995, "to": 1995, "name": "Сәуір референдумы", "type": "law", "where": "Бүкіл Қазақстан", "lon": 72.5, "lat": 47.0, "text": "1995 жылғы 29 сәуірде референдумда Президент Н. Назарбаевтың өкілеттігі 2000 жылға дейін ұзартылды."}, {"from": 1995, "to": 1995, "name": "Ядролық оқтұмсықтан арылу", "type": "event", "where": "Семей өңірі", "lon": 78.0, "lat": 50.3, "text": "1995 жылы сәуірде соңғы ядролық оқтұмсықтар Ресейге шығарылды, мамырда Семей полигонындағы соңғы ядролық заряд жойылды. Қазақстан ядролық қарусыз ел болды."}, {"from": 1995, "to": 1995, "name": "1995 жылғы Конституция", "type": "law", "where": "Алматы", "lon": 76.95, "lat": 43.23, "text": "1995 жылғы 30 тамызда референдумда екінші Конституция қабылданды: президенттік басқару және екі палаталы Парламент (Сенат пен Мәжіліс) енгізілді. Бұл күн — Конституция күні."}, {"from": 1996, "to": 1996, "name": "«Шанхай бестігі»", "type": "event", "where": "Халықаралық", "lon": 121.47, "lat": 31.23, "text": "1996 жылғы 26 сәуірде Қазақстан, Қытай, Ресей, Қырғызстан, Тәжікстан шекарадағы әскери сенім туралы келісімге қол қойды. Бұл одақтан 2001 жылы ШЫҰ құрылды."}, {"from": 1996, "to": 1998, "name": "Ірі кәсіпорындарды сату", "type": "law", "where": "Орталық және Шығыс Қазақстан", "lon": 73.1, "lat": 49.8, "text": "1996–1998 жылдары металлургия, көмір, энергетика кәсіпорындары жеке жобамен шетел компанияларына сатылды немесе басқаруға берілді. Өндіріс қайта жанданды, бірақ көп жұмысшы қысқартылды."}, {"from": 1997, "to": 1997, "name": "«Тіл туралы» заң", "type": "law", "where": "Алматы", "lon": 76.94, "lat": 43.26, "text": "1997 жылғы 11 шілдеде «Қазақстан Республикасындағы тіл туралы» заң қабылданды: қазақ тілі — мемлекеттік тіл, орыс тілі ресми қолданылады."}, {"from": 1997, "to": 1997, "name": "«Қазақстан–2030» стратегиясы", "type": "law", "where": "Бүкіл Қазақстан", "lon": 71.0, "lat": 50.0, "text": "1997 жылы қазанда Президент Жолдауында ұзақ мерзімді «Қазақстан–2030» даму стратегиясы жарияланды."}, {"from": 1997, "to": 1997, "name": "Елорда Ақмолаға көшті", "type": "city", "where": "Ақмола", "lon": 71.43, "lat": 51.13, "text": "1997 жылғы 10 желтоқсанда елорда ресми түрде Алматыдан Ақмолаға көшті. 1998 жылғы 6 мамырда қала Астана деп аталды, 10 маусымда әлемге таныстырылды."}, {"from": 1997, "to": 1997, "name": "Халықтың көші-қоны туралы заң", "type": "law", "where": "Бүкіл Қазақстан", "lon": 74.0, "lat": 46.0, "text": "1997 жылы көші-қон туралы заң оралмандарға квота мен көмек берді. 1991 жылдан 2025 жылға дейін 1,16 млн-ға жуық қандас оралды."}, {"from": 1999, "to": 1999, "name": "Мерзімінен бұрын президент сайлауы", "type": "event", "where": "Бүкіл Қазақстан", "lon": 71.48, "lat": 51.17, "text": "1999 жылғы 10 қаңтарда Н. Назарбаев 79,78% дауыспен 7 жылға қайта сайланды; сол жылы Мәжілістің бір бөлігі алғаш рет партиялық тізіммен сайланды."}, {"from": 2009, "to": 2009, "name": "Орталық Азия–Қытай газ құбыры", "type": "migration", "where": "Оңтүстік Қазақстан — Жетісу", "lon": 69.6, "lat": 42.32, "text": "2009 жылғы 14 желтоқсанда Түрікменстаннан Өзбекстан мен Қазақстан арқылы Қытайға баратын газ құбыры іске қосылды. Сол жылы Кеңқияқ–Құмкөл мұнай құбыры да ашылды.", "route": [[63.5, 38.9], [66.0, 40.3], [68.6, 41.2], [69.6, 42.32], [72.0, 43.0], [76.0, 43.6], [80.4, 44.2]]}, {"from": 2000, "to": 2000, "name": "Ұлттық қор құрылды", "type": "law", "where": "Астана", "lon": 71.45, "lat": 51.15, "text": "2000 жылы тамызда мұнай-газ табысының бір бөлігін болашаққа жинайтын Ұлттық қор құрылды. Қор 2008 және 2015 жылғы дағдарыстарда экономиканы қолдады."}, {"from": 2001, "to": 2001, "name": "КТК құбыры іске қосылды", "type": "migration", "where": "Атырау облысы", "lon": 53.38, "lat": 46.15, "text": "2001 жылы Теңізден Новороссийскіге дейінгі Каспий құбыр консорциумы (КТК) іске қосылды. Қазақ мұнайы Қара теңіз арқылы әлем нарығына шықты.", "route": [[53.38, 46.15], [51.92, 47.11], [48.0, 46.35], [44.0, 45.6], [40.6, 45.4], [37.77, 44.72]]}, {"from": 2001, "to": 2001, "name": "ШЫҰ құрылды", "type": "event", "where": "Халықаралық", "lon": 121.47, "lat": 31.23, "text": "2001 жылғы 15 маусымда Шанхайда «Шанхай бестігі» мен Өзбекстан Шанхай ынтымақтастық ұйымын құрды."}, {"from": 2001, "to": 2002, "name": "Оңтүстіктегі шекара шарттары", "type": "law", "where": "Өзбекстан, Қырғызстан, Түрікменстанмен шекара", "lon": 64.0, "lat": 43.6, "text": "2001–2002 жылдары Түрікменстан (2001), Қырғызстан (2001), Өзбекстанмен (2001–2002) шекараны делимитациялау шарттары жасалды."}, {"from": 2003, "to": 2003, "name": "Ясауи кесенесі ЮНЕСКО тізімінде", "type": "site", "where": "Түркістан", "lon": 68.27, "lat": 43.29, "text": "2003 жылы Қожа Ахмет Ясауи кесенесі ЮНЕСКО-ның Дүниежүзілік мұра тізіміне енген Қазақстандағы тұңғыш нысан болды."}, {"from": 2003, "to": 2003, "name": "Әлемдік және дәстүрлі діндер съезі", "type": "event", "where": "Астана", "lon": 71.41, "lat": 51.12, "text": "2003 жылы қыркүйекте Астанада әлемдік және дәстүрлі діндер көшбасшыларының I съезі өтті; съезд үш жыл сайын жиналады."}, {"from": 2004, "to": 2004, "name": "«Мәдени мұра» және ҰБТ", "type": "law", "where": "Бүкіл Қазақстан", "lon": 72.0, "lat": 46.5, "text": "2004 жылы тарихи-мәдени ескерткіштерді қалпына келтіретін «Мәдени мұра» бағдарламасы басталды, мектеп түлектері үшін Ұлттық бірыңғай тестілеу енгізілді. Тамғалы ЮНЕСКО тізіміне енді."}, {"from": 2005, "to": 2005, "name": "Ресеймен шекара шарты", "type": "law", "where": "Ресеймен шекара", "lon": 61.2, "lat": 54.0, "text": "2005 жылғы 18 қаңтарда Мәскеуде Қазақстан мен Ресей 7,5 мың км-ден астам шекара туралы шартқа қол қойды. Бұл — әлемдегі ең ұзын құрлық шекараларының бірі."}, {"from": 2005, "to": 2005, "name": "Көкарал бөгеті", "type": "event", "where": "Арал өңірі", "lon": 60.79, "lat": 46.1, "text": "2005 жылы Кіші Аралды Үлкен Аралдан бөліп сақтайтын Көкарал бөгеті салынды. Кіші Аралда су деңгейі көтеріліп, балық шаруашылығы жанданды."}, {"from": 2006, "to": 2006, "name": "Қазақстан–Қытай мұнай құбыры", "type": "migration", "where": "Орталық Қазақстан — Жетісу", "lon": 71.6, "lat": 48.7, "text": "2006 жылы Атасу–Алашаңқай мұнай құбыры іске қосылды, 2009 жылы Кеңқияқ–Құмкөл бөлігі жалғанды. Қазақ мұнайы Қытайға тікелей жеткізіле бастады.", "route": [[71.6, 48.7], [74.0, 47.5], [78.0, 46.2], [80.5, 45.5], [82.57, 45.17]]}, {"from": 2006, "to": 2006, "name": "«Менің Қазақстаным» Әнұран болды", "type": "law", "where": "Астана", "lon": 71.44, "lat": 51.14, "text": "2006 жылғы 7 қаңтарда Ш. Қалдаяқовтың әні (сөзі Ж. Нәжімеденов, Н. Назарбаев) мемлекеттік Әнұран болып бекітілді."}, {"from": 2007, "to": 2007, "name": "2007 жылғы конституциялық реформа", "type": "law", "where": "Астана", "lon": 71.42, "lat": 51.14, "text": "2007 жылы мамырда Мәжіліс тек партиялық тізіммен сайланатын болды, Президент мерзімі 5 жылға қысқарды, Тұңғыш Президентке мерзім шектеуі алынды."}, {"from": 2008, "to": 2008, "name": "Сарыарқа ЮНЕСКО тізімінде", "type": "site", "where": "Қорғалжын, Наурызым", "lon": 69.4, "lat": 50.4, "text": "2008 жылы Қорғалжын мен Наурызым қорықтары «Сарыарқа — Солтүстік Қазақстан даласы мен көлдері» атымен ЮНЕСКО тізіміне енді."}, {"from": 2010, "to": 2010, "name": "Кедендік одақ", "type": "law", "where": "Ресей, Беларусьпен шекара", "lon": 52.0, "lat": 51.5, "text": "2010 жылы Қазақстан, Ресей, Беларусь Кедендік одағы жұмыс істей бастады; 2011 жылғы 1 шілдеде одақ ішіндегі кедендік бақылау алынды."}, {"from": 2010, "to": 2010, "name": "Назарбаев университеті, Болон процесі", "type": "event", "where": "Астана", "lon": 71.4, "lat": 51.09, "text": "2010 жылы Астанада Назарбаев университеті ашылды, Қазақстан Болон процесіне қосылып, жоғары білім еуропалық үлгіге бейімделді."}, {"from": 2011, "to": 2011, "name": "Қысқы Азия ойындары", "type": "event", "where": "Астана мен Алматы", "lon": 76.95, "lat": 43.2, "text": "2011 жылы қаңтар–ақпанда Астана мен Алматыда VII Қысқы Азия ойындары өтті, Қазақстан командасы бірінші орын алды."}, {"from": 2011, "to": 2011, "name": "Жаңаөзен оқиғасы", "type": "uprising", "where": "Маңғыстау", "lon": 52.8, "lat": 43.34, "text": "2011 жылғы 16 желтоқсанда айлық ереуілдегі мұнайшыларды тарату кезінде полиция оқ атып, ресми дерек бойынша Жаңаөзен мен Шетпеде 17 адам қаза тапты. Төтенше жағдай жарияланды, бірнеше адам сотталды."}, {"from": 2012, "to": 2012, "name": "«Қазақстан–2050» стратегиясы", "type": "law", "where": "Астана", "lon": 71.46, "lat": 51.12, "text": "2012 жылғы 14 желтоқсанда Жолдауда «Қазақстан–2050» стратегиясы жарияланды: 2050 жылға дейін әлемнің дамыған 30 елінің қатарына кіру мақсаты қойылды."}, {"from": 2012, "to": 2015, "name": "«Қорғас» шекара орталығы", "type": "city", "where": "Жетісу", "lon": 80.4, "lat": 44.2, "text": "2012 жылы Қытай шекарасында «Қорғас» халықаралық шекара маңы ынтымақтастық орталығы, 2015 жылы «Қорғас — Шығыс қақпасы» құрғақ порты ашылды."}, {"from": 2013, "to": 2013, "name": "«Белдеу және жол» бастамасы", "type": "event", "where": "Астана", "lon": 71.4, "lat": 51.09, "text": "2013 жылғы 7 қыркүйекте Си Цзиньпин Назарбаев университетінде «Жібек жолы экономикалық белдеуі» жобасын жариялады."}, {"from": 2014, "to": 2014, "name": "Еуразиялық экономикалық одақ шарты", "type": "law", "where": "Астана", "lon": 71.43, "lat": 51.16, "text": "2014 жылғы 29 мамырда Астанада Қазақстан, Ресей, Беларусь ЕАЭО туралы шартқа қол қойды; одақ 2015 жылғы 1 қаңтардан жұмыс істей бастады. Сол жылы Жібек жолы ескерткіштері (Талғар, Қаялық, Ақыртас) ЮНЕСКО тізіміне енді."}, {"from": 2015, "to": 2015, "name": "Теңге еркін бағамға көшті", "type": "law", "where": "Бүкіл Қазақстан", "lon": 76.92, "lat": 43.27, "text": "2015 жылғы 20 тамызда Ұлттық банк еркін өзгермелі бағамға көшті, теңге бір айда шамамен екі есе құнсызданды."}, {"from": 2015, "to": 2015, "name": "Қазақ хандығына 550 жыл", "type": "event", "where": "Жамбыл облысы", "lon": 71.37, "lat": 42.9, "text": "2015 жылы Қазақ хандығының 550 жылдығы елде тойланды, басты шара Тараз маңында өтті."}, {"from": 2016, "to": 2016, "name": "Жер митингілері", "type": "uprising", "where": "Атырау, Ақтөбе", "lon": 51.92, "lat": 47.11, "text": "2016 жылы сәуір–мамырда Атырау, Ақтөбе, Семей т.б. қалаларда ауыл шаруашылығы жерін шетелдіктерге жалға беруге қарсы наразылық болды. Жер кодексіндегі түзетулерге мораторий жарияланды."}, {"from": 2016, "to": 2016, "name": "Қашағанда өндіріс басталды", "type": "event", "where": "Каспий теңізі", "lon": 51.6, "lat": 46.2, "text": "Теңіздегі Қашаған кен орнында 2013 жылғы сәтсіз іске қосудан кейін өндіріс 2016 жылы күзде қайта басталды. Бұл — Каспийдегі ең ірі кен орындарының бірі."}, {"from": 2017, "to": 2017, "name": "Универсиада", "type": "event", "where": "Алматы", "lon": 76.97, "lat": 43.22, "text": "2017 жылы қаңтар–ақпанда Алматыда XXVIII қысқы Универсиада өтті."}, {"from": 2017, "to": 2017, "name": "«Рухани жаңғыру» және латын әліпбиі", "type": "law", "where": "Бүкіл Қазақстан", "lon": 71.0, "lat": 48.5, "text": "2017 жылғы 12 сәуірде «Болашаққа бағдар: рухани жаңғыру» мақаласы жарияланды; 26 қазанда қазақ әліпбиін латын графикасына көшіру туралы жарлық шықты."}, {"from": 2017, "to": 2017, "name": "ЭКСПО-2017", "type": "event", "where": "Астана", "lon": 71.41, "lat": 51.09, "text": "2017 жылғы 10 маусым — 10 қыркүйекте Астанада «Болашақ энергиясы» тақырыбымен халықаралық көрме өтті; оны 4 млн-ға жуық адам тамашалады."}, {"from": 2018, "to": 2018, "name": "Каспий конвенциясы", "type": "law", "where": "Маңғыстау", "lon": 51.17, "lat": 43.65, "text": "2018 жылғы 12 тамызда Ақтауда бес Каспий маңы елі Каспий теңізінің құқықтық мәртебесі туралы конвенцияға қол қойды."}, {"from": 2018, "to": 2018, "name": "Түркістан облыс орталығы болды", "type": "city", "where": "Түркістан", "lon": 68.27, "lat": 43.3, "text": "2018 жылы маусымда Шымкент республикалық маңызы бар қала болды, Оңтүстік Қазақстан облысы Түркістан облысы аталып, орталығы Түркістанға көшті."}, {"from": 2018, "to": 2018, "name": "«Ұлы даланың жеті қыры»", "type": "event", "where": "Бүкіл Қазақстан", "lon": 68.0, "lat": 47.5, "text": "2018 жылғы қарашада Н. Назарбаевтың «Ұлы даланың жеті қыры» мақаласы жарияланып, тарихи сананы жаңғырту жобалары басталды."}, {"from": 2019, "to": 2019, "name": "Билік транзиті", "type": "event", "where": "Астана", "lon": 71.43, "lat": 51.13, "text": "2019 жылғы 19 наурызда Н. Назарбаев Президент өкілеттігін тоқтататынын мәлімдеді, 20 наурызда Сенат төрағасы Қ. Тоқаев Президент болды. 23 наурызда елорда Нұр-Сұлтан деп аталды."}, {"from": 2019, "to": 2019, "name": "Мерзімінен бұрын президент сайлауы", "type": "event", "where": "Бүкіл Қазақстан", "lon": 71.5, "lat": 51.2, "text": "2019 жылғы 9 маусымда Қ. Тоқаев 70,96% дауыспен Президент болып сайланды. Сайлау күндері Нұр-Сұлтан мен Алматыда наразылық білдірушілер ұсталды."}, {"from": 2019, "to": 2019, "name": "Арыстағы жарылыс", "type": "event", "where": "Түркістан облысы", "lon": 68.8, "lat": 42.43, "text": "2019 жылғы 24 маусымда Арыстағы әскери бөлімнің оқ-дәрі қоймасында жарылыс болып, қала тұрғындары көшірілді, адамдар қаза тапты."}, {"from": 2019, "to": 2019, "name": "«Халық үніне құлақ асатын мемлекет»", "type": "law", "where": "Нұр-Сұлтан", "lon": 71.44, "lat": 51.12, "text": "2019 жылғы 2 қыркүйектегі Жолдауда «Халық үніне құлақ асатын мемлекет» тұжырымдамасы ұсынылды; оған дейін, шілдеде, Ұлттық қоғамдық сенім кеңесі құрылған еді."}, {"from": 2020, "to": 2020, "name": "Қордайдағы қақтығыс", "type": "event", "where": "Жамбыл облысы", "lon": 75.3, "lat": 42.9, "text": "2020 жылғы 7–8 ақпанда Қордай ауданындағы бірнеше ауылда тұрмыстық жанжал жаппай төбелеске ұласып, 11 адам қаза тапты."}, {"from": 2020, "to": 2020, "name": "COVID-19 пандемиясы", "type": "event", "where": "Бүкіл Қазақстан", "lon": 69.0, "lat": 49.0, "text": "2020 жылғы 16 наурызда елде төтенше жағдай жарияланып, Нұр-Сұлтан мен Алматы карантинге жабылды. 2021 жылы ақпанда жаппай вакцинация басталды."}, {"from": 2021, "to": 2021, "name": "Өлім жазасы жойылды, әкімдер сайлауы", "type": "law", "where": "Бүкіл Қазақстан", "lon": 70.5, "lat": 47.8, "text": "2021 жылы өлім жазасы заң жүзінде толық алынып тасталды; 25 шілдеде ауыл әкімдерінің алғашқы тікелей сайлауы өтті."}, {"from": 2022, "to": 2022, "name": "Қаңтар оқиғасы", "type": "uprising", "where": "Маңғыстау, Алматы", "lon": 52.8, "lat": 43.34, "text": "2022 жылғы 2 қаңтарда Жаңаөзенде газ бағасының екі есе өсуіне қарсы басталған наразылық бүкіл елге тарады; Алматыда қарулы қақтығыс, тонау болды. ҰҚШҰ күштері шақырылды, ресми дерек бойынша 238 адам қаза тапты.", "route": [[52.8, 43.34], [51.17, 43.65], [57.2, 50.28], [65.5, 44.85], [69.6, 42.32], [71.37, 42.9], [76.95, 43.24]]}, {"from": 2022, "to": 2022, "name": "Алматыдағы қақтығыстар", "type": "uprising", "where": "Алматы", "lon": 76.95, "lat": 43.25, "text": "2022 жылғы 4–7 қаңтарда Алматыда әкімдік пен резиденция өртеліп, ең ауыр қақтығыстар болды. 5 қаңтарда Н. Назарбаев Қауіпсіздік Кеңесінің төрағалығынан босатылды."}, {"from": 2022, "to": 2022, "name": "«Жаңа Қазақстан» Жолдауы", "type": "law", "where": "Нұр-Сұлтан", "lon": 71.42, "lat": 51.11, "text": "2022 жылғы 16 наурызда Президент Жолдауында супер-президенттік басқарудан бас тартып, Конституциялық сотты қайтаруды ұсынды."}, {"from": 2022, "to": 2022, "name": "Ұлттық құрылтай, Ұлытау", "type": "event", "where": "Ұлытау", "lon": 66.92, "lat": 48.65, "text": "2022 жылғы 14 маусымда Ұлытауда Ұлттық құрылтайдың I отырысы өтті. Құрылтай — 2022–2026 жылдары Президент жанында жұмыс істеген қоғамдық кеңесші орган."}, {"from": 2022, "to": 2022, "name": "Конституциялық референдум", "type": "law", "where": "Бүкіл Қазақстан", "lon": 72.0, "lat": 49.5, "text": "2022 жылғы 5 маусымда Конституцияның 33 бабына түзетулерді 77,18% жақтады: Конституциялық сот қайтарылды, Тұңғыш Президенттің ерекше мәртебесі алынды, Президент туыстарына лауазым шектелді."}, {"from": 2022, "to": 2022, "name": "Абай, Ұлытау, Жетісу облыстары", "type": "law", "where": "Шығыс, Орталық Қазақстан, Жетісу", "lon": 67.71, "lat": 47.8, "text": "2022 жылғы 8 маусым const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- time scale ---- */
const KN=[[-1000000,0],[-10000,.08],[-3000,.15],[-1000,.23],[0,.33],[1200,.5],[1465,.58],[1800,.75],[1917,.85],[1991,.95],[2026,1]];
const y2t=y=>{for(let i=1;i<KN.length;i++){const[a,ta]=KN[i-1],[b,tb]=KN[i];if(y<=b)return ta+(tb-ta)*(y-a)/(b-a)}return 1};
const t2y=t=>{for(let i=1;i<KN.length;i++){const[a,ta]=KN[i-1],[b,tb]=KN[i];if(t<=tb)return a+(b-a)*(t-ta)/(tb-ta)}return 2026};
const snap=y=>y<-10000?Math.round(y/5000)*5000:y<-1000?Math.round(y/50)*50:y<0?Math.round(y/5)*5:Math.round(y);
const fmtY=y=>y<0?(y<=-10000?`б.з.б. ${Math.round(-y/1000).toLocaleString("ru")} мың жыл`:`б.з.б. ${-y} ж.`):`${y} ж.`;
const fmtR=(a,b)=>a===b?fmtY(a):(a<0&&b<0?`б.з.б. ${-a}–${-b} жж.`:a<0?`б.з.б. ${-a} – б.з. ${b} ж.`:`${a}–${b} жж.`);
const win=y=>y<-10000?60000:y<-3000?700:y<-1000?200:y<0?50:y<1200?30:y<1700?8:y<1900?3:1;

/* ---- data prep ---- */
const PAL=["c1","c2","c3","c4","c5","c6","c7","c8"];
const states=ATLAS.states.map((s,i)=>({...s,col:s.kind==="neighbor"?"nb":PAL[i%PAL.length]}));
const events=ATLAS.events.slice().sort((a,b)=>a.from-b.from);
const keyYears=[...new Set([].concat(events.map(e=>e.from),...states.map(s=>(s.rulers||[]).map(r=>r.from)),...states.map(s=>(s.capitals||[]).map(c=>c.from)),ATLAS.eras.map(e=>e.from)))].filter(y=>y>=-1000000&&y<=2026).sort((a,b)=>a-b);

/* ---- projection ---- */
const VIEWS={main:innerWidth<700?[46,37.5,89,56.5]:[44,35,96,57.5],wide:[-12,20,140,70]};
let view="main";
function proj(bb){let[w,s,e,n]=bb;const k=Math.cos((s+n)/2*Math.PI/180),W=1000,sc=W/((e-w)*k),H=Math.round((n-s)*sc);
  return{W,H,X:lon=>(lon-w)*k*sc,Y:lat=>(n-lat)*sc,bb}}
let P=proj(VIEWS[view]);
const pathOf=(rings,close)=>{const[w,s,e,n]=P.bb,pd=4;return rings.filter(r=>r.some(([x,y])=>x>w-pd&&x<e+pd&&y>s-pd&&y<n+pd)).map(r=>"M"+r.map(([x,y])=>P.X(x).toFixed(1)+" "+P.Y(y).toFixed(1)).join("L")+(close?"Z":"")).join("")};
const near=r=>{const[w,s,e,n]=P.bb;let a=1e9,b=-1e9,c=1e9,d=-1e9;for(const[x,y]of r){a=Math.min(a,x);b=Math.max(b,x);c=Math.min(c,y);d=Math.max(d,y)}return!(b<w-4||a>e+4||d<s-4||c>n+4)};
function sym(t,x,y,r){r=r||12;
  if(t==="battle")return`<path class="sym-battle" d="M${x-r} ${y-r}L${x+r} ${y+r}M${x+r} ${y-r}L${x-r} ${y+r}"/>`;
  if(t==="fort")return`<rect class="sym-fort" x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}"/>`;
  if(t==="site")return`<path class="sym-site" d="M${x} ${y-r*1.25}L${x+r*1.15} ${y+r*.85}L${x-r*1.15} ${y+r*.85}Z"/>`;
  if(t==="uprising")return`<path class="sym-uprising" d="M${x} ${y-r*1.3}L${x+r*.4} ${y-r*.4}L${x+r*1.3} ${y-r*.3}L${x+r*.6} ${y+r*.3}L${x+r*.8} ${y+r*1.2}L${x} ${y+r*.7}L${x-r*.8} ${y+r*1.2}L${x-r*.6} ${y+r*.3}L${x-r*1.3} ${y-r*.3}L${x-r*.4} ${y-r*.4}Z"/>`;
  if(t==="law")return`<rect class="sym-law" x="${x-r*.85}" y="${y-r*1.1}" width="${r*1.7}" height="${r*2.2}" rx="2"/>`;
  if(t==="migration")return`<circle class="sym-migration" cx="${x}" cy="${y}" r="${r*.8}"/>`;
  if(t==="capital")return`<circle class="sym-capital" cx="${x}" cy="${y}" r="${r*1.2}"/><circle cx="${x}" cy="${y}" r="${r*.45}" fill="var(--surface)"/>`;
  if(t==="city")return`<circle class="sym-city" cx="${x}" cy="${y}" r="${r*.9}"/>`;
  return`<path class="sym-event" d="M${x} ${y-r*1.3}L${x+r*1.3} ${y}L${x} ${y+r*1.3}L${x-r*1.3} ${y}Z"/>`;}
const icon=t=>`<svg viewBox="-16 -16 32 32" aria-hidden="true">${sym(t,0,0,11)}</svg>`;

function baseSVG(){
  const land=BASE.land.filter(near).map(r=>"M"+r.map(([x,y])=>P.X(x).toFixed(1)+" "+P.Y(y).toFixed(1)).join("L")+"Z").join("");
  return`<rect width="${P.W}" height="${P.H}" fill="var(--water)"/><path class="m-land" fill-rule="evenodd" d="${land}"/>`;}
function waterSVG(){return`<path class="m-lake" d="${pathOf(BASE.lakes,true)}"/><path class="m-river" d="${pathOf(BASE.rivers,false)}"/><path class="m-kz" d="${pathOf(BASE.kz,true)}"/>`}
function setupMap(){
  P=proj(VIEWS[view]);
  $("#map").innerHTML=`<svg viewBox="0 0 ${P.W} ${P.H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Тарихи карта"><defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--route)"/></marker></defs>${baseSVG()}<g id="gstates"></g>${waterSVG()}<g id="gdyn"></g></svg>`;
  $("#view").textContent=view==="main"?"Кең көрініс":"Қазақстанға жақындату";
}

/* ---- state at year ---- */
const active=(o,y)=>o.from<=y&&y<=o.to;
const inView=e=>{const[w,so,ea,n]=VIEWS.main;return e.lon>=w&&e.lon<=ea&&e.lat>=so&&e.lat<=n};
const nameAt=(s,y)=>{let n=s.name;for(const x of s.names||[])if(x.from<=y)n=x.name;return n};
const pick=(arr,y)=>{let best=null;for(const a of arr||[])if(a.from<=y&&y<=a.to&&(!best||a.from>=best.from))best=a;return best};
function shapeAt(s,y){const sh=pick(s.shapes,y);return sh&&sh.coords&&sh.coords.length>2?sh.coords:null}
function eventsAt(y){const w=win(y);return events.filter(e=>e.from<=y&&e.to>=y-w)}
function eraAt(y){let best=null;for(const e of ATLAS.eras)if(e.from<=y&&y<=e.to&&(!best||e.from>=best.from))best=e;return best}

/* ---- render ---- */
let Y=1822, hlIdx=null;
function draw(){
  const y=Y, W=P.W, H=P.H, X=P.X, YY=P.Y;
  const act=states.filter(s=>active(s,y));
  // states
  let gs="",labs=[];
  const order=act.filter(s=>s.kind==="neighbor").concat(act.filter(s=>s.kind!=="neighbor"));
  for(const s of order){const c=shapeAt(s,y);if(!c)continue;
    const d="M"+c.map(([a,b])=>X(a).toFixed(1)+" "+YY(b).toFixed(1)).join("L")+"Z";
    gs+=s.col==="nb"?`<path class="m-state nb" d="${d}"/>`:`<path class="m-state" d="${d}" style="fill:var(--${s.col});fill-opacity:.2;stroke:var(--${s.col})"/>`;
    let cx=0,cy=0,n=0;for(const[a,b]of c){const px=X(a),py=YY(b);if(px>-50&&px<W+50&&py>-50&&py<H+50){cx+=px;cy+=py;n++}}
    if(n){labs.push({s,cx:cx/n,cy:cy/n})}}
  $("#gstates").innerHTML=gs;
  // labels placement
  const boxes=[],fits=b=>b.x>=2&&b.x+b.w<=W-2&&b.y>=2&&b.y+b.h<=H-2&&!boxes.some(q=>b.x<q.x+q.w&&q.x<b.x+b.w&&b.y<q.y+q.h&&q.y<b.y+b.h);
  const clamp=b=>({...b,x:Math.max(4,Math.min(W-b.w-4,b.x)),y:Math.max(4,Math.min(H-b.h-4,b.y))});
  const tw=(t,fs)=>[...t].length*fs*.6;
  const place=c=>{for(const b of c)if(fits(b)){boxes.push(b);return b}return null};
  boxes.push({x:0,y:0,w:230,h:60},{x:W-260,y:0,w:260,h:56}); // year badge + button
  let dyn="",txt="";
  // capitals
  const caps=[];for(const s of act){const c=pick(s.capitals,y);if(c)caps.push({...c,s})}
  caps.forEach(c=>{c.px=X(c.lon);c.py=YY(c.lat);boxes.push({x:c.px-16,y:c.py-16,w:32,h:32})});
  // events
  const evs=eventsAt(y).slice(-14);
  evs.forEach(e=>{if(e.lon!=null){e.px=X(e.lon);e.py=YY(e.lat);boxes.push({x:e.px-15,y:e.py-15,w:30,h:30})}});
  for(const e of evs)if(e.route&&e.route.length>1)dyn+=`<path class="m-route" d="M${e.route.map(([a,b])=>X(a).toFixed(1)+" "+YY(b).toFixed(1)).join("L")}" marker-end="url(#ah)" opacity="${e.to>=y-win(y)/3?1:.55}"/>`;
  // state names
  for(const l of labs){const fs=l.s.col==="nb"?27:31,t=nameAt(l.s,y),wd=tw(t,fs),h=fs+6;const c=[];for(const dy of[0,1,-1,2,-2])for(const dx of[0,-.6,.6])c.push(clamp({x:l.cx-wd/2+dx*wd,y:l.cy-h/2+dy*h,w:wd,h}));
    const b=place(c);if(b)txt+=`<text class="m-sname ${l.s.col==="nb"?"nb":""}" x="${b.x.toFixed(0)}" y="${(b.y+fs).toFixed(0)}" ${l.s.col!=="nb"?`style="fill:var(--${l.s.col})"`:""}>${esc(t)}</text>`}
  // capitals symbols + names
  for(const c of caps){dyn+=sym("capital",c.px,c.py,12);const fs=26,wd=tw(c.name,fs),h=fs+4;
    const b=place([{x:c.px+18,y:c.py-h/2,w:wd,h},{x:c.px-18-wd,y:c.py-h/2,w:wd,h},{x:c.px-wd/2,y:c.py-22-h,w:wd,h},{x:c.px-wd/2,y:c.py+20,w:wd,h}]);
    if(b)txt+=`<text class="m-cap" x="${b.x.toFixed(0)}" y="${(b.y+fs-3).toFixed(0)}">${esc(c.name)}</text>`}
  // events
  evs.forEach((e,i)=>{if(e.lon==null)return;const fresh=e.to>=y-win(y)/3;const op=fresh?1:.6;
    dyn+=`<g class="ev-g${hlIdx===events.indexOf(e)?" hl":""}" opacity="${op}"><circle class="hlring" cx="${e.px}" cy="${e.py}" r="24"/>${sym(e.type,e.px,e.py,12)}</g>`;
    const yr=e.from<0?"":` ${e.from}`,t=e.name,fs=25,wd=tw(t+yr,fs),h=fs+4,x=e.px,yy=e.py;
    const b=place([{x:x+18,y:yy-h/2,w:wd,h},{x:x-18-wd,y:yy-h/2,w:wd,h},{x:x-wd/2,y:yy-22-h,w:wd,h},{x:x-wd/2,y:yy+20,w:wd,h},{x:x+14,y:yy-h-12,w:wd,h},{x:x+14,y:yy+12,w:wd,h},{x:x-14-wd,y:yy-h-12,w:wd,h},{x:x-14-wd,y:yy+12,w:wd,h}]);
    if(b)txt+=`<text class="m-ev" opacity="${op}" x="${b.x.toFixed(0)}" y="${(b.y+fs-3).toFixed(0)}">${esc(t)}${yr?`<tspan>${yr}</tspan>`:""}</text>`});
  $("#gdyn").innerHTML=dyn+txt;
  $("#ybadge").textContent=fmtY(y);
  panel(y,act,evs);
}
function panel(y,act,evs){
  const er=eraAt(y);$("#eraname").textContent=er?er.name:fmtY(y);$("#eratext").textContent=er?er.text:"";
  document.querySelectorAll("#eras .chip").forEach(c=>c.classList.toggle("on",er&&c.dataset.from==er.from));
  const rl=[];
  for(const s of act.filter(s=>s.kind!=="neighbor").concat(act.filter(s=>s.kind==="neighbor"))){const r=pick(s.rulers,y),c=pick(s.capitals,y);if(!r&&!(s.kind!=="neighbor"&&c))continue;
    rl.push(`<li><i style="background:${s.col==="nb"?"var(--nb)":"var(--"+s.col+")"}"></i><div><div class="st">${esc(nameAt(s,y))}${c?` · астанасы ${esc(c.name)}`:""}</div>${r?`<b>${esc(r.name)}</b> <span class="y">${esc(fmtR(r.from,r.to))}</span>${r.did?`<div>${esc(r.did)}</div>`:""}`:""}</div></li>`)}
  $("#rulers").innerHTML=rl.join("")||`<li class="empty">Бұл кезеңде мемлекет жоқ немесе билеушісі белгісіз.</li>`;
  const list=eventsAt(y).slice().reverse(),groups={};
  for(const e of list){const g=e.where||"Басқа";(groups[g]=groups[g]||[]).push(e)}
  $("#events").innerHTML=Object.keys(groups).length?Object.entries(groups).map(([g,arr])=>`<div class="grp"><h4>${esc(g)}</h4><ul class="evs">${arr.map(e=>`<li data-i="${events.indexOf(e)}" class="${e.from<=y&&e.to>=y?"now":""}${hlIdx===events.indexOf(e)?" hl":""}">${icon(e.type)}<div><b>${esc(e.name)}</b> <span class="y">${esc(fmtR(e.from,e.to))}</span>${e.lon!=null&&view==="main"&&!inView(e)?` <span class="st">· «Кең көрініс» картасында</span>`:""}<p>${esc(e.text)}</p></div></li>`).join("")}</ul></div>`).join(""):`<p class="empty">Осы жылдары картаға түсетін оқиға жоқ. «Келесі ▶» батырмасымен ең жақын оқиғаға өтіңіз.</p>`;
}

/* ---- controls ---- */
const slider=$("#slider");
function setYear(y,fromSlider){Y=Math.max(-1000000,Math.min(2026,y));hlIdx=null;if(!fromSlider)slider.value=Math.round(y2t(Y)*1000);draw();
  try{history.replaceState(null,"","#y"+Y)}catch(_){}}
slider.addEventListener("input",()=>setYear(snap(t2y(slider.value/1000)),true));
const nextY=y=>keyYears.find(k=>k>y), prevY=y=>[...keyYears].reverse().find(k=>k<y);
$("#next").addEventListener("click",()=>{const n=nextY(Y);if(n!=null)setYear(n)});
$("#prev").addEventListener("click",()=>{const p=prevY(Y);if(p!=null)setYear(p)});
let timer=null;
$("#play").addEventListener("click",()=>{if(timer){clearInterval(timer);timer=null;$("#play").textContent="▶ Ойнату";return}
  $("#play").textContent="❚❚ Тоқтату";timer=setInterval(()=>{const n=nextY(Y);if(n==null){clearInterval(timer);timer=null;$("#play").textContent="▶ Ойнату";return}setYear(n)},1800)});
$("#view").addEventListener("click",()=>{view=view==="main"?"wide":"main";setupMap();draw()});
$("#events").addEventListener("click",e=>{const li=e.target.closest("li[data-i]");if(!li)return;hlIdx=+li.dataset.i;draw();$("#mapbox").scrollIntoView({block:"nearest",behavior:"smooth"})});
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"&&e.target!==slider)return;if(e.key==="ArrowRight"&&e.shiftKey){$("#next").click();e.preventDefault()}if(e.key==="ArrowLeft"&&e.shiftKey){$("#prev").click();e.preventDefault()}});

// ticks, eras, khans
$("#ticks").innerHTML=[[-1000000,"Палеолит"],[0,"0"],[1465,"1465"],[1917,"1917"],[2026,"2026"]].map(([y,t])=>`<span style="left:${y2t(y)*100}%">${t}</span>`).join("");
$("#eras").innerHTML=ATLAS.eras.slice().sort((a,b)=>a.from-b.from).map(e=>`<button class="chip" data-from="${e.from}">${esc(e.name)}</button>`).join("");
$("#eras").addEventListener("click",e=>{const c=e.target.closest(".chip");if(c)setYear(+c.dataset.from)});
const KH=["kazakh-khanate","kishi-zhuz","orta-zhuz","uly-zhuz","bukei-orda"];
const kh=[];let khHtml="";
for(const id of KH){const s=states.find(s=>s.id===id);if(!s)continue;const seen=new Set();
  const rs=(s.rulers||[]).filter(r=>!/кеңес/i.test(r.name)).sort((a,b)=>a.from-b.from).filter(r=>{const k=r.name.replace(/\s*\(.*?\)/g,"");if(seen.has(k))return false;seen.add(k);return true});
  if(!rs.length)continue;
  khHtml+=`<div class="grp"><h4>${esc(nameAt(s,s.from))}</h4><div class="khans">${rs.map(r=>{kh.push(r);return`<button class="chip" data-i="${kh.length-1}">${esc(r.name)} <span class="y">${r.from}</span></button>`}).join("")}</div></div>`}
$("#khans").outerHTML=`<div id="khans">${khHtml||'<p class="empty">Дерек жоқ.</p>'}</div>`;
$("#khans").addEventListener("click",e=>{const c=e.target.closest(".chip");if(c){setYear(kh[+c.dataset.i].from);$("#mapbox").scrollIntoView({block:"start",behavior:"smooth"})}});

setupMap();
const h=(location.hash||"").match(/^#y(-?\d+)$/);
setYear(h?+h[1]:1822);
</script>
</html>
